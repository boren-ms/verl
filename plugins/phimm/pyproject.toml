[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "verl-phimm-asr"
version = "0.1.0"
description = "Selected Qwen audio ReMax recipe for verl's agent loop trainer"
requires-python = ">=3.12"
dependencies = ["opencc-python-reimplemented==0.1.7", "wetext==0.2.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["recipe*", "hydra_plugins*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.yaml"]
