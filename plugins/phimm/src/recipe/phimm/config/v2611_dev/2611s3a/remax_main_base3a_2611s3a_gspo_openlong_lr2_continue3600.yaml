# @package _global_
# Base3a ReMax + GSPO LR2x, initialized from 2611s3a merged step 40.
# Continue the completed 1800-step run to absolute step 3600 with full training state.
# All recipe overrides are defined here on top of base.yaml.

defaults:
  - ../base@_global_
  - /data/base3a@_global_
  - /data/val_data/openasr/openlong_seg_verb_langhint_zip@_gspo_openlong
  - _self_

actor_rollout_ref:
  actor:
    optim:
      lr: 1.2e-6
    policy_loss:
      loss_mode: gspo
    loss_agg_mode: seq-mean-token-mean
    clip_ratio_low: 3.0e-4
    clip_ratio_high: 4.0e-4
  model:
    path: az://orngwus2cresco/data/speech/projects/xiaojul/amlt-results/fast-llm-2611-qwen3-5-9b-s2-vi-vn-it-it-flashenc-s2init-sft-only-contlora-mtpunfrozen-adapterfrozen-40steps-bv-notxt-lid/40_merged/qwen_hf/

algorithm:
  adv_estimator: remax
  rollout_correction:
    bypass_mode: false

data:
  val_data:
    - ${_gspo_openlong}
    # Select only AISHELL-1 from the shared Chinese hard-validation cohort.
    - ${_zh_hard_val.0}
    - ${_urgent_delta}

reward_map:
  noisy_ls: train_librispeech
  earn_fy27: train_librispeech
  quartr_1st23: train_librispeech
  quartr_2nd48: train_librispeech
  quartr_3rd38: train_librispeech
  aishell1_train_top10k: train_aishell1_char

trainer:
  experiment_name: remax_main_base3a_2611s3a_gspo_openlong_lr2_steps2
  nnodes: 4
  n_gpus_per_node: 8
  total_training_steps: 3600
  # Eight epochs provide 3472 batches; allow the ninth to reach step 3600.
  total_epochs: 9
  resume_mode: resume_path
  resume_from_path: az://orngwus2cresco/data/boren/outputs/v2611/remax_main_base3a_2611s3a_gspo_openlong_lr2_steps2/global_step_1800
  save_freq: 100
  test_freq: 200
  val_before_train: true
  val_only: false

asr:
  expected_training_rows: 55664
  expected_training_steps: 3600
