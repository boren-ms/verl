# @package _global_
# Complete en-US-entity-v3 recordings decoded from the existing VAD clips.
# Independent segment decoding; parent-level official DTER and verbatim EER.
defaults:
  - eval_base
  - /data/val_data/inhouse/english_entity_presegment@_entity
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2611/amlt-results/fast-llm-2611-qwen9b-flashenc-mtp-s2-data-v3-8-2-1-shadow/38000/qwen_hf/
    lora_rank: 0

data:
  # Retain complete source clips; ASRDataset's full-reference guard forbids truncation.
  max_audio_dur: 60
  max_prompt_length: 2048
  dataloader_num_workers: 0
  val_data:
    - ${_entity}

asr:
  context_aware:
    enable: false

rewards:
  val_inhouse_entity:
    path: recipe/phimm/reward/asr_inhouse_measure.py
    name: eval_score
    reward_kwargs:
      version: 2609
      locale: en-us
      compute_eer: true
      strict_eer: true

trainer:
  experiment_name: eval_2611v1_inhouse_entity_longform
  nnodes: 2
  n_gpus_per_node: 8
  resume_mode: disable

reward_map:
