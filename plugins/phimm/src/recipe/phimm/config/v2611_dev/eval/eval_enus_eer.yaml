# @package _global_
# Only the five en-US EER workbook datasets, using existing pre-segmented clips.
# Independent segment decoding; parent-level DTER and workbook nondisfluency EER.
defaults:
  - eval_base
  - /data/val_data/inhouse/eer@_entity
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2611/amlt-results/fast-llm-2611-qwen9b-flashenc-mtp-s2-data-v3-8-2-1-shadow/38000/qwen_hf/
    lora_rank: 0

data:
  # Retain complete source clips; ASRDataset's full-reference guard forbids truncation.
  max_audio_dur: 60
  max_prompt_length: 2048
  dataloader_num_workers: 0
  val_data:
    - ${_entity}

asr:
  context_aware:
    enable: false

# Replace inherited scorer registries rather than merging unrelated entries.
rewards: ${_inhouse_rewards}
_inhouse_rewards:
  val_inhouse_entity:
    path: recipe/phimm/reward/asr_inhouse_measure.py
    name: eval_score
    reward_kwargs:
      locale: en-us
      compute_eer: true
      strict_eer: true
      eer_reference: display
      eer_mode: nondisfluency

trainer:
  experiment_name: eval_enus_eer
  nnodes: 2
  n_gpus_per_node: 8
  resume_mode: disable

reward_map: ${_inhouse_reward_map}
_inhouse_reward_map:
  banking: val_inhouse_entity
  medical: val_inhouse_entity
  shiproom: val_inhouse_entity
  product: val_inhouse_entity
  meetings: val_inhouse_entity
