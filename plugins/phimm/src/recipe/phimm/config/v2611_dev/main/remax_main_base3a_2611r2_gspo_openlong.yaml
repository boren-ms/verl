# @package _global_
# ReMax greedy-baseline advantages with the sequence-level GSPO policy loss.
# The training mix and regularization inherit the Base3a control recipe.

defaults:
  - remax_main_base3a_2611r2
  - /data/val_data/openasr/openlong_seg_verb_langhint_zip@_gspo_openlong
  - _self_

actor_rollout_ref:
  actor:
    policy_loss:
      loss_mode: gspo
    loss_agg_mode: seq-mean-token-mean
    clip_ratio_low: 3.0e-4
    clip_ratio_high: 4.0e-4

algorithm:
  adv_estimator: remax
  rollout_correction:
    bypass_mode: false

data:
  val_data:
    - ${_gspo_openlong}

trainer:
  experiment_name: remax_main_base3a_2611r2_gspo_openlong
  total_training_steps: 868
  save_freq: 100
  test_freq: 200
  val_only: false
