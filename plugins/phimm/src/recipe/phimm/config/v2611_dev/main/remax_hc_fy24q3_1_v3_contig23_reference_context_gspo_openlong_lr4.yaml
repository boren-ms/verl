# @package _global_
# Human Caption V3 contig23 based on Earnings reference-context ReMax + GSPO.
# Baseline: Contig23 GSPO thread 01a213b8-98df-7f61-a69c-d500729d7728.
# LR 2.4e-6 = 4x the original 6e-7; explicit target remains 3472 updates.
