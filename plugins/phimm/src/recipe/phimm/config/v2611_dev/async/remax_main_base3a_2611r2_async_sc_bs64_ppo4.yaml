# @package _global_
# SC baseline segmentation with colocated async, batch size 64 and four PPO epochs.
# Keep two training epochs: floor(55,664 / 64) * 2 = 1,738 trainer steps.

defaults:
  - remax_main_base3a_2611r2_async@_global_
  - _self_

actor_rollout_ref:
  actor:
    ppo_epochs: 4

data:
  train_batch_size: 64
  random_segment:
    segment_count: [1, 2]
    segment_len: null
    even_split: false
    seed: 42
  max_audio_dur: null

trainer:
  experiment_name: remax_main_base3a_2611r2_async_sc_bs64_ppo4

asr:
  expected_training_steps: 1738
