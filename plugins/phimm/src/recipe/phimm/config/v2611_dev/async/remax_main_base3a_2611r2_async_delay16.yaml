# @package _global_
# Base3a colocated async variant with more rollout lookahead and stale-data tolerance.
# Inherit the original async recipe, data, reward, optimizer batch, and update budget.

defaults:
  - remax_main_base3a_2611r2_async
  - _self_

trainer:
  experiment_name: remax_main_base3a_2611r2_async_delay16
  v1:
    colocate_async:
      # Seed two optimizer batches (2 x 128 prompts) instead of one.
      # Each training step also submits one batch before sampling.
      # More lookahead lets fast prompts fill a batch while slow prompts continue.
      num_warmup_batches: 2
    sampler:
      # Accept prompt age = current_step - submission_step + 1 up to 16
      # model versions (original: 8). This is not a wall-clock timeout.
      max_off_policy_threshold: 16
      # Retain bounded stale-data dropping rather than blocking on slow prompts.
      max_off_policy_strategy: drop
