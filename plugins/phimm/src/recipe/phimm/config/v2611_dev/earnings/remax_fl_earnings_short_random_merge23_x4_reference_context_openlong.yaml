# @package _global_
# Fixed preceding reference text for training and full OpenLong validation.
defaults:
  - remax_fl_earnings_short_random_merge23_x4_text_history2
  - /data/train_data/foreign/fl_earnings_short_random_merge23_x4_reference_text_v2@_fl_earnings_reference_text_train
  - /data/val_data/openasr/openlong_reference_context_zip@_fl_earnings_reference_openlong
  - _self_

data:
  train_data:
    - ${_fl_earnings_reference_text_train}
  val_data:
    - ${_fl_earnings_reference_openlong}

asr:
  context_aware:
    enable: true
    mode: text
    max_history: 2
    training_source: reference
    validation_source: reference

trainer:
  experiment_name: remax_fl_earnings_short_random_merge23_x4_reference_context_openlong
  save_freq: 100
  test_freq: 400
