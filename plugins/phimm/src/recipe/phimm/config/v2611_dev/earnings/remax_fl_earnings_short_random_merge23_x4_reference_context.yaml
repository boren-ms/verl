  - /data/train_data/foreign/fl_earnings_short_random_merge23_x4_reference_context@_fl_earnings_reference_train
  - _self_

data:
  train_data:
    - ${_fl_earnings_reference_train}

asr:
  context_aware:
    enable: true
    mode: text
    max_history: 1
    training_source: reference

trainer:
