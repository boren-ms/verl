# @package _global_
# Contig23 generated text history2 with GSPO, double LR and four times the updates.
defaults:
  - /v2611_dev/earnings/base_earning
  - /data/train_data/offline_audio/earnings_short_contiguous23@_contiguous_train
  - /data/val_data/openasr/openlong_seg_verb_langhint_zip@_openlong_gspo
  - _self_

data:
  mix:
    - shuffle: true
      datasource:
        - {name: earn_fy27, sample: 9568, shuffle: true}
        - {name: quartr_1st23, sample: 3125, shuffle: true}
        - {name: quartr_2nd48, sample: 6392, shuffle: true}
        - {name: quartr_3rd38, sample: 6155, shuffle: true}
  train_data: ${_contiguous_train}
  max_audio_dur: null
  # Leave room for the audio prompt and two previous generated transcripts.
  max_prompt_length: 4096
  val_data:
    - ${_openlong_gspo}

actor_rollout_ref:
  actor:
    optim:
      lr: 1.2e-6
    policy_loss:
      loss_mode: gspo
    loss_agg_mode: seq-mean-token-mean
    clip_ratio_low: 3.0e-4
    clip_ratio_high: 4.0e-4
    ppo_max_token_len_per_gpu: ${data.max_model_length}
  ref:
    log_prob_max_token_len_per_gpu: ${data.max_model_length}

algorithm:
  adv_estimator: remax
  rollout_correction:
    bypass_mode: false

asr:
  expected_training_steps: 1576
  context_aware:
    enable: true
    mode: text
    max_history: 2
    training_source: generated
    validation_source: generated

trainer:
  experiment_name: remax_earnings_short_contiguous23_text_history2_gspo
  save_freq: 100
  test_freq: 200
  # floor(25,240 / 128) = 197 updates per epoch; 8 epochs give 4 * 394.
  total_epochs: 8
  total_training_steps: 1576
  resume_mode: disable
  resume_from_path: null
