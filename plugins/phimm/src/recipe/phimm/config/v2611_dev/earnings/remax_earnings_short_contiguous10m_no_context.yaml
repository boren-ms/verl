# @package _global_
# Consecutive short clips within each recording, at most 600 s per parent.
defaults:
  - base_earning
  - /data/train_data/offline_audio/earnings_contiguous10m@_contiguous10m_train
  - _self_

data:
  train_data: ${_contiguous10m_train}
  train_batch_size: 4
  max_audio_dur: null
  mix:
    - shuffle: true
      datasource:
        - {name: earn_fy27, sample: 234, shuffle: true}
        - {name: quartr_1st23, sample: 102, shuffle: true}
        - {name: quartr_2nd48, sample: 242, shuffle: true}
        - {name: quartr_3rd38, sample: 228, shuffle: true}

trainer:
  experiment_name: remax_earnings_short_contiguous10m_no_context
  # 806 parents / batch4 = 201 full batches per epoch, 402 updates total.
  total_training_steps: null
  total_epochs: 2
  resume_mode: disable
  resume_from_path: null

asr:
  context_aware:
    enable: false
  expected_training_rows: 806
  expected_training_steps: 402
