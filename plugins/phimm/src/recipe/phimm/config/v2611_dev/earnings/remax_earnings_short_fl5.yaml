# @package _global_
# Earnings-only short-form FL5: [2, 30] seconds, with at least one cut.
# Recordings shorter than 4 seconds are split into two shorter halves.

defaults:
- base_earning
- /data/train_data/offline_audio/earnings_short_fl5@_offline_train_dc77b55ce0
- _self_
data:
  mix:
    - shuffle: true
      datasource:
        - {name: earn_fy27, sample: 9568, shuffle: true}
        - {name: quartr_1st23, sample: 3125, shuffle: true}
        - {name: quartr_2nd48, sample: 6392, shuffle: true}
        - {name: quartr_3rd38, sample: 6155, shuffle: true}
  train_data: ${_offline_train_dc77b55ce0}
trainer:
  experiment_name: remax_earnings_short_fl5
