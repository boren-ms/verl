# @package _global_
# Fresh Mix4 Context ON run from base38000 with ReMax advantages and GSPO loss.
# Train 2000 updates on 32 GPUs with the Mix4 LR of 1.2e-6.
defaults:
  - /v2611_dev/base@_global_
  - /data/train_data/short_orignal@_short_orignal_train
  - /data/train_data/flshort_rm23x4@_flshort_rm23x4_train
  - /data/train_data/contig5@_contig5_train
  - /data/train_data/short_rs23@_short_rs23_train
  - /data/val_data/openasr/openlong_seg_verb_langhint_zip@_openlong
  - _self_

data:
  train_batch_size: 128
  max_prompt_length: 4096
  max_audio_dur: null
  train_data:
    - ${_short_orignal_train}
    - ${_flshort_rm23x4_train}
    - ${_contig5_train}
    - ${_short_rs23_train}
  mix:
    - shuffle: true
      datasource:
        - {name: short_orignal, sample: 25000, shuffle: true}
        - {name: flshort_rm23x4, sample: 50000, shuffle: true}
        - {name: contig5, sample: 25000, shuffle: true}
        - {name: short_rs23, sample: 25000, shuffle: true}
  val_data:
    - ${_openlong}

reward_map:
  short_orignal: train_librispeech
  flshort_rm23x4: train_librispeech
  contig5: train_librispeech
  short_rs23: train_librispeech

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2611/amlt-results/fast-llm-2611-qwen9b-flashenc-mtp-s2-data-v3-8-2-1-shadow/38000/qwen_hf/
  actor:
    optim:
      lr: 1.2e-6
    ppo_mini_batch_size: 512
    ppo_max_token_len_per_gpu: ${data.max_model_length}
    policy_loss:
      loss_mode: gspo
    loss_agg_mode: seq-mean-token-mean
    clip_ratio_low: 3.0e-4
    clip_ratio_high: 4.0e-4
  ref:
    log_prob_max_token_len_per_gpu: ${data.max_model_length}

algorithm:
  adv_estimator: remax
  rollout_correction:
    bypass_mode: false

asr:
  context_aware:
    enable: true
    mode: text
    max_history: 4
    training_source: generated
    validation_source: generated
  expected_training_rows: 125000
  expected_training_steps: 2000

trainer:
  experiment_name: remax-mix4-ctxon-bs128-ppo512-32gpu-20261124-gspo-from-base38000
  nnodes: 4
  n_gpus_per_node: 8
  # 976 batches per epoch; allow a third epoch and stop at step 2000.
  total_epochs: 3
  total_training_steps: 2000
  save_freq: 100
  test_freq: 400
  val_only: false
  resume_mode: disable
  resume_from_path: null
