# @package _global_
# One parent per recording, using ordered lists of existing short audio segments.
# No history for sampled training, ReMax greedy baseline, or validation.
defaults:
  - base_earning
  - /data/train_data/offline_audio/earnings_contiguous_full@_contiguous_full_train
  - _self_

data:
  train_data: ${_contiguous_full_train}
  train_batch_size: 2
  max_audio_dur: null
  mix:
    - shuffle: true
      datasource:
        - {name: earn_fy27, sample: 74, shuffle: true}
        - {name: quartr_1st23, sample: 23, shuffle: true}
        - {name: quartr_2nd48, sample: 48, shuffle: true}
        - {name: quartr_3rd38, sample: 35, shuffle: true}

trainer:
  experiment_name: remax_earnings_short_contiguous_full_no_context
  # 180 full-recording parents / batch2 = 90 updates per epoch, 360 total.
  total_training_steps: null
  total_epochs: 4
  resume_mode: disable
  resume_from_path: null

asr:
  context_aware:
    enable: false
  expected_training_rows: 180
  expected_training_steps: 360
