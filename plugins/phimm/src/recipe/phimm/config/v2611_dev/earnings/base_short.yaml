# @package _global_
# Shared Earnings/Quartr short-form data and training settings.
# Segment variants provide their own segmentation settings and experiment name.

defaults:
  - ../main/remax_main_base3a_2611r2
  - _self_

data:
  train_batch_size: 128
  max_audio_dur: null
  random_segment:
    segment_count: null
    seed: 42
    num_proc: 16
  train_data:
    - ${_earning_train}
    - ${_quartr_first23_train}
    - ${_quartr_second48_train}
    - ${_quartr_third38_train}
  mix:
    - shuffle: true
      datasource:
        - {name: earn_fy27, sample: 9568, shuffle: true}
        - {name: quartr_1st23, sample: 3125, shuffle: true}
        - {name: quartr_2nd48, sample: 6392, shuffle: true}
        - {name: quartr_3rd38, sample: 6155, shuffle: true}
  val_data:
    - ${_openlong}

trainer:
  total_epochs: 2
  total_training_steps: 394
  val_only: false
  resume_mode: auto
  resume_from_path: null

asr:
  expected_training_rows: 25240
  expected_training_steps: 394
