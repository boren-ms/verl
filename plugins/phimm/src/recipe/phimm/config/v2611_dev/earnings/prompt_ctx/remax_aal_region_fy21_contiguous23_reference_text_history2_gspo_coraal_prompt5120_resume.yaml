# @package _global_
# Resume the existing AAL run without truncating its expanded acoustic prompt.
# The observed 4,589-token prompt exceeds the original 4,096-token budget.
# A verified complete checkpoint must be supplied with trainer.resume_from_path.
defaults:
  - remax_aal_region_fy21_contiguous23_reference_text_history2_gspo_coraal
  - _self_

data:
  max_prompt_length: 5120

trainer:
  resume_mode: resume_path
  resume_from_path: null
  # Complete the interrupted checkpoint-step validation before the next update.
  val_before_train: true
