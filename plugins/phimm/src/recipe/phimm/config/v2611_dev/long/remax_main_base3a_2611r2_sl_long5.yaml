# @package _global_
# Replace the five short-form Earnings/Quartr batches in Base3a SL with long-form parents.
# Retain SL's random 5-30 second partitions, full-parent references, and all other controls.
# 20,424 noisy LS + 739 long-form parents + 10,000 AISHELL = 31,163 parent rows.
# Two epochs at batch128 give floor(31,163 / 128) * 2 = 486 optimizer updates.

defaults:
  - ../main/remax_main_base3a_2611r2_sl
  - /data/train_data/earn_fy26_batch1@_earn_fy26_batch1_long_train
  - /data/train_data/earn_fy26_batch2@_earn_fy26_batch2_long_train
  - /data/train_data/quartr_1st23_long@_quartr_first23_long_train
  - /data/train_data/quartr_2nd48_long@_quartr_second48_long_train
  - /data/train_data/quartr_3rd38_long@_quartr_third38_long_train
  - _self_

data:
  random_segment:
    # Parallelize header IO; seed + original row index preserves identical partitions.
    num_proc: 16
  train_data:
    - ${_noisy_ls_train}
    - ${_earn_fy26_batch1_long_train}
    - ${_earn_fy26_batch2_long_train}
    - ${_quartr_first23_long_train}
    - ${_quartr_second48_long_train}
    - ${_quartr_third38_long_train}
    - ${_aishell_train}
  mix:
    - shuffle: true
      datasource:
        - {name: noisy_ls, sample: 20424, shuffle: true}
        - {name: earn_fy26_batch1, sample: 80, shuffle: true}
        - {name: earn_fy26_batch2, sample: 104, shuffle: true}
        - {name: quartr_1st23_long, sample: 98, shuffle: true}
        - {name: quartr_2nd48_long, sample: 235, shuffle: true}
        - {name: quartr_3rd38_long, sample: 222, shuffle: true}
        - {name: aishell1_train_top10k, sample: 10000, shuffle: true}

reward_map:
  earn_fy26_batch1: train_librispeech
  earn_fy26_batch2: train_librispeech
  quartr_1st23_long: train_librispeech
  quartr_2nd48_long: train_librispeech
  quartr_3rd38_long: train_librispeech

trainer:
  experiment_name: remax_main_base3a_2611r2_sl_long5_20261114

asr:
  expected_training_rows: 31163
  expected_training_steps: 486
