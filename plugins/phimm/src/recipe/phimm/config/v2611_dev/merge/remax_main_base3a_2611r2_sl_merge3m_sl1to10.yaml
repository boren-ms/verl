# @package _global_
# Merge 3M: offline parents strictly below 180 seconds, then SL 1-10 seconds.
# User-confirmed FL means SL; retain the Base3a SL model/reward/optimizer recipe.
defaults:
  - remax_main_base3a_2611r2_sl_offline_merge3m
  - /data/train_data/offline_audio/main_base3a_2611r2_sl_merge3m_sl1to10@_offline_train_ccff60139d
  - _self_

data:
  train_data: ${_offline_train_ccff60139d}
  # 3,548 parents; drop_last=true: floor(3548 / 16) * 2 = 442 updates.
  train_batch_size: 16
  gen_batch_size: 16
actor_rollout_ref:
  actor:
    ppo_mini_batch_size: 16

trainer:
  experiment_name: remax_main_base3a_2611r2_sl_merge3m_sl1to10
