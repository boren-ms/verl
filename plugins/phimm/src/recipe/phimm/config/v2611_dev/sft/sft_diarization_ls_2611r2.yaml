# @package _global_
# Full six-source diarization SFT plus the existing LibriSpeech RIR/noise data.
# Diarization: 2,044,319 clips / 8,862.649 clip hours (full_v1 audio audit).
# AMI dev: 2,070 clips / 8.919 hours, held out from training.
# LS uses the complete manifest, without Base3a's 20,424-row sampling budget.
# All sources use the same speaker JSONL prompt and target schema. LS uses
# spk=1, start=0 and end=decoded waveform duration in integer 10 ms units.

defaults:
  - sft_base3a_2611r2
  - /data/train_data/diarization@_diarization_train: moe_en_full
  - /data/train_data/diarization@_ls_train: ls_rir_speaker_jsonl
  - /data/val_data/diarization@data.val_data: moe_en_full_ami_dev
  - _self_

data:
  train_data:
    - ${_diarization_train}
    - ${_ls_train}
  mix: null
  shuffle: true
  sft_target_format: speaker_jsonl
  # Successful AMI recovery setting: reduce concurrent activation memory
  # through dynamic microbatching while keeping global batch size 128.
  max_token_len_per_gpu: 2048

trainer:
  experiment_name: sft_diarization_ls_2611r2
  nnodes: 4
  n_gpus_per_node: 8
