# @package _global_
# Evaluate the unchanged 2611r2 HF checkpoint, without LoRA.
defaults:
- /v2611_dev/eval/eval_base@_global_
- /data/val_data/biasing/ls_none@_ls_none
- /data/val_data/biasing/ls_before@_ls_before
- /data/val_data/biasing/ls_after@_ls_after
- _self_
actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2611/amlt-results/fast-llm-2611-qwen9b-flashenc-mtp-s2-data-v3-8-2-1-shadow/38000/qwen_hf/
    lora_rank: 0
  actor:
    ppo_max_token_len_per_gpu: ${data.max_model_length}
  ref:
    log_prob_max_token_len_per_gpu: ${data.max_model_length}
  rollout:
    log_prob_max_token_len_per_gpu: ${data.max_model_length}
data:
  val_data:
  - ${_ls_none}
  - ${_ls_before}
  - ${_ls_after}
  max_prompt_length: 8192
  max_audio_dur: null
reward_map:
  clean_0_none: val_openasr_en
  other_0_none: val_openasr_en
  clean_100_before: val_openasr_en
  clean_500_before: val_openasr_en
  other_100_before: val_openasr_en
  other_500_before: val_openasr_en
  clean_100_after: val_openasr_en
  clean_500_after: val_openasr_en
  other_100_after: val_openasr_en
  other_500_after: val_openasr_en
trainer:
  experiment_name: 2611r2_ls_biasing
  project_name: v2611_eval
  nnodes: 1
  n_gpus_per_node: 8
  resume_mode: disable
  val_only: true
