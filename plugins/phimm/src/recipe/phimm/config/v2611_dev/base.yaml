# @package _global_
# Main PPO defaults with Base3a audio, ReMax and durable artifact extensions.

defaults:
  - /ppo_trainer
  - /reward/asr@_global_
  - _self_

actor_rollout_ref:
  actor:
    optim:
      lr: 6.0e-07
      lr_warmup_steps: 0
      min_lr_ratio: 0.01
      lr_scheduler_type: constant
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      use_orig_params: true
      use_torch_compile: false
    strategy: fsdp2
    ppo_mini_batch_size: ${data.train_batch_size}
    ppo_micro_batch_size_per_gpu: 4
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 2048
    clip_ratio_high: 0.28
    loss_agg_mode: seq-mean-token-sum
    use_kl_loss: true
    use_torch_compile: false
  ref:
    strategy: fsdp2
    use_torch_compile: false
    log_prob_micro_batch_size_per_gpu: ${actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu}
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 2048
    fsdp_config:
      param_offload: true
      use_torch_compile: false
  rollout:
    name: vllm
    seed: 0
    response_length: ${data.max_response_length}
    gpu_memory_utilization: 0.9
    tensor_model_parallel_size: 1
    max_num_batched_tokens: ${eval:${actor_rollout_ref.rollout.max_num_seqs}*${data.max_model_length}}
    max_num_seqs: 32
    logprobs_mode: raw_logprobs
    load_format: safetensors
    layered_summon: true
    log_prob_micro_batch_size_per_gpu: ${eval:${actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu}*2}
    n: 8
    engine_kwargs:
      vllm:
        compilation_config:
          mode: 0
        gdn_prefill_backend: triton
        lora_target_modules:
          - gate_proj
          - up_proj
          - down_proj
          - q_proj
          - k_proj
          - v_proj
          - o_proj
          - in_proj_qkv
          - out_proj
        logits_processors:
          - vllm.model_executor.models.deepseek_ocr:NGramPerReqLogitsProcessor
        seed: ${actor_rollout_ref.rollout.seed}
        mm_processor_cache_gb: 0
    agent:
      default_agent_loop: asr
      agent_loop_manager_class: recipe.phimm.agentic.agent_loop.ASRManager
    # ASR sampling sends this configured window as the vLLM window_size argument.
    custom:
      stop:
        - <|im_end|>
      stop_token_ids:
        - 248044
        - 248046
      no_repeat_ngram_size: 15
      no_repeat_ngram_window_size: 512
      validation_no_repeat_ngram_size: ${actor_rollout_ref.rollout.custom.no_repeat_ngram_size}
      validation_no_repeat_ngram_window_size: ${actor_rollout_ref.rollout.custom.no_repeat_ngram_window_size}
      validation_response_length: 512
  model:
    external_lib: hf_qwen35_audio
    enable_gradient_checkpointing: false
    lora_rank: 320
    lora_alpha: ${eval:${actor_rollout_ref.model.lora_rank}*2}
    target_modules: model.layers.*(gate_proj|up_proj|down_proj|q_proj|k_proj|v_proj|o_proj|in_proj_qkv|out_proj).*
    exclude_modules: model.embed_tokens_extend.*
    path: null
  nccl_timeout: 3600

data:
  train_files: __asr_train__
  val_files: __asr_val__
  max_prompt_length: 1024
  max_response_length: 768
  train_batch_size: 128
  gen_batch_size: ${data.train_batch_size}
  val_batch_size: 256
  shuffle: false
  dataloader_num_workers: 1
  # Main imports the dataset by package; it returns raw rows for the agent loop.
  custom_cls:
    path: pkg://recipe.phimm.agentic.dataset
    name: ASRDataset
  version: 2609
  max_model_length: ${eval:${data.max_prompt_length}+${data.max_response_length}}
  max_audio_dur: 40
  chunk_load_mode: indexed
  random_segment: null

algorithm:
  # Source on-policy token importance correction, capped without batch normalization.
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 5
    bypass_mode: false
    rollout_is_batch_normalize: false
  adv_estimator: remax

trainer:
  total_epochs: 2
  project_name: v2611
  log_val_generations: 20
  validation_data_dir: ${trainer.default_local_dir}/val_data_gen
  nnodes: 2
  save_freq: 10
  checkpoint_callback_class: recipe.phimm.agentic.trainer.ASRCheckpointCallback
  test_freq: 20
  default_hdfs_dir: az://orngwus2cresco/data/boren/outputs/${trainer.project_name}/${trainer.experiment_name}
  default_local_dir: ${oc.env:HOME}/checkpoints/${trainer.project_name}/${trainer.experiment_name}
  max_actor_ckpt_to_keep: 2
  v1:
    # Keep Main scheduling and optimization; extend ASR metrics and durable resume.
    trainer_class: recipe.phimm.agentic.trainer.ASRTrainerSync
    trainer_mode: sync
  experiment_name: null
  total_training_steps: null
  resume_mode: auto
  val_before_train: true

