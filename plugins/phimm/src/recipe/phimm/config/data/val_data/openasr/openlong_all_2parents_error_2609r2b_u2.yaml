# @package data.val_data
# U2-tagged datasources for all segments from the two highest-error parents.
# Segment text is inferred from model hypotheses and needs human review. Parent
# grouping keys are deliberately omitted so clips are scored independently.
# Parent ranking uses the original saved n_err, which may be inflated by
# normalization across segment boundaries; consult the output summary.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/OpenLong_all_segments_2parents_2609r2b_step400_v1/earnings21.jsonl
  add_task_info:
    task: lang_asr_verb
    language: English
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: earnings21_u2
    verl_format:
      prompt_key: prompt

