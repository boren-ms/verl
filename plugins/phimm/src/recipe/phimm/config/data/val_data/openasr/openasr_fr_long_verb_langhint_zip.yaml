# @package data.val_data
# Exact French supplementary rows from the Base3a reference evaluation (965a025ac2).
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/openasr_ml_expansion/18143a6e/eslo_telephony_fr/data_zip.jsonl
  add_task_info:
    task: lang_asr_verb
    language: French
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: eslo_telephony_fr
    verl_format:
      prompt_key: prompt
      extra_keys:
      - id
      - language
      - audio_path
      - source_revision
      - source_row
      - metric
      - include_in_average_wer
      - parent_audio_path
      - seg_index
      - n_segments
      - seg_start
      - seg_end
  val_batch_size: -1
