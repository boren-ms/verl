# @package data.val_data
# U2 default: original full-parent references, one WER alignment per parent.
# Retains the exact 1,085 legacy audio clips from 8 parents. Decoding can use
# asr.context_aware independently; only newly generated output is scored.
# Provenance/coverage: manifest_verified.json beside these immutable manifests.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/OpenLong_all_segments_2parents_fullref_2609r2b_step400_v1/earnings21.jsonl.gz
  add_task_info:
    style: verb
    language: English
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: earnings21_u2_context
    verl_format:
      prompt_key: prompt
      extra_keys: [parent_audio_path, seg_index, seg_start, seg_end, n_segments, reference_scope]

