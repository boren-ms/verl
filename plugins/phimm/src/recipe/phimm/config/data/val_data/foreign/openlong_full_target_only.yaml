# @package data.val_data
# Full OpenLong, matched to openasr/openlong_seg_verb_langhint_zip.yaml.
# Only the English target-only instruction changes. Keep references, audio
# ranges, parent grouping, corpus names, and complete-corpus batching unchanged.
# This is distinct from foreign/openlong_target_only.yaml (parent4 + hint sets).

- dataset_name: jsonl
  val_batch_size: -1
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/OpenASR_long_seg_presegment_30s/earnings21/test-*/data_zip.jsonl
  add_task_info:
    style: verb
    language: English
    lang_hint: true
    target_only: true
  post_process:
    add_field:
      fields:
        data_source: earnings21
    verl_format:
      prompt_key: prompt
      extra_keys: ["id", "language", "audio_path", "parent_audio_path", "seg_index", "n_segments", "seg_start", "seg_end"]

