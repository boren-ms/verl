# @package data.val_data
# Original en-US-entity-v3 VAD clips; one row per complete recording.
# Dataset inventory and counting definitions: english_entity_presegment.md
# Prepare with python -m recipe.phimm.data.inhouse_entity --cache-dir ... --publish
- dataset_name: jsonl
  val_batch_size: -1
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/InhouseASR_EWER_en_US_entity_v3_presegment_v1/*.jsonl
  add_task_info:
    style: verb
    language: English
    lang_hint: true
  post_process:
    verl_format:
      prompt_key: prompt
      extra_keys:
        - audio_path
        - parent_audio_path
        - entity_transcription
        - n_segments
        - segment_starts_samples
        - segment_ends_samples
        - reference_scope
        - source_manifest
        - reference_manifest
