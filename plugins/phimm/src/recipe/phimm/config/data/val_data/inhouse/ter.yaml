# @package data.val_data
# Five separate EN-US TER datasets. See adjacent Markdown for full source names.

# Conversation
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/dtest_enus_ter_v1/Conversation_DTEST_FY21Q1_en-US.jsonl
  add_task_info:
    style: display
    language: English
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: conversation
    verl_format:
      prompt_key: prompt
      extra_keys:
        - audio_path
        - parent_audio_path
        - entity_transcription
        - n_segments
        - reference_scope
        - source_manifest
        - reference_manifest

