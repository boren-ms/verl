# @package data.val_data
# ZIP-backed OpenASR-ML evaluation with verbatim prompts and known-language hints.

- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/openasr_ml_jsonl/fleurs/de/data_zip.jsonl
  add_task_info:
    task: lang_asr_verb
    language: German
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: de_fleurs
    verl_format:
      prompt_key: prompt

