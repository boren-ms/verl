# Voice Arena Monsoon Hindi uses lattice OIWER inside the shared OpenML scorer.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/openasr_ml_jsonl/monsoon/hi_in/data_zip.jsonl
  add_task_info:
    task: lang_asr_verb
    language: Hindi
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: monsoon_hi_in
    verl_format:
      prompt_key: prompt
      extra_keys: ["lattice"]

# MOE 18143a6e supplementary coverage (excluded from headline averages).
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/openasr_ml_expansion/18143a6e/fleurs_zh/data_zip.jsonl
  add_task_info:
    task: lang_asr_verb
    language: Chinese
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: zh_fleurs
    verl_format:
      prompt_key: prompt
      extra_keys:
      - id
      - language
      - audio_path
      - source_revision
      - source_row
      - metric
      - include_in_average_wer
