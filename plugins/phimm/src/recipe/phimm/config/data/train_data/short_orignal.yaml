# Original Earnings Short sources with the shared datasource name short_orignal.
# Combines earn_fy27, quartr_1st23, quartr_2nd48, and quartr_3rd38.
# Source paths, preprocessing, and task formatting match the individual YAMLs.

# Original FY27 batch 1/2 transcriptions, without Polyus TTS.
# Match the NE-tagged comparison's processing and task settings.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/EarningsCall_2026_conversion_svad/earningscall-fy27-en-us-batch1.jsonl
  pre_process:
    path_map:
      field: audio_path
      src_part: "audios/"
      dst_part: "az://orngwus2cresco/data/speech/EarningsCall_2026_conversion_svad/"
    rename_fields:
      mappings:
        text: display
    clean_tagged_text: {}
  add_task_info:
    style: verb
    language: English
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: short_orignal
    verl_format:
      prompt_key: prompt

