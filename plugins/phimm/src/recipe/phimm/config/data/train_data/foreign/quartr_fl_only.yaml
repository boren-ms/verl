# Quartr FY27 Batch1 FL segments: FL_only; 295 rows, 0.621173 hours.
# Converted from the delivered TSVs; only main folders are included, never *_review.
# Matches Quartr short: strip tags and extract NE keywords; FL-only targets become empty.
# Keep manually approved mixtures even when SourceStatus describes an excluded original FL clip.
# Detected FL is source_language; the ASR task language remains English.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/users/qimiao/EarningsCall_Quartr_FY27_Batch1_FL_Segments/training_base3a_v1/quartr_fl_only.jsonl
  pre_process:
    path_map:
      field: audio_path
      src_part: "FL_only/audio/"
      dst_part: "az://orngwus2cresco/data/speech/users/qimiao/EarningsCall_Quartr_FY27_Batch1_FL_Segments/FL_only/audio/"
    rename_fields:
      mappings:
        text: display_ne_tagged
    clean_tagged_text: {}
  add_task_info:
    style: verb
    language: English
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: quartr_fl_only
    verl_format:
      prompt_key: prompt
      extra_keys:
        - event_id
        - subset
        - audio_length
        - source_language
        - source_status
        - approval
        - source_tsv
        - source_row
