      - source_recording
      - speaker_map
      - duration_s
      - evaluation_duration_s
      - source_start_s
      - source_end_s
      - reference_segments
      - reference_words
      - reference_turns
      - annotation_kind
      - source_chunk
      - source_record_index
      - split
      - speaker_count
