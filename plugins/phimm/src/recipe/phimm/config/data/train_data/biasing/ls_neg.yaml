# Offline LibriSpeech pure-negative biasing data.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/users/boren/data/librispeech_biasing/offline_rlbr_negative_seed42_20261127/train/data.jsonl
  add_task_info:
    style: verb
    lang_hint: true
    biasing: ${asr.biasing}
  post_process:
    add_field:
      fields:
        data_source: ls_neg
    verl_format:
      prompt_key: prompt
      extra_keys:
      - biasing_words
