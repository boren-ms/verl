# Offline cross-dataset merge of 25,240 Earnings Short + 2,732 FL originals.
# 111,888 parents (4x): 55,944 pairs + 55,944 triples; audio_path lists.
# English language hints; FL-only empty references preserved.
# Raw normalization and merge precede add_task_info; disable online merge/splitting.
# Offline merge before add_task_info; do not merge again online.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/Training/fl_earnings_short_random_merge23_x4_v1/earnings_batch1/data.jsonl
  add_task_info:
    style: verb
    language: English
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: earn_fy27
    verl_format:
      prompt_key: prompt
      extra_keys:
      - data_source
      - random_merge_count
      - random_merge_source_indices
      - source_audio_lengths
      - source_languages
      - source_dataset_names
      - source_row_indices
      - source_data_sources
      - random_merge_round
      - random_merge_anchor_position
