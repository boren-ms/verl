# @package data.train_data
# Orange full_v1 statistics (train), from verified audio frame counts.
# Source recordings: 69,725; source WAV hours: 9,708.556.
# Audio clips: 2,044,319; clip hours: 8,862.649; reference words: 88,875,663.
# Recording-scoped speakers: 207,119; speaker activity intervals: 18,124,066.
# Clip duration (s): mean 15.61, median 15.24, p95 18.63, range 5.00-30.00.
# Words per audio clip: mean 43.5, median 43.0.
# Annotations excluded: length filter 689,543, outside waveform 175.
# Six training sources only; AMI dev and ICSI audit are separate.
# Report: az://orngwus2cresco/data/boren/data/Training/diarization/moe_en/full_v1/statistics/summary.json
- dataset_name: jsonl
  jsonl_schema: diarization
  jsonl_paths:
  - az://orngwus2cresco/data/boren/data/Training/diarization/moe_en/full_v1/manifests/moe_ami_train/part-*.jsonl.gz
  - az://orngwus2cresco/data/boren/data/Training/diarization/moe_en/full_v1/manifests/moe_fisher/part-*.jsonl.gz
  - az://orngwus2cresco/data/boren/data/Training/diarization/moe_en/full_v1/manifests/moe_apptek/part-*.jsonl.gz
  - az://orngwus2cresco/data/boren/data/Training/diarization/moe_en/full_v1/manifests/moe_definedai/part-*.jsonl.gz
  - az://orngwus2cresco/data/boren/data/Training/diarization/moe_en/full_v1/manifests/moe_podcast/part-*.jsonl.gz
  - az://orngwus2cresco/data/boren/data/Training/diarization/moe_en/full_v1/manifests/moe_vox/part-*.jsonl.gz
  post_process:
    verl_format:
      prompt_key: prompt
      extra_keys:
      - recording_id
      - source_recording
      - speaker_map
      - duration_s
      - evaluation_duration_s
      - source_start_s
      - source_end_s
      - reference_segments
      - reference_words
      - reference_turns
      - annotation_kind
      - source_chunk
      - source_record_index
      - split
      - speaker_count
      - source_audio_duration_s
      - source_sample_rate
      - source_channels
