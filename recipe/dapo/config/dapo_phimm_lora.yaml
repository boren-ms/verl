hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - dapo_asr
  - _self_

actor_rollout_ref:
  model:
    lora_rank: 320
    lora_alpha: 640
    # target_modules: "model.layers"
    target_modules: "model.layers.*(qkv_proj|o_proj|gate_up_proj|down_proj).*"
    exclude_modules: "model.embed_tokens_extend.*" # must have
  rollout:
    load_format: safetensors
trainer:
  experiment_name: dapo-phimm-test-lora
  # save_freq: 1
train_files: /root/data/parquet/ls_clean_sc1k_fn1_h100.parquet
val_files: /root/data/parquet/ls_clean_sc1k_fn1_h100.parquet
model_path: /root/data/ckp/hf_models/phi4_mm_bias_merged
