project_name: biasing_entity
train_data:
  dataset_name: cached
  cache_path: ${oc.env:DATA_PATH}/boren/data/cache_datasets/hcv2_fy22_info_tag/
  num_proc: auto
  cache_name: auto_train
  pre_process:
    path_map:
      field: audio_chunk
      src_part: "az://orngwus2cresco/data"
      dst_part: "${oc.env:DATA_PATH}"
  post_process:
    filter_by_keywords:
      min_num: 1
    add_field:
      fields:
        data_source: asr
    verl_format:
      prompt_key: prompt
  add_prompt:
    task: rare_asr
    forced: True

val_data:
  - cache_name: auto_clean
    post_process:
      add_field:
        fields:
          data_source: clean
      verl_format:
        prompt_key: prompt
    dataset_name: ls_bias
    jsonl_path: /root/data/librispeech_biasing/ref/test-clean.biasing_100.jsonl
    tag: ""
    data_dir: ${oc.env:DATA_PATH}/boren/data/
  - cache_name: auto_other
    post_process:
      add_field:
        fields:
          data_source: other
      verl_format:
        prompt_key: prompt
    dataset_name: ls_bias
    jsonl_path: /root/data/librispeech_biasing/ref/test-other.biasing_100.jsonl
    tag: ""
    data_dir: ${oc.env:DATA_PATH}/boren/data/
  - cache_name: auto_entity_Gaming
    post_process:
      add_field:
        fields:
          data_source: entity_Gaming
      verl_format:
        prompt_key: prompt
    dataset_name: inhouse_entity
    data_dir: ${oc.env:DATA_PATH}/boren/data/
    src_dir: /home/boren/data/
    jsonl_path: ${oc.env:DATA_PATH}/boren/data/Evaluation/InhouseASR/EWER/en-US-entity-v3/Conversation_DomainSet_DTEST_Gaming_Entity_FY24Q1_en-US_DTEST/segments.jsonl
    distractor_file: ${oc.env:DATA_PATH}/boren/data/librispeech_biasing/words/all_rare_words.txt
    max_bias: 0
