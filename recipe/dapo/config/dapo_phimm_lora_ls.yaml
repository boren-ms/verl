hydra:
  searchpath:
    - file://verl/trainer/config
defaults:
  - dapo_asr_new
  - _self_
  - data/librispeech

data:
  custom_cls:
    path: verl/utils/dataset/audio/rl_dataset.py
    name: RLHFDataset

custom_reward_function:
  path: verl/utils/reward_score/speech_recognition.py
  name: compute_score
  # reward_kwargs:
  #   beta: 1.0
actor_rollout_ref:
  model:
    lora_rank: 320
    lora_alpha: 640
    target_modules: "model.layers.*(qkv_proj|o_proj|gate_up_proj|down_proj).*"
    exclude_modules: "model.embed_tokens_extend.*" # must have
trainer:
  experiment_name: dapo-phimm-test-lora-new
