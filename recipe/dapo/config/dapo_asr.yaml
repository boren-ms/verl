defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ${train_files}
  val_files: ${val_files}
  # prompt_key: prompt
  asr_dataset: true
  pad_to_max: true # why to dynamic pad
  audio_key: audio_path
  trust_remote_code: true
  max_prompt_length: 8192
  max_response_length: 1024
  train_batch_size: ${train_bs} # 32
  gen_batch_size: ${gen_bs} # 32 * n_rollout

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  kl_ctrl:
    kl_coef: 0.0
  filter_groups:
    enable: true
    metric: seq_reward
    max_num_gen_batches: 10
    # _target_: verl.trainer.config.FilterGroupsConfig

actor_rollout_ref:
  actor:
    use_kl_loss: false
    kl_loss_coef: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean
    optim:
      lr: 1e-5
      warmup_style: cosine
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: false
      optimizer_offload: false
      use_orig_params: true
    strategy: fsdp2
  model:
    path: ${model_path}
    trust_remote_code: true
    use_remove_padding: true
    use_fused_kernels: false
  rollout:
    n: ${n_rollout}
    log_prob_micro_batch_size_per_gpu: 1
    tensor_model_parallel_size: 1
    name: vllm
    gpu_memory_utilization: 0.25
  ref:
    strategy: fsdp2
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true

reward_model:
  reward_manager: dapo
  overlong_buffer:
    enable: true
    len: 128
    penalty_factor: 1.0
    log: false

# custom_reward_function:
#   path: verl/utils/reward_score/speech_recognition.py
#   name: compute_score

trainer:
  project_name: verl_asr
  logger: ["console", "wandb"]
  experiment_name: dapo-phimm-test
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 20
  test_freq: 40
  total_epochs: 2
  resume_mode: disable
  val_before_train: true
  total_training_steps: null # disable steps

train_bs: 8
n_rollout: 4
gen_bs: 16
train_files: /root/data/parquet/ls_clean_sc1k_fn1_h100.parquet
val_files: /root/data/parquet/ls_clean_sc1k_fn1_h100.parquet
model_path: /root/data/ckp/hf_models/phi4_mm_bias_merged
