# Config for multi-node vLLM server evaluation
# Reference: recipe/phimm/config/gen/gen_oss_ls.yaml
#
# Usage with Hydra:
#   python -m recipe.phimm.vllm_server.launch_vllm_servers
#   python -m recipe.phimm.vllm_server.launch_vllm_servers server.max_num_seqs=64
#   python -m recipe.phimm.vllm_server.launch_vllm_servers --config-name=config_librispeech
#
# Usage with run_eval.sh (passes Hydra overrides via HYDRA_OVERRIDES env var):
#   HYDRA_OVERRIDES="server.max_num_seqs=64 proxy.port=9000" bash run_eval.sh --role all

# Model config — vLLM always loads from `local_path`. If `remote_path` is set
# and `local_path` does not yet exist, the launcher syncs remote → local once.
model:
  remote_path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2605/amlt-results/fast-llm-2605-qwen3-5-9b-s2-st-example/90000/qwen_hf/
  local_path: /tmp/vllm_models/fast-llm-2605-qwen3-5-9b-s2-st-example-90000

# vLLM engine config (per-GPU, TP=1). Consumed by the in-process LLM in
# recipe.phimm.vllm_server.worker_server (no separate vLLM HTTP server).
server:
  gpu_memory_utilization: 0.95
  max_model_len: 4096
  max_num_seqs: 256
  max_num_batched_tokens: 65536
  enforce_eager: false
  disable_prefix_caching: true

# Worker config — the worker process owns its vLLM LLM engine and micro-batches
# concurrent HTTP requests into one LLM.generate call.
worker:
  audio_workers: 8                 # thread pool size for audio loading
  batch_max_wait_seconds: 0.5     # micro-batch coalescing window
  # Stop tokens for the qwen35_audio fast-llm checkpoints (matches
  # plugins/qwen35_audio/scripts/run_qwen35_audio_vllm.py). Override per-model.
  stop_token_ids: [248044, 248046]

# Proxy config
proxy:
  host: "0.0.0.0"
  port: 8000
  # Per-backend in-flight request cap. Cluster capacity = cap * healthy_backends.
  max_inflight_per_backend: 4

# Cluster / node config
cluster:
  num_gpus: 8
  startup_timeout: 600.0
  wait_timeout: 600.0
  proxy_url: http://verl-n1-i0-0:8000  # always register workers to this proxy
