# Base config for ASR evaluation client (eval_asr.py).
#
# Dataset-specific configs should extend this via Hydra defaults, e.g.:
#
#   # eval_ls.yaml
#   defaults:
#     - eval_base
#     - _self_
#
#   data:
#     source_config: data/train_data/ls_raw.yaml
#     output_path: az://.../my_run/
#
# Usage:
#   python -m recipe.phimm.vllm_server.eval_asr --config-name=eval_ls
#   python -m recipe.phimm.vllm_server.eval_asr --config-name=eval_ls data.num_egs=100

eval:
  # Default to verl-n1-i0 as the proxy host (StatefulSet pod DNS). When
  # running ON verl-n1-i0 the launcher will auto-spawn proxy+vLLM locally;
  # from any other host the launcher is auto-disabled (remote proxy expected).
  proxy_url: http://verl-n1-i0-0:8000
  log_interval: 100
  save_interval: 10000
  resume: true
  wait_timeout: 600.0
  wer_kwargs:
    text_norm: openasr_en
  # Launcher is gated at runtime: only enabled when proxy_url's host == local host.
  launcher:
    enabled: true
    vllm_config: vllm        # name of launcher Hydra config in this directory
    proxy_wait: 30.0         # seconds to wait for the spawned proxy /health

# Dataset + client-side request settings. Override per-dataset in child configs.
data:
  source_config: null        # REQUIRED: path to dataset YAML
  output_path: null          # REQUIRED: where to write result_details*.jsonl
  max_concurrent: 1024        # ≈ 64/GPU × 64 GPUs; caps in-flight ITEMS across all batches
  max_tokens: 1024
  max_audio_dur: 40.0
  num_egs: null              # null → all examples
