# Config for ASR evaluation client (eval_asr.py)
#
# Usage:
#   python -m recipe.phimm.vllm_server.eval_asr
#   python -m recipe.phimm.vllm_server.eval_asr eval.proxy_url=http://host:8000
#   python -m recipe.phimm.vllm_server.eval_asr --config-name=eval data.num_egs=100

eval:
  proxy_url: http://localhost:8000
  log_interval: 100
  save_interval: 10000
  resume: true
  wait_timeout: 600.0
  wer_kwargs:
    text_norm: openasr_en
  # Auto-launch proxy + vLLM servers when the proxy is unreachable.
  launcher:
    enabled: true
    vllm_config: vllm        # name of launcher Hydra config in this directory
    proxy_wait: 30.0         # seconds to wait for the spawned proxy /health

# Dataset + client-side request settings
data:
  source_config: data/train_data/ls_raw.yaml
  output_path: az://orngwus2cresco/data/boren/data/verl/vllm_eval_asr/ls_raw_h100/
  max_concurrent: 512        # ≈ 64/GPU × 8 GPUs
  max_tokens: 1024
  max_audio_dur: 40.0
