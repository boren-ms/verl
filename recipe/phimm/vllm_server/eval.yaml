# Config for ASR evaluation client (eval_asr.py)
#
# Usage:
#   python -m recipe.phimm.vllm_server.eval_asr
#   python -m recipe.phimm.vllm_server.eval_asr eval.proxy_url=http://host:8000
#   python -m recipe.phimm.vllm_server.eval_asr --config-name=eval data.num_egs=100

# Endpoint to send requests to (FastAPI proxy in front of the vLLM workers)
eval:
  proxy_url: http://localhost:8000
  log_interval: 100
  save_interval: 10000
  resume: true
  wait_timeout: 600.0
  # Forwarded as kwargs to recipe.phimm.reward.asr_edge.eval_score.
  wer_kwargs:
    text_norm: openasr_en

# Dataset + client-side request settings
data:
  source_config: data/train_data/ls_raw.yaml
  output_path: /tmp/vllm_eval_results
  max_concurrent: 512        # ≈ 64/GPU × 8 GPUs
  max_tokens: 1024
  max_audio_dur: 40.0
  num_egs: 100              # null → all examples
