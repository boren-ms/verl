# ReMax ASR Training Config - Punc - ASYNC MODE (fully async policy) - 2 NODES
# For Qwen3.5-9B Audio model with a SEPARATE rollout GPU pool and ASYNCHRONOUS
# parameter sync (verl fully-async policy: standalone vLLM rollout servers +
# FSDP trainer pool, weights pushed every trigger_parameter_sync_step).
#
# 2-node variant of remax_r2_punc_p0_7_s1k_async.yaml. Scales the GPU pools
# from 1 node (4 rollout + 4 trainer) to 2 nodes (16 GPUs) split as:
#   trainer:    4 GPUs  (1 STRICT_PACK group, all on ONE node)
#   rollouter: 12 GPUs  (3 STRICT_PACK groups of 4)
# The trainer is kept as a single 4-GPU group on one physical node so the actor
# FSDP shards (fsdp_size=4) stay intra-node (no cross-node FSDP). Because pools
# are placed as STRICT_PACK groups of size n_gpus_per_node, the rollout groups
# are also sized 4 so they tile cleanly alongside the trainer's 4-GPU group on
# the two 8-GPU nodes:  nodeA = trainer(4)+rollout(4),  nodeB = rollout(4)+(4).
#
# All data / reward / ReMax (continuous advantage) settings are identical to
# remax_r2_punc_p0_7_s1k_async.yaml — this config differs ONLY in the rollout /
# trainer GPU pool sizing.
#
# Composition:
#   base/remax_asr  — shared model/actor/rollout/ref/trainer/data scaffolding
#                     (already fully-async; kept as-is here)
#   data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
#   data/val_data/enus_conv_fy21q1_seg
#
# Train reward: punc_cap_measure (char + punc F-measure, reduce=mean)
# Algorithm:    ReMax (continuous advantage), fully async rollout/training
#
# Usage (fully-async trainer):
#   python3 -m verl.experimental.fully_async_policy.fully_async_main \
#       --config-path=../../../recipe/phimm/config \
#       --config-name=remax/remax_r2_punc_p0_7_s1k_async_r12t4
# or simply:
#   bash quick_run.sh remax_r2_punc_p0_7_s1k_async_r12t4

hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base

defaults:
  - remax_asr
  - data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
  - data/val_data/enus_conv_fy21q1_seg
  - _self_
actor_rollout_ref:
  actor:
    # The trainer actor update (forward/backward through the Qwen3.5-9B audio
    # model) OOMs on the colocated trainer GPUs at 4096 once rollout response
    # lengths grow (observed CUDA OOM in actor_update_actor at step:0 -> step 1,
    # GPU0 77GB/79GB on the 2nd node). Gradient checkpointing is unsupported and
    # fsdp_size=4 (from base) already shards params/optimizer across the 4
    # trainer GPUs; lower the per-GPU dynamic-bsz token budget to 2048 to clear
    # the actor_update_actor OOM. (Do NOT use PYTORCH_ALLOC_CONF=
    # expandable_segments:True here — it propagates to the shared ray runtime
    # env and breaks the vLLM rollout CuMemAllocator: "Expandable segments are
    # not compatible with memory pool".)
    ppo_max_token_len_per_gpu: 2048
  rollout:
    max_num_seqs: 64
    gpu_memory_utilization: 0.85
    temperature: 1.2


trainer:
  nnodes: 1
  n_gpus_per_node: 4
  resume_mode: disable

rollout:
  nnodes: 3
  n_gpus_per_node: 4

async_training:
  concurrent_samples_per_replica: 32
  staleness_threshold: 0.5
  trigger_parameter_sync_step: 4
  partial_rollout: true
  require_batches: 1

algorithm:
  binary_adv: true
  binary_adv_scale: 1.0

# ── Reward ────────────────────────────────────────────────────────────────
reward:
  custom_reward_function:
    path: pkg://recipe.phimm.reward.punc_cap_measure
    name: compute_score
    reward_kwargs:
      reduce: mean
      measures:
        char: {beta: 1.0}
        punc: {beta: 1.0}
  num_workers: 8

val_reward:
  group_segment: true
  custom_reward_function:
    path: pkg://recipe.phimm.reward.asr_inhouse_measure
    name: eval_score

