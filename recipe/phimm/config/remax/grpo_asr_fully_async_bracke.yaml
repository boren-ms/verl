# Fully Async ReMax ASR Training Config - Bracket + Repeat
# For Qwen3.5-9B Audio model with fully async policy (separate rollout + training GPUs)
#
# Based on: recipe/phimm/config/remax_asr_fully_async.yaml
# + recipe/phimm/config/remax_qwen_r2_bracket/remax_qwen_r2_bad_repeat_bracket_all_e1.yaml
#
# Model: Qwen3.5-9B-S2-ST-Example-R2 (step 90000)
# Train reward: asr_edge (char-level WER with gamma smoothing)
# Algorithm: ReMax with fully async rollout/training
# Data: bracket + repeat error samples
#
# Usage:
#   python3 -m verl.experimental.fully_async_policy.fully_async_main \
#       --config-path=../../../recipe/phimm/config \
#       --config-name=remax_asr_fully_async_bracket

hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://recipe/phimm/config/base

defaults:
  - ppo_trainer
  - _self_

# ── Fully Async Training ─────────────────────────────────────────────────
async_training:
  staleness_threshold: 0.5
  trigger_parameter_sync_step: 4
  require_batches: 1
  partial_rollout: true
  use_trainer_do_validate: false

# ── Rollout GPU pool (separate from trainer) ──────────────────────────────
rollout:
  nnodes: 1
  n_gpus_per_node: 4
  n: 16
  total_rollout_steps: null      # null = use all data × total_epochs

# ── Data ──────────────────────────────────────────────────────────────────
data:
  train_files: null
  val_files: null
  train_batch_size: 0          # must be 0 for fully async
  gen_batch_size: 1            # single-sample streaming for async
  val_batch_size: 1024
  max_prompt_length: 1204
  max_response_length: 512
  mm_processor_kwargs:
    sampling_rate: 16000
  max_audio_dur: 40
  shuffle: false
  filter_overlong_prompts: false
  truncation: right
  prompt_key: prompt
  return_multi_modal_inputs: true
  dataloader_num_workers: 0
  trust_remote_code: true
  custom_cls:
    path: pkg://recipe.phimm.data.rl_dataset
    name: RLHFDataset
  # Training data: bracket + repeat error samples
  train_data:
    - dataset_name: jsonl
      jsonl_paths: az://orngwus2cresco/data/boren/data/verl/cached_qwen/qwen_oss_brackets/all_wav.jsonl
      add_task_info:
        task: lang_asr
      post_process:
        add_field:
          fields:
            data_source: asr
        verl_format:
          prompt_key: prompt
    - dataset_name: jsonl
      jsonl_paths: az://orngwus2cresco/data/boren/data/verl/cached_qwen/qwen_oss_reps/all_wav.jsonl
      add_task_info:
        task: lang_asr
      post_process:
        add_field:
          fields:
            data_source: asr
        verl_format:
          prompt_key: prompt
  # Validation data: LibriSpeech test-clean + test-other
  val_data:
    - dataset_name: ls_bias
      jsonl_path: az://orngwus2cresco/data/boren/data/librispeech_biasing/ref/test-clean.biasing_100.jsonl
      data_dir: az://orngwus2cresco/data/boren/data/
      cache_name: auto_clean_no
      post_process:
        add_field:
          fields:
            data_source: clean_0
        verl_format:
          prompt_key: prompt
    - dataset_name: ls_bias
      jsonl_path: az://orngwus2cresco/data/boren/data/librispeech_biasing/ref/test-other.biasing_100.jsonl
      data_dir: az://orngwus2cresco/data/boren/data/
      cache_name: auto_other_no
      post_process:
        add_field:
          fields:
            data_source: other_0
        verl_format:
          prompt_key: prompt

# ── Algorithm: GRPO (ReMax not supported in fully async - no reward_baselines) ─
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  kl_ctrl:
    kl_coef: 0.0
  rollout_correction:
    bypass_mode: true

# ── Reward ────────────────────────────────────────────────────────────────
reward:
  custom_reward_function:
    path: pkg://recipe.phimm.reward.asr_edge
    name: compute_score
    reward_kwargs:
      gamma: 0.1
      unit: char
  num_workers: 8

val_reward:
  custom_reward_function:
    path: pkg://recipe.phimm.reward.asr_edge
    name: openasr_eval

# ── Model + Actor + Rollout + Ref ─────────────────────────────────────────
actor_rollout_ref:
  hybrid_engine: false
  nccl_timeout: 3600
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2605/amlt-results/fast-llm-2605-qwen3-5-9b-s2-st-example-r2/90000/qwen_hf
    trust_remote_code: true
    use_remove_padding: true
    use_fused_kernels: false
    enable_gradient_checkpointing: false
    lora_rank: 320
    lora_alpha: 640
    target_modules: "model.layers.*(qkv_proj|o_proj|gate_up_proj|down_proj).*"
    exclude_modules: "model.embed_tokens_extend.*"
  actor:
    strategy: fsdp2
    ppo_micro_batch_size_per_gpu: 1
    ppo_mini_batch_size: 8        # samples per trainer step
    ppo_epochs: 1
    use_kl_loss: false
    kl_loss_coef: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    loss_agg_mode: token-mean
    entropy_coeff: 0
    use_rollout_log_probs: true
    use_dynamic_bsz: true
    grad_clip: 1.0
    optim:
      lr: 5e-6
      lr_warmup_steps: -1
      weight_decay: 0.1
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      fsdp_size: 2
      strategy: fsdp2
  rollout:
    name: vllm
    mode: async
    n: ${rollout.n}
    temperature: 1.2
    response_length: ${data.max_response_length}
    dtype: bfloat16
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.6
    max_num_seqs: 16
    enforce_eager: false
    enable_chunked_prefill: true
    free_cache_engine: true
    load_format: safetensors
    calculate_log_probs: true
    log_prob_use_dynamic_bsz: true
    disable_log_stats: false
    layered_summon: true
    checkpoint_engine:
      backend: nccl
      update_weights_bucket_megabytes: 1024
    val_kwargs:
      temperature: 0.0
      top_p: 1.0
      do_sample: true
      n: 1
  ref:
    strategy: fsdp2
    log_prob_use_dynamic_bsz: true
    fsdp_config:
      param_offload: true

# ── Trainer ───────────────────────────────────────────────────────────────
trainer:
  project_name: verl_repeat
  experiment_name: remax_asr_fully_async_bracket_v1
  logger: ["console", "wandb"]
  n_gpus_per_node: 4             # trainer GPU pool
  nnodes: 1
  total_epochs: 1
  test_freq: 10
  save_freq: 10
  val_before_train: true
  resume_mode: disable
  log_val_generations: 10
  default_hdfs_dir: az://orngwus2cresco/data/boren/outputs/${trainer.project_name}/${trainer.experiment_name}
  default_local_dir: ${oc.env:HOME}/checkpoints/${trainer.project_name}/${trainer.experiment_name}
  validation_data_dir: ${trainer.default_hdfs_dir}/val_data_gen
