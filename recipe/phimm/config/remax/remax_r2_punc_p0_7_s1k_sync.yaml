# ReMax ASR Training Config - Punc - SYNC MODE (colocated synchronous)
# For Qwen3.5-9B Audio model with rollout + training COLOCATED on the same GPU
# pool and SYNCHRONOUS parameter updates (classic verl RayPPOTrainer).
#
# This is the SYNC half of a sync/async matched pair. The ASYNC counterpart is
# remax_r2_punc_p0_7_s1k_async.yaml — both share identical data / reward /
# ReMax (continuous advantage) settings and differ ONLY in execution mode.
#
# Composition:
#   base/remax_asr  — shared model/actor/rollout/ref/trainer/data scaffolding
#                     (its fully-async-specific settings are overridden below)
#   data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
#   data/val_data/enus_conv_fy21q1_seg
#
# Train reward: punc_cap_measure (char + punc F-measure, reduce=mean)
# Algorithm:    ReMax (continuous advantage), colocated synchronous rollout/training
#
# Usage (colocated synchronous trainer — NOT fully_async_main):
#   python3 -m verl.trainer.main_ppo \
#       --config-path=../../../recipe/phimm/config/remax \
#       --config-name=remax_r2_punc_p0_7_s1k_sync

hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base

defaults:
  - remax_asr
  - data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
  - data/val_data/enus_conv_fy21q1_seg
  - _self_

# ── Colocated synchronous training ────────────────────────────────────────
# base/remax_asr is fully-async (separate rollout pool + async param sync).
# Neutralize the async-only scheduling knobs so the run behaves as a classic
# synchronous trainer: every prompt batch is rolled out, scored, and used to
# update the policy before the next batch (one weight version per step).
async_training:
  staleness_threshold: 0
  trigger_parameter_sync_step: 1
  partial_rollout: false
  require_batches: 1
  use_trainer_do_validate: true

# ── Algorithm: ReMax (continuous advantage) ───────────────────────────────
# binary_adv:true amplified every "sample worse than greedy" into a full -1
# advantage; with the already-strong base model beating ~90% of samples this
# slammed the policy down on most of its own outputs each step, eroding
# lexical accuracy. Use the continuous ReMax advantage (reward - greedy
# baseline): near-greedy samples get small gradients and genuine improvements
# get proportional positive signal.
algorithm:
  binary_adv: true
  binary_adv_scale: 1.0
  # Rollout == policy every step under synchronous colocated updates, so no
  # off-policy importance-sampling correction is needed.
  rollout_correction:
    bypass_mode: true

# ── Reward ────────────────────────────────────────────────────────────────
reward:
  custom_reward_function:
    path: pkg://recipe.phimm.reward.punc_cap_measure
    name: compute_score
    reward_kwargs:
      reduce: mean
      measures:
        char: {beta: 1.0}
        punc: {beta: 1.0}
  num_workers: 8

val_reward:
  group_segment: true
  custom_reward_function:
    path: pkg://recipe.phimm.reward.asr_inhouse_measure
    name: eval_score

# ── Data: real (non-zero) batches for the synchronous trainer ─────────────
# Fully-async streams single samples (train_batch_size=0, gen_batch_size=1).
# The synchronous colocated trainer pulls a full prompt batch per step; keep
# gen_batch_size == train_batch_size so generation and update use one batch.
data:
  train_batch_size: 64
  gen_batch_size: 64
  val_batch_size: -1

# ── Model + Actor + Rollout: colocate rollout with the FSDP actor ─────────
actor_rollout_ref:
  # Colocate the vLLM rollout engine with the FSDP actor on the trainer GPUs
  # (hybrid engine) instead of a separate standalone rollout pool.
  hybrid_engine: true
  rollout:
    # Synchronous rollout colocated with training (no standalone async server).
    mode: sync
    # Keep the stable concurrency/memory split proven on the every-step-sync
    # runs: max_num_seqs=16 / gpu_memory_utilization=0.6 leaves headroom for
    # the colocated FSDP actor (with param/optimizer offload) on the same GPUs.
    max_num_seqs: 24
    gpu_memory_utilization: 0.7
    # Lower rollout temperature keeps samples competitive with the greedy
    # ReMax baseline so the continuous advantage stays well-scaled.
    temperature: 1.2
    # Colocated weight sync: base/remax_asr uses the 'nccl' checkpoint engine to
    # push weights across a process group between SEPARATE trainer and rollout
    # pools (fully-async). Here trainer and rollout are colocated (hybrid_engine),
    # so use the 'naive' (ColocatedCheckpointEngine) backend — a direct in-process
    # weight sync. With 'nccl' the trainer tries to build an NCCL process group to
    # the standalone vLLM replicas, which don't expose execute_checkpoint_engine.
    checkpoint_engine:
      backend: naive

# ── Trainer: fresh-run checkpointing ──────────────────────────────────────
# The classic synchronous RayPPOTrainer._load_checkpoint raises
# NotImplementedError("load from hdfs is not implemented yet") whenever
# trainer.default_hdfs_dir is set (it only resumes from default_local_dir).
# base/remax_asr keeps default_hdfs_dir=az://... so checkpoints upload to
# blob; resume_mode=auto then trips that unimplemented hdfs-load path on
# startup. Disable resume (this is a fresh run from model.path); the early
# `resume_mode == "disable"` return skips the hdfs-load check while leaving
# default_hdfs_dir intact for blob checkpoint UPLOAD via save_checkpoint.
trainer:
  resume_mode: disable
