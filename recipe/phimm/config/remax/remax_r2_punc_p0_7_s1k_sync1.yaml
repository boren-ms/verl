# Fully Async ReMax ASR Training Config - Punc (binary advantage)
# For Qwen3.5-9B Audio model with fully async policy (separate rollout + training GPUs)
#
# Composition:
#   base/remax_asr   — shared model/actor/rollout/ref/trainer/data scaffolding
#   data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
#   data/val_data/enus_conv_fy21q1_seg
#
# Settings ported from:
#   recipe/phimm/config/remax/remax_r2_punc_p0_7_s1k.yaml
#   with async_training.trigger_parameter_sync_step = 1
#
# Train reward: punc_cap_measure (char + punc F-measure, reduce=mean)
# Algorithm:    ReMax + binary advantage, fully async rollout/training
#
# Usage:
#   python3 -m verl.experimental.fully_async_policy.fully_async_main \
#       --config-path=../../../recipe/phimm/config \
#       --config-name=remax_r2_punc_p0_7_s1k_sync1

hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base

defaults:
  - remax_asr
  - data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
  - data/val_data/enus_conv_fy21q1_seg
  - _self_

# ── Fully Async Training ──────────────────────────────────────────────────
async_training:
  trigger_parameter_sync_step: 1
  # With trigger_parameter_sync_step=1 (sync every step) the default in-flight
  # cap (num_replicas * 16 = 64 samples) cannot drain before the per-step NCCL
  # weight update, timing out vLLM's sample_tokens RPC and killing the rollout
  # EngineCore (EngineDeadError at step 1). Cap in-flight at 4/replica (= 16
  # total for 4 replicas) so requests drain before each sync.
  concurrent_samples_per_replica: 4

# ── Algorithm: ReMax (continuous advantage) ───────────────────────────────
# binary_adv:true amplified every "sample worse than greedy" into a full -1
# advantage; with the already-strong base model beating ~90% of samples
# (advantages/mean ~= -0.78) this slammed the policy down on most of its own
# outputs each step, eroding lexical accuracy (val DTER p_lex 9.1->10.2).
# Use the continuous ReMax advantage (reward - greedy_baseline): near-greedy
# samples get small gradients and genuine improvements get proportional
# positive signal.
algorithm:
  binary_adv: false
  binary_adv_scale: 1.0

# ── Reward ────────────────────────────────────────────────────────────────
reward:
  custom_reward_function:
    path: pkg://recipe.phimm.reward.punc_cap_measure
    name: compute_score
    reward_kwargs:
      reduce: mean
      measures:
        char: {beta: 1.0}
        punc: {beta: 1.0}
  num_workers: 8

val_reward:
  group_segment: true
  custom_reward_function:
    path: pkg://recipe.phimm.reward.asr_inhouse_measure
    name: eval_score

# ── Rollout / Actor: stabilize sync + fix val-DTER divergence ──────────────
# Two issues observed on this every-step-sync (trigger_parameter_sync_step=1) run:
#
# 1) Rollout EngineCore deadlock at the first param syncs: base remax_asr
#    (max_num_seqs=24, gpu_mem=0.7) cannot drain in-flight requests before the
#    NCCL weight update, timing out vLLM's sample_tokens RPC. Use the
#    max_num_seqs=16 / gpu_memory_utilization=0.6 proven stable in
#    remax_r2_punc_p0_7_n12_s1k_mean_binary_adv (commit ba83fca7).
#
# 2) Val DTER rose monotonically (p_lex 9.1->10.2 over 50 steps) while train
#    score rose. Root cause was the binary advantage (see algorithm block) with
#    no regularization. NOTE: actor.use_kl_loss=true is NOT usable here — it
#    crashes actor_update with "assign a gradient with dtype BFloat16 to a
#    tensor with grad_dtype Float" under FSDP2+bf16+LoRA. So we rely on the
#    continuous advantage + a lower rollout temperature (1.2->1.0) to keep
#    samples competitive with the greedy baseline.
actor_rollout_ref:
  rollout:
    max_num_seqs: 16
    gpu_memory_utilization: 0.6
    temperature: 1.0
