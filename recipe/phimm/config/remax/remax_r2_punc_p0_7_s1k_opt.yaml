# Fully Async ReMax ASR Training Config - Punc (binary advantage)
# THROUGHPUT / GPU-UTIL OPTIMIZED variant of remax_r2_punc_p0_7_s1k.
#
# Composition:
#   base/remax_asr   — shared model/actor/rollout/ref/trainer/data scaffolding
#   data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
#   data/val_data/enus_conv_fy21q1_seg
#
# Optimizations vs remax_r2_punc_p0_7_s1k (algorithm/reward unchanged):
#   * data.dataloader_num_workers 0 -> 8   (background blob-audio prefetch; the
#     base ran 0 workers so audio chunk loads stalled the rollout, dropping GPU
#     to ~0% for roughly half of every step).
#   * actor param_offload/optimizer_offload true -> false (9B base sharded over 4
#     trainer GPUs + LoRA fits 80GB resident; CPU offload is pure per-step
#     transfer overhead -> faster actor_update).
#   * rollout gpu_memory_utilization 0.7 -> 0.8, max_num_seqs 24 -> 32 (larger KV
#     cache + more concurrent decode -> higher rollout GPU util; sync_step=4
#     leaves headroom for in-flight requests to drain before each weight sync).
#
# Train reward: punc_cap_measure (char + punc F-measure, reduce=mean)
# Algorithm:    ReMax + binary advantage, fully async rollout/training
#
# Usage:
#   python3 -m verl.experimental.fully_async_policy.fully_async_main \
#       --config-path=../../../recipe/phimm/config \
#       --config-name=remax_r2_punc_p0_7_s1k_opt

hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://recipe/phimm/config

defaults:
  - base/remax_asr
  - data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
  - data/val_data/enus_conv_fy21q1_seg
  - _self_

# ── Algorithm: ReMax + binary advantage ───────────────────────────────────
algorithm:
  binary_adv: true
  binary_adv_scale: 1.0

# ── Throughput / GPU-util optimizations ───────────────────────────────────
data:
  # Base uses 0 workers -> synchronous blob audio loads stall the rollout
  # (GPU 0% for ~half the step). Prefetch audio in parallel (verl default = 8).
  dataloader_num_workers: 8

actor_rollout_ref:
  actor:
    fsdp_config:
      # 9B base sharded across 4 trainer GPUs (~4.5GB/GPU bf16) + LoRA fits 80GB
      # easily; offload only moves params/optim to CPU between steps, adding
      # transfer latency without lowering peak memory. Keep them resident.
      param_offload: false
      optimizer_offload: false
  rollout:
    # Bigger KV cache + more concurrent decode -> higher rollout GPU util.
    gpu_memory_utilization: 0.8
    max_num_seqs: 32

# ── Reward ────────────────────────────────────────────────────────────────
reward:
  custom_reward_function:
    path: pkg://recipe.phimm.reward.punc_cap_measure
    name: compute_score
    reward_kwargs:
      reduce: mean
      measures:
        char: {beta: 1.0}
        punc: {beta: 1.0}
  num_workers: 8

val_reward:
  group_segment: true
  custom_reward_function:
    path: pkg://recipe.phimm.reward.asr_inhouse_measure
    name: eval_score
