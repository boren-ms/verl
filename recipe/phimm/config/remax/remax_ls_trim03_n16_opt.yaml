hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - grpo_asr
  - data/train_data/gen_ls_trim03_wer_gt20
  - data/val_data/openasr_part0
  - _self_

custom_reward_function:
  path: recipe/phimm/reward/asr_edge.py
  name: compute_score
  reward_kwargs:
    cutoff: 0.5
    betas:
      edge: 1

val_reward:
  custom_reward_function:
    path: recipe/phimm/reward/asr_edge.py
    name: eval_score

actor_rollout_ref:
  rollout:
    n: 2048
    gt_rollout: true
    temperature: 1.2
    calculate_log_probs: True
    use_rollout_log_probs_as_old: true
    enforce_eager: false
    layered_summon: true
  actor:
    tis_imp_ratio_cap: 5
    ppo_micro_batch_size_per_gpu: 16
    optim:
      lr: 5e-6
  model:
    path: az://orngwus2cresco/data/boren/data/ckp/hf_models/Phi4-7b-STT-2603-SR2
algorithm:
  adv_estimator: remax
data:
  train_batch_size: 2048
trainer:
  nnodes: 1
  total_epochs: 1
  ppo_epochs: 4
  use_dynamic_bsz: true
  ppo_max_token_len_per_gpu: 20480
  launch_reward_fn_async: true
  test_freq: 10
  save_freq: -1
  val_before_train: true
  resume_mode: disable
  dedup_responses: true
