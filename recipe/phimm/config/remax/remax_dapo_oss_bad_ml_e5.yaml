hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - dapo_asr
  - data/train_data/gen_oss_bad_ml
  - data/val_data/openasr_all_bad
  - _self_

custom_reward_function:
  path: recipe/phimm/reward/asr_edge.py
  name: compute_score
  reward_kwargs:
    gamma: 0.1
    unit: word

val_reward:
  custom_reward_function:
    path: recipe/phimm/reward/asr_edge.py
    name: eval_score


actor_rollout_ref:
  rollout:
    n: 16
    gt_rollout: false
    temperature: 1.2
    calculate_log_probs: True
    use_rollout_log_probs_as_old: true
    gpu_memory_utilization: 0.5
    val_kwargs:
      repetition_penalty: 1.0093
      response_length: 200
  actor:
    tis_imp_ratio_cap: 5
    ppo_micro_batch_size_per_gpu: 8
    ppo_mini_batch_size: 64
    ppo_epochs: 4
    optim:
      lr: 5e-6
  model:
    path: az://orngwus2cresco/data/boren/data/ckp/hf_models/Phi4-7b-STT-2603-SR2
algorithm:
  adv_estimator: remax
data:
  train_batch_size: 64
trainer:
  nnodes: 1
  total_epochs: 1
  test_freq: 10
  save_freq: 10
  val_before_train: true
  dedup_responses: true