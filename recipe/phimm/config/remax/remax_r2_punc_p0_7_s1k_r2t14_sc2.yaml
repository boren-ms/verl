hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base

defaults:
  - remax_asr
  - data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
  - data/val_data/enus_conv_fy21q1_seg
  - _self_

# ── GPU layout: 1 rollouter / 7 trainer (base default is 6 rollouter / 2 trainer) ──
rollout:
  nnodes: 2
  n_gpus_per_node: 1
  total_updates: 1000
  n: 12

trainer:
  nnodes: 2
  n_gpus_per_node: 7
  test_freq: 50
  save_freq: 50
actor_rollout_ref:
  actor:
    ppo_mini_batch_size: 56
    fsdp_config:
      fsdp_size: 7


async_training:
  staleness_threshold: 0.5
  trigger_parameter_sync_step: 2

algorithm:
  binary_adv: true
  binary_adv_scale: 1.0

reward:
  custom_reward_function:
    path: pkg://recipe.phimm.reward.punc_cap_measure
    name: compute_score
    reward_kwargs:
      reduce: mean
      measures:
        char: {beta: 1.0}
        punc: {beta: 1.0}
  num_workers: 8

val_reward:
  group_segment: true
  custom_reward_function:
    path: pkg://recipe.phimm.reward.asr_inhouse_measure
    name: eval_score
