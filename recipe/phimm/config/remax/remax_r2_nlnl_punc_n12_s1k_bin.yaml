hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - grpo_asr
  - data/train_data/qwen_nlnl_hc_fy23q2_punc_h100k_ter_punc
  - data/val_data/nlnl_conv_fy23q2
  - _self_

custom_reward_function:
  path: recipe/phimm/reward/punc_cap_measure.py
  name: compute_score
  reward_kwargs:
    reduce: mean
    measures:
      char: {beta: 1.0}
      punc: {beta: 1.0}

val_reward:
  reward_manager: long_audio_grouped
  custom_reward_function:
    path: recipe/phimm/reward/asr_inhouse_measure.py
    name: eval_score

actor_rollout_ref:
  rollout:
    n: 12
    gt_rollout: false
    temperature: 1.2
    calculate_log_probs: True
    use_rollout_log_probs_as_old: true
    gpu_memory_utilization: 0.6
    max_num_seqs: 24
  actor:
    tis_imp_ratio_cap: 5
    ppo_micro_batch_size_per_gpu: 4
    ppo_mini_batch_size: 64
    optim:
      lr: 5e-6
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2605/amlt-results/fast-llm-2605-qwen3-5-9b-s2-st-example-r2/90000/qwen_hf/
algorithm:
  adv_estimator: remax
  binary_adv: true
  adv_scale: 1.0

data:
  max_prompt_length: 1204
  max_response_length: 512
  train_batch_size: 64
  val_batch_size: -1
trainer:
  nnodes: 1
  total_epochs: 1
  total_training_steps: 1000
  test_freq: 10
  save_freq: 10
  val_before_train: true
