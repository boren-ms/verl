# Fully Async ReMax ASR Training Config - Punc (binary advantage) + FP8 rollout
# 6_2 GPU layout: 6 GPUs rollouter + 2 GPUs trainer
# For Qwen3.5-9B Audio model with fully async policy (separate rollout + training GPUs)
#
# Composition:
#   base/remax_asr   — shared model/actor/rollout/ref/trainer/data scaffolding
#   data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
#   data/val_data/enus_conv_fy21q1_seg
#
# Identical to remax_r2_punc_p0_7_s1k_6_2.yaml except the vLLM rollout engine
# runs FP8 (e4m3, dynamic block-wise) quantized inference for faster decoding.
# The bf16 actor weights are quantized to FP8 on-the-fly at load and after each
# parameter sync (see verl/workers/rollout/vllm_rollout/vllm_async_server.py
# `_apply_quantization`). Training/actor stays bf16 — only rollout is FP8.
#
# Train reward: punc_cap_measure (char + punc F-measure, reduce=mean)
# Algorithm:    ReMax + binary advantage, fully async rollout/training
#
# Usage:
#   python3 -m verl.experimental.fully_async_policy.fully_async_main \
#       --config-path=../../../recipe/phimm/config \
#       --config-name=remax_r2_punc_p0_7_s1k_6_2_fp8

hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base

defaults:
  - remax_asr
  - data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
  - data/val_data/enus_conv_fy21q1_seg
  - _self_

# ── GPU layout: 6 rollouter / 2 trainer ───────────────────────────────────
rollout:
  n_gpus_per_node: 6

actor_rollout_ref:
  actor:
    fsdp_config:
      # Shard params across all 2 trainer GPUs.
      fsdp_size: 2
  rollout:
    # FP8 (e4m3) dynamic block-wise quantization of the rollout weights for
    # faster vLLM inference. verl quantizes the synced bf16 weights to FP8
    # on-the-fly each parameter sync; MoE router/gate layers stay unquantized.
    quantization: fp8

trainer:
  n_gpus_per_node: 2

# ── Algorithm: ReMax + binary advantage ───────────────────────────────────
algorithm:
  binary_adv: true
  binary_adv_scale: 1.0

# ── Reward ────────────────────────────────────────────────────────────────
reward:
  custom_reward_function:
    path: pkg://recipe.phimm.reward.punc_cap_measure
    name: compute_score
    reward_kwargs:
      reduce: mean
      measures:
        char: {beta: 1.0}
        punc: {beta: 1.0}
  num_workers: 8

val_reward:
  group_segment: true
  custom_reward_function:
    path: pkg://recipe.phimm.reward.asr_inhouse_measure
    name: eval_score
