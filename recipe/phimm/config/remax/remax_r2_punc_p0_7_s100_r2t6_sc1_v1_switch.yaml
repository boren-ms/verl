hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base

defaults:
  - remax_asr
  - data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
  - data/val_data/enus_conv_fy21q1_seg
  - _self_

# ── V1 separate-async layout: 2 standalone rollout / 6 hybrid trainer GPUs ──
data:
  # V1 separate_async requires train_batch_size == parameter_sync_step * ppo_mini_batch_size.
  train_batch_size: 30
rollout:
  n_gpus_per_node: 2
  total_updates: 100
  n: 12
trainer:
  use_v1: true
  n_gpus_per_node: 6
  total_training_steps: 100
  test_freq: 100
  save_freq: 100
  v1:
    trainer_mode: separate_async
    separate_async:
      parameter_sync_step: 1
      hybrid_rollout:
        enable_switch: true
        adaptive_switch_threshold: true
actor_rollout_ref:
  hybrid_engine: true
  actor:
    ppo_mini_batch_size: 30
    fsdp_config:
      fsdp_size: 6   # shard across all 6 trainer GPUs (base uses 2)

async_training:
  staleness_threshold: 0.5
  trigger_parameter_sync_step: 1

algorithm:
  binary_adv: true
  binary_adv_scale: 1.0

reward:
  custom_reward_function:
    path: pkg://recipe.phimm.reward.punc_cap_measure
    name: compute_score
    reward_kwargs:
      reduce: mean
      measures:
        char: {beta: 1.0}
        punc: {beta: 1.0}
  num_workers: 8

val_reward:
  group_segment: true
  custom_reward_function:
    path: pkg://recipe.phimm.reward.asr_inhouse_measure
    name: eval_score
