hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base

defaults:
  - remax_asr
  - data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
  - data/val_data/enus_conv_fy21q1_seg
  - _self_

# ── GPU layout: 2 rollouter / 6 trainer (base default is 6 rollouter / 2 trainer) ──
rollout:
  n_gpus_per_node: 2
  total_updates: 100
  n: 8
trainer:
  n_gpus_per_node: 6
  test_freq: 100
  save_freq: 100
actor_rollout_ref:
  actor:
    ppo_mini_batch_size: 18
    # ── Fixed (non-dynamic) batch size for the PPO update ──
    use_dynamic_bsz: false
    fsdp_config:
      fsdp_size: 6   # shard across all 6 trainer GPUs (base uses 2)
  # ── log_prob batch mode must match actor.use_dynamic_bsz (engine_workers assertion) ──
  rollout:
    log_prob_use_dynamic_bsz: false
    log_prob_micro_batch_size_per_gpu: 4
  ref:
    log_prob_use_dynamic_bsz: false

async_training:
  staleness_threshold: 0.5
  trigger_parameter_sync_step: 4
  # Sync only the LoRA adapter each param version (one-time base broadcast),
  # instead of the full base model, on the disaggregated checkpoint-engine path.
  lora_adapter_sync: true

algorithm:
  binary_adv: true
  binary_adv_scale: 1.0
  rollout_correction:
    bypass_mode: true
    rollout_is: token              # token-level IcePop
    rollout_is_threshold: "0.5_5"  # IcePop bounds [lower, upper]: zero IS weights outside [0.5, 5.0]

reward:
  custom_reward_function:
    path: pkg://recipe.phimm.reward.punc_cap_measure
    name: compute_score
    reward_kwargs:
      reduce: mean
      measures:
        char: {beta: 1.0}
        punc: {beta: 1.0}
  num_workers: 8

val_reward:
  group_segment: true
  custom_reward_function:
    path: pkg://recipe.phimm.reward.asr_inhouse_measure
    name: eval_score
