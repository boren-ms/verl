hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - dapo_asr
  - data/train_data/gen_ls_raw_rp_edge_nodigits
  - data/val_data/openasr_bad_fmt_lang
  - _self_

custom_reward_function:
  path: recipe/phimm/reward/asr_edge.py
  name: compute_score
  reward_kwargs:
    gamma: 0.1
    unit: word

val_reward:
  custom_reward_function:
    path: recipe/phimm/reward/asr_edge.py
    name: eval_score

actor_rollout_ref:
  rollout:
    n: 8
    gt_rollout: true
    temperature: 1.2
    calculate_log_probs: True
    use_rollout_log_probs_as_old: false
    val_kwargs:
      n: 16
  actor:
    tis_imp_ratio_cap: -1
    ppo_micro_batch_size_per_gpu: 8
    ppo_mini_batch_size: 32
    policy_loss:
      loss_mode: sdpo
    self_distillation:
      full_logit_distillation: true
      alpha: 0.5
      distillation_topk: 100
      dont_reprompt_on_self_success: true
      teacher_regularization: ema
      teacher_update_rate: 0.05
      is_clip: 2.0
    optim:
      lr: 1e-5
      lr_warmup_steps: 10
  model:
    path: az://orngwus2cresco/data/boren/data/ckp/hf_models/Phi4-7b-STT-2603-SR2

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: false
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

data:
  train_batch_size: 32
  sdpo_teacher:
    enable: true
    max_words: 96
    dedupe_words: true

trainer:
  nnodes: 1
  total_epochs: 1
  test_freq: 10
  save_freq: 10
  val_before_train: true
  dedup_responses: true
