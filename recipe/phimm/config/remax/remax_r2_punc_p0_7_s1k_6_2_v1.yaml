# Fully Async ReMax ASR Training Config - Punc (binary advantage)
# 6_2 GPU layout: 6 GPUs rollouter + 2 GPUs trainer
# For Qwen3.5-9B Audio model with fully async policy (separate rollout + training GPUs)
#
# Composition:
#   base/remax_asr   — shared model/actor/rollout/ref/trainer/data scaffolding
#   data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
#   data/val_data/enus_conv_fy21q1_seg
#
# Identical to remax_r2_punc_p0_7_s1k.yaml except the GPU pool layout is
# changed from 4 (rollout) / 4 (trainer) to 6 (rollout) / 2 (trainer).
#
# Train reward: punc_cap_measure (char + punc F-measure, reduce=mean)
# Algorithm:    ReMax + binary advantage, fully async rollout/training
#
# Usage:
#   python3 -m verl.experimental.fully_async_policy.fully_async_main \
#       --config-path=../../../recipe/phimm/config \
#       --config-name=remax_r2_punc_p0_7_s1k_6_2

hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base

defaults:
  - remax_asr
  - data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
  - data/val_data/enus_conv_fy21q1_seg
  - _self_

# ── GPU layout: 6 rollouter / 2 trainer ───────────────────────────────────
rollout:
  n_gpus_per_node: 6

actor_rollout_ref:
  actor:
    fsdp_config:
      # Shard params across all 2 trainer GPUs.
      fsdp_size: 2
    # With only 2 trainer GPUs (vs the base 4), each FSDP shard holds ~2x the
    # frozen 9B base-param weights, leaving far less headroom for actor-update
    # activations. The base ppo_max_token_len_per_gpu=4096 OOMs GPU0 during
    # actor_update_actor (gated_delta_rule intermediates). Halve the per-GPU
    # dynamic token budget so the update fits on the 2-GPU trainer pool.
    ppo_max_token_len_per_gpu: 2048
  # ── Rollout throughput optimization ─────────────────────────────────────
  # TP=1 (from base) → 6 vLLM replicas across the 6 rollout GPUs. Push each
  # engine's per-GPU concurrency up so the 6 replicas stay saturated:
  #   - max_num_seqs 24 → 64        : more concurrent sequences per engine
  #   - gpu_memory_utilization 0.7 → 0.85 : larger KV cache to back those seqs
  # max_num_batched_tokens auto-scales (= max_num_seqs * max_model_length).
  rollout:
    max_num_seqs: 64
    gpu_memory_utilization: 0.85

trainer:
  n_gpus_per_node: 2

# ── In-flight feed cap ─────────────────────────────────────────────────────
# Per-replica in-flight sample budget (default 16 * tp_size = 16). Raise it so
# the rollouter actually feeds the bigger engines: 6 replicas * 32 = 192
# in-flight (capped by max_required_samples = ppo_mini_batch_size * require_batches
# * (staleness_threshold + 1) * trigger_parameter_sync_step).
async_training:
  concurrent_samples_per_replica: 32

# ── Algorithm: ReMax + binary advantage ───────────────────────────────────
algorithm:
  binary_adv: true
  binary_adv_scale: 1.0

# ── Reward ────────────────────────────────────────────────────────────────
reward:
  custom_reward_function:
    path: pkg://recipe.phimm.reward.punc_cap_measure
    name: compute_score
    reward_kwargs:
      reduce: mean
      measures:
        char: {beta: 1.0}
        punc: {beta: 1.0}
  num_workers: 8

val_reward:
  group_segment: true
  custom_reward_function:
    path: pkg://recipe.phimm.reward.asr_inhouse_measure
    name: eval_score
