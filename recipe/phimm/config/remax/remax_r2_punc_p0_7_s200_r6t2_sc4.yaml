hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base

defaults:
  - remax_asr
  - data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
  - data/val_data/enus_conv_fy21q1_seg
  - _self_

# Fully-async trainer_steps = total_rollout_steps / (ppo_mini_batch_size * sync_step),
# and total_rollout_steps tracks total_training_steps. For 200 trainer steps with
# mini_batch=64, sync=4: 200*64*4 = 51200 (=> 51200/256 = 200 trainer steps),
# matching sc1's 200 trainer steps for an apples-to-apples sync-cadence comparison.
trainer:
  total_training_steps: 51200

async_training:
  staleness_threshold: 0.5
  trigger_parameter_sync_step: 4

algorithm:
  binary_adv: true
  binary_adv_scale: 1.0

reward:
  custom_reward_function:
    path: pkg://recipe.phimm.reward.punc_cap_measure
    name: compute_score
    reward_kwargs:
      reduce: mean
      measures:
        char: {beta: 1.0}
        punc: {beta: 1.0}
  num_workers: 8

val_reward:
  group_segment: true
  custom_reward_function:
    path: pkg://recipe.phimm.reward.asr_inhouse_measure
    name: eval_score
