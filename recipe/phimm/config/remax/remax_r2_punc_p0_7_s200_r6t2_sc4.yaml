hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base

defaults:
  - remax_asr
  - data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
  - data/val_data/enus_conv_fy21q1_seg
  - _self_

# Fully-async trainer_steps = total_rollout_steps / (ppo_mini_batch_size * sync_step).
# total_rollout_steps tracks total_training_steps; mini_batch=64, sync=4 => 768/256 = 3
# trainer steps, matching sc1 (200/64 = 3) so the sc1-vs-sc4 sync-cadence comparison
# runs the same number of trainer updates. (sc1's total_training_steps=200 gives 3;
# sc4 needs 768 for the same 3.) Raise proportionally (N*64*sync_step) for longer runs.
trainer:
  total_training_steps: 768

async_training:
  staleness_threshold: 0.5
  trigger_parameter_sync_step: 4

algorithm:
  binary_adv: true
  binary_adv_scale: 1.0

reward:
  custom_reward_function:
    path: pkg://recipe.phimm.reward.punc_cap_measure
    name: compute_score
    reward_kwargs:
      reduce: mean
      measures:
        char: {beta: 1.0}
        punc: {beta: 1.0}
  num_workers: 8

val_reward:
  group_segment: true
  custom_reward_function:
    path: pkg://recipe.phimm.reward.asr_inhouse_measure
    name: eval_score
