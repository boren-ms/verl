hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - grpo_asr
  - data/train_data/qwen_bad_lang_tail_hallu_all_pp1
  - data/val_data/qwen_r2_bad_lang_tail_pp1
  - _self_

custom_reward_function:
  path: recipe/phimm/reward/asr_edge.py
  name: compute_score
  reward_kwargs:
    gamma: 0.1
    unit: char
    tail_hallucination:
      min_words: 3
    checks:
      - fmt
      - tail_hallu
      - lang

val_reward:
  custom_reward_function:
    path: recipe/phimm/reward/asr_eval.py
    name: openasr_eval

actor_rollout_ref:
  rollout:
    n: 12
    gt_rollout: false
    temperature: 1.2
    calculate_log_probs: True
    use_rollout_log_probs_as_old: true
    gpu_memory_utilization: 0.7
    max_num_seqs: 24
  actor:
    tis_imp_ratio_cap: 5
    ppo_micro_batch_size_per_gpu: 6
    ppo_mini_batch_size: 64
    optim:
      lr: 5e-6
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2605/amlt-results/fast-llm-2605-qwen3-5-9b-s2-st-example-r2/90000/qwen_hf/
algorithm:
  adv_estimator: remax

data:
  max_prompt_length: 1204
  max_response_length: 512
  train_batch_size: 64
trainer:
  nnodes: 1
  total_epochs: 1
  total_training_steps: 200
  test_freq: 10
  save_freq: 10
  val_before_train: true
  dedup_responses: false
