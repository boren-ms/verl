hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - /ver_2609/v2609_asr@_global_
  - /data/train_data/ls_ts_kw_fixed@data.train_files
  - /data/val_data/kw_ls@data.val_files
  - _self_

reward_functions:
  openml:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      reduce: mean
      measures:
        char: {beta: 0.5}
        word: {beta: 0.5}
        lang: {beta: 1.0}
        fmt: {beta: 1.0}
        bracket: {beta: 1.0}
        repeat: {beta: 1.0}
        # tail_hallu: {beta: 1.0}

reward_function_by_data_source:
  ls_ts_rare: openml

actor_rollout_ref:
  actor:
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 8192
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2607/amlt-results/fast-llm-2607-qwen3-5-9b-s2-data-v3.4-sr-afteraudio-lexical-fix/50000/qwen_hf/
  ref:
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 8192

data:
  train_batch_size: 64