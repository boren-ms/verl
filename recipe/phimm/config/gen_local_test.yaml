hydra:
  searchpath:
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - gen_asr
  - _self_
  - data/train_data/local_debug

data:
  batch_size: 10
  local_output_dir: ~/outputs/phimm_gen_new
  remote_output_dir: null
  output_split_size: 10
  wer_range: [0.001, 0.2]
  err_range: [1, 20]
rollout:
  temperature: 0.0
  top_k: -1 # 0 for hf rollout, -1 for vllm rollout
  top_p: 1
  prompt_length: 5120
  response_length: 1024
  dtype: bfloat16 # should align with FSDP
  gpu_memory_utilization: 0.4