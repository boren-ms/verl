hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - grpo_asr
  - data/train_data/enus_digits_jsonl_100
  - data/val_data/enus_digits
  - _self_

custom_reward_function:
  path: recipe/phimm/reward/digits_measure.py
  name: compute_score
  reward_kwargs:
    reduce: mean
    measures:
      char: {beta: 1.0}
      word: {beta: 1.0}
      digit_char: {beta: 1.0}
      digit_word: {beta: 1.0}
      fmt: {beta: 1.0}
      lang: {beta: 1.0}
      # punc: {beta: 1.0}

val_reward:
  custom_reward_function:
    path: recipe/phimm/reward/digits_measure.py
    name: eval_score


actor_rollout_ref:
  rollout:
    n: 16
    gt_rollout: false
    temperature: 1.0
    calculate_log_probs: True
    use_rollout_log_probs_as_old: true
    gpu_memory_utilization: 0.7
  actor:
    tis_imp_ratio_cap: 5
    ppo_micro_batch_size_per_gpu: 4
    ppo_mini_batch_size: 64
    ppo_epochs: 1
    optim:
      lr: 5e-6
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2605/amlt-results/fast-llm-2605-qwen3-5-9b-s2-st-example-r2/90000/qwen_hf/
algorithm:
  adv_estimator: remax

data:
  chunk_load_mode: cached
  max_prompt_length: 1024
  max_response_length: 512
  train_batch_size: 2048
  val_batch_size: -1
trainer:
  project_name: sr_digits
  nnodes: 1
  total_epochs: 4
  total_training_steps: 200
  test_freq: 10
  save_freq: 10
  val_before_train: true