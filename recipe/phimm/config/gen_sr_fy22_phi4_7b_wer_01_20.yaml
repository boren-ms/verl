hydra:
  searchpath:
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - gen_asr
  - data/train_data/sr_fy22
  - _self_

model:
  path: ${oc.env:DATA_PATH}/users/boren/data/ckp/hf_models/phi4-7b-fast-api-s2-final-v4

data:
  batch_size: 512
  local_output_dir: ~/outputs/gen_prod_fy22_phi4_7b_wer_01_20
