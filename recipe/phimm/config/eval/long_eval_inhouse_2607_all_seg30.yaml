hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - long_eval_asr
  - data/val_data/inhouse_2605_all_seg30
  - _self_

# Combined 30-second pre-segmented InhouseASR_2605 eval for 6 locales:
# en-US, da-DK, hu-HU, nb-NO, nl-NL, cs-CZ.
# All corpora are pre-segmented offline. Per-corpus aggregation stays keyed
# on CorpusName -> data_source. Base knobs live in base/long_eval_asr.yaml.
# Results: {output_path}/result_details.jsonl + {output_path}/measures.json

model:
  path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2607/amlt-results/fast-llm-2607-qwen3-5-9b-s2-data-v3.4-sr-afteraudio/45000/qwen_hf/

data:
  model_version: 2607
  output_path: az://orngwus2cresco/data/boren/data/verl/eval/qwen_2607_45000/inhouse_2605_all_seg30