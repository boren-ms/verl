hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  # Run validation-only generation through trainer v1.
  - long_eval_asr
  - data/val_data/openasr_ml_verb
  - _self_

val_reward:
  reward_functions:
    openasr:
      path: pkg://recipe.phimm.reward.asr_edge
      name: openasr_eval
  reward_function_by_data_source:
    de_fleurs: openasr
    fr_fleurs: openasr
    it_fleurs: openasr
    es_fleurs: openasr
    pt_fleurs: openasr
    de_mcv: openasr
    fr_mcv: openasr
    it_mcv: openasr
    es_mcv: openasr
    fr_mls: openasr
    it_mls: openasr
    es_mls: openasr
    pt_mls: openasr

model:
  path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2607/amlt-results/fast-llm-2607-qwen3-5-9b-s2-data-v3.4-sr-afteraudio-lexical-fix/50000/qwen_hf

data:
  output_path: az://orngwus2cresco/data/boren/data/verl/eval/qwen_2607v1_50000_lexical_fix/openasr_ml_verb
