hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - eval_asr
  - data/val_data/inhouse_2605_en
  - _self_

val_reward:
  custom_reward_function:
    path: recipe/phimm/reward/asr_inhouse_measure.py
    name: eval_score

# verl's get_custom_reward_fn caches sys.modules["custom_module"] from the
# first load (train reward). val_only=True so the train reward never runs,
# but the cached module must be the inhouse one for val_reward.eval_score
# to resolve correctly. Override the top-level path too.
custom_reward_function:
  path: recipe/phimm/reward/asr_inhouse_measure.py
  name: eval_score

data:
  # Segments range up to ~47s and ~230 output tokens; bump from defaults
  # (40 / 1024 / 512) so segments aren't truncated.
  max_audio_dur: 50
  max_prompt_length: 4096
  max_response_length: 1024

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2605/amlt-results/fast-llm-2605-qwen3-5-9b-s2-st-example-r2/90000/qwen_hf/
