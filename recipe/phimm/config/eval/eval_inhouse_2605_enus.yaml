hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - eval_asr
  - data/val_data/inhouse_2605_enus
  - _self_

val_reward:
  custom_reward_function:
    path: recipe/phimm/reward/asr_inhouse_measure.py
    name: eval_score

custom_reward_function:
  path: recipe/phimm/reward/asr_inhouse_measure.py
  name: eval_score

reward_model:
  reward_manager: long_audio_grouped

data:
  max_audio_dur: 50
  max_prompt_length: 4096
  max_response_length: 1024
  # -1 = entire validation set in a single batch, so long_audio_grouped
  # sees all segments of every parent in one reward call.
  val_batch_size: -1

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2605/amlt-results/fast-llm-2605-qwen3-5-9b-s2-st-example-r2/90000/qwen_hf/
