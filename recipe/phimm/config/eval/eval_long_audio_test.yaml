hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - eval_asr
  - data/val_data/long_audio_test
  - _self_

# Reuse the inhouse 2605 reward fn (TER-based); empty references just produce
# trivial scores — we only need the hyp text to verify long-audio support.
val_reward:
  custom_reward_function:
    path: recipe/phimm/reward/asr_inhouse_measure.py
    name: eval_score

custom_reward_function:
  path: recipe/phimm/reward/asr_inhouse_measure.py
  name: eval_score

reward_model:
  # Group per-segment hyps by parent wav, concatenate, then score against the
  # full DisplayTranscription. The TER backend (`eval_score`) is reused as the
  # per-group scorer; this manager handles the grouping.
  reward_manager: long_audio_grouped

data:
  # SVAD caps at 40s, so 50 leaves headroom; bump prompt/response for safety.
  max_audio_dur: 50
  max_prompt_length: 4096
  max_response_length: 1024
  # The grouped reward manager only sees one validation batch at a time, so
  # we need val_batch_size >= total #segments to score the full long wav as
  # a single group. ~3600s / 40s ≈ 90 segments; 256 leaves headroom.
  val_batch_size: 256

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2605/amlt-results/fast-llm-2605-qwen3-5-9b-s2-st-example-r2/90000/qwen_hf/

trainer:
  # Dump one row per long-audio recording (collapse VAD segments that share the
  # same parent wav) instead of one row per segment.
  dump_group_key: parent_audio_path
