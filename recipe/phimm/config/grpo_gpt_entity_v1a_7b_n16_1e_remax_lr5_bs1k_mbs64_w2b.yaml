hydra:
    searchpath:
        - file://recipe/phimm/config/base
        - file://verl/trainer/config
defaults:
    - grpo_asr
    - data/train_data/gpt_entity_v1a # 169547 utts, 1297.7 hrs + 2206.03 hrs
    - data/val_data/entity_rare_v1
    - _self_

custom_reward_function:
    path: recipe/phimm/reward/asr_bias.py
    name: compute_weighted_score
    reward_kwargs:
        score_kwargs:
            - alpha: 1
              choice: "wer" # "err", "acc", "wer"
              text_norm: english # simple (default), identity, lower, basic, simple, simple_with_tag
              unit: word # word (default), char
              weight: 1.0
            - alpha: 1
              choice: "wer" # "err", "acc", "wer"
              text_norm: english # simple (default), identity, lower, basic, simple, simple_with_tag
              unit: char # word (default), char
              weight: 1.0

actor_rollout_ref:
    rollout:
        n: 16
        gt_rollout: true
        temperature: 1.0
        calculate_log_probs: True # required by TIS
        max_num_batched_tokens: 32768
        log_prob_micro_batch_size_per_gpu: 64
        # max_num_seqs: 4096 # 4096*4

    actor:
        ppo_micro_batch_size_per_gpu: 64
        ppo_mini_batch_size: 1024 # global batch size
        ppo_epochs: 1
        tis_imp_ratio_cap: 5
        optim:
            lr: 1e-5
    model:
        path: ${oc.env:DATA_PATH}/users/boren/data/ckp/hf_models/phi4-7b-fast-api-s2-final-v4
algorithm:
    adv_estimator: remax
data:
    train_batch_size: 1024
    val_batch_size: 8192
trainer:
    nnodes: 1
    total_epochs: 1 # 24 step per epoch
    val_before_train: false # don't run val before train
    # total_training_steps: 2200 # ~= 140k samples with bs64, 0.5 epoch
