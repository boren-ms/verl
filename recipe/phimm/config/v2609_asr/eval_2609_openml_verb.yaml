    de_mcv: openasr_ml
    fr_mcv: openasr_ml
    it_mcv: openasr_ml
    es_mcv: openasr_ml
    fr_mls: openasr_ml
    it_mls: openasr_ml
    es_mls: openasr_ml
    pt_mls: openasr_ml
    nl_fleurs: openasr_ml
    nl_mcv: openasr_ml
