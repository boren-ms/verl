# OpenASR-ML verbatim evaluation without language hints or assistant prefixes.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - eval_base
  - /data/val_data/openasr_ml_verb
  - _self_

data:
  # Full-dataset audio batches can exceed vm.max_map_count during worker IPC.
  dataloader_num_workers: 0

actor_rollout_ref:
  model:
    lora_rank: 128
