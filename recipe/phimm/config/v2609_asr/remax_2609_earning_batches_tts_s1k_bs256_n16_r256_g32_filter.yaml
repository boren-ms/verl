hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - data/train_data/earningscall-fy27-en-us-batches-tts-clean
  - /data/val_data/earnings_aa_chunked
  - _self_

reward_functions:
  asr_measure:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: mean
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        keyword: {beta: 1.0}
        lang: {beta: 0.1}
        fmt: {beta: 0.1}

reward_function_by_data_source:
  earning_fy27_verb: asr_measure
  earning_fy27_lex: asr_measure
  earnings_tts_clean_verb: asr_measure
  earnings_tts_clean_lex: asr_measure

actor_rollout_ref:
  rollout:
    temperature: 0.8
  model:
    lora_rank: 256

algorithm:
  filter_groups:
    enable: true
    metric: remax_advantage
    mode: nonzero
    atol: 1e-6
    max_num_gen_batches: 30

data:
  train_batch_size: 256

trainer:
  nnodes: 4
  total_epochs: 30
  total_training_steps: 1000
