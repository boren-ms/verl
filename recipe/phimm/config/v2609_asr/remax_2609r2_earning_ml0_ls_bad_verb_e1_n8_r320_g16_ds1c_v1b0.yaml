# Mix verbatim prompts with and without language hints 50/50 within each source.
# Preserve the donor's 26338/6584/13168 source totals, one epoch, rewards, and validation.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - /data/train_data/openml_verb_langhint_v0@_ml_train
  - /data/train_data/earnings_tts_verb_langhint_v0@_earning_train
  - /data/train_data/ls_rare_bad_verb_langhint_v0@_ls_train
  - /data/train_data/openml_verb_no_langhint_v0@_ml_train_nohint
  - /data/train_data/earnings_tts_verb_no_langhint_v0@_earning_train_nohint
  - /data/train_data/ls_rare_bad_verb_no_langhint_v0@_ls_train_nohint
  - /data/val_data/earnings22_verb_langhint@_earning_val
  - /data/val_data/openasr_ml_bad_fmt_lang_bracket_langhint@_ml_val
  - /data/val_data/ls_kw_verb_langhint@_ls_val
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 3}
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        lang: {beta: 1.0}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech
  openml_nohint: librispeech
  earnings_fy27_nohint: librispeech
  ls_rare_verb_nohint: librispeech

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf
    lora_rank: 320
  actor:
    optim:
      lr: 3.0e-6
      warmup_style: constant
      lr_warmup_steps: 0
  rollout:
    n: 8

data:
  data_source:
    openml: {num_sample: 13169, shuffle: true}
    earnings_fy27: {num_sample: 3292, shuffle: true}
    ls_rare_verb: {num_sample: 6584, shuffle: true}
    openml_nohint: {num_sample: 13169, shuffle: true}
    earnings_fy27_nohint: {num_sample: 3292, shuffle: true}
    ls_rare_verb_nohint: {num_sample: 6584, shuffle: true}
  train_data:
    - ${_ml_train}
    - ${_earning_train}
    - ${_ls_train}
    - ${_ml_train_nohint}
    - ${_earning_train_nohint}
    - ${_ls_train_nohint}
  val_data:
    - ${_earning_val}
    - ${_ml_val}
    - ${_ls_val}
  train_batch_size: 128
  shuffle: true

trainer:
  nnodes: 2
  total_epochs: 1
  total_training_steps: null
