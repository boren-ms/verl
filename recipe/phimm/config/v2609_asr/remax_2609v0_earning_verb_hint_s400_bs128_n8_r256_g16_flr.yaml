hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - /data/train_data/earnings_tts_verb_langhint
  - /data/val_data/earnings22_verb_langhint
  - _self_

reward_functions:
  asr_measure:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: mean
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        lang: {beta: 0.5}
        fmt: {beta: 0.2}

reward_function_by_data_source:
  earnings_fy27: asr_measure

actor_rollout_ref:
  model:
    use_remove_padding: false
  actor:
    filter_nonfinite_log_probs: true
    optim:
      warmup_style: constant
      lr_warmup_steps: 0
  ref:
    filter_nonfinite_log_probs: true
  rollout:
    n: 8

data:
  train_batch_size: 128

trainer:
  nnodes: 2
  total_epochs: 30
  total_training_steps: 400
  filter_nonfinite_log_probs: true
