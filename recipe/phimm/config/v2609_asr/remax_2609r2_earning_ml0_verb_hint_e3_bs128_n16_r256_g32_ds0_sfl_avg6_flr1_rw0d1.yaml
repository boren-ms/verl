# Use the keyword-aware LibriSpeech reward for every training data source.
# Set keyword/lang/fmt/bracket betas to 0.1 and average total to 3; omit edit-only rewards.
# Scale the reduced reward by character accuracy and replace its char component with fixed=1.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - /data/train_data/openml_verb_langhint@_ml_train
  - /data/val_data/earnings22_verb_langhint@_earning_val
  - /data/val_data/openasr_ml_bad_fmt_lang_bracket_langhint@_ml_val
  - /data/val_data/ls_kw_verb_langhint@_ls_val
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 3}
      scale: char
      measures:
        fixed: {beta: 1.0}
        word: {beta: 1.0}
        keyword: {beta: 0.1}
        lang: {beta: 0.1}
        fmt: {beta: 0.1}
        bracket: {beta: 0.1}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf
    lora_rank: 256
  actor:
    optim:
      lr: 3.0e-6
      warmup_style: constant
      lr_warmup_steps: 0
  rollout:
    n: 16

data:
  data_source:
    openml: {num_sample: 13169, shuffle: true}
  train_data:
    - ${_ml_train}
  val_data:
    - ${_earning_val}
    - ${_ml_val}
    - ${_ls_val}
  train_batch_size: 128
  shuffle: true

trainer:
  nnodes: 4
  total_epochs: 3
  total_training_steps: null
