# Use the LS training settings with cached noisy audio and URGENT2024 delta validation.
# Average signed char, word, word edit, keyword, and word-normalized language errors with a fixed divisor of 6.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - /data/train_data/noisy/ls_verb_langhint@_ls_train
  - /data/val_data/urgent2024_delta@_urgent_val
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_measure_v0.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 6}
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        word_del: {beta: 1.0}
        word_ins: {beta: 1.0}
        word_kw: {beta: 1.0}
        word_lang: {beta: 1.0}

reward_function_by_data_source:
  noisy_ls: librispeech

val_reward:
  reward_function_by_data_source:
    urgent2024_delta: openasr_en

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf
    lora_rank: 256
  actor:
    optim:
      lr: 3.0e-6
      warmup_style: constant
      lr_warmup_steps: 0
  rollout:
    n: 16

data:
  data_source:
    noisy_ls: {num_epoch: 1, shuffle: true}
  train_data:
    - ${_ls_train}
  val_data:
    - ${_urgent_val}
  train_batch_size: 128
  shuffle: true

trainer:
  experiment_name: remax_2609r2_noisy_ls_e1_g16_n16_rwe1
  nnodes: 2
  total_epochs: 1
  total_training_steps: null
