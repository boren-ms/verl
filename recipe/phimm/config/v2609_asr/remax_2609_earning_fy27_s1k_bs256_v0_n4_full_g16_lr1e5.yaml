hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - data/train_data/earningscall-fy27-en-us-batch1-langhint
  - /data/val_data/earnings_aa_chunked_langhint
  - _self_

reward_functions:
  asr_measure:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: mean
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        keyword: {beta: 2.0, cut: 0.5}
        lang: {beta: 0.1, cut: 0.25}
        fmt: {beta: 0.1, cut: 0.5}

reward_function_by_data_source:
  earning_fy27_verb: asr_measure
  earning_fy27_lex: asr_measure

actor_rollout_ref:
  rollout:
    n: 4
    engine_kwargs:
      vllm:
        # Full-model rollout hits an Inductor subprocess without an active GPU backend.
        compilation_config: 0
  model:
    lora_rank: 0
  actor:
    optim:
      lr: 1e-5

data:
  train_batch_size: 256

trainer:
  nnodes: 2
  total_epochs: 30
  total_training_steps: 1000
