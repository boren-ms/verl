# Train one shuffled LibriSpeech bad-case epoch; retain the mixed-source validation suite.
# Strip reference brackets; sum signed negative char, word, and keyword errors with beta 1.0 and word-normalized language error with beta 2.0.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - /data/train_data/ls_rare_bad_verb_langhint_v0@_ls_train
  - /data/val_data/earnings22_verb_langhint@_earning_val
  - /data/val_data/openasr_ml_bad_fmt_lang_bracket_langhint@_ml_val
  - /data/val_data/ls_kw_verb_langhint@_ls_val
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_measure_v0.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: sum}
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        word_kw: {beta: 1.0}
        word_lang: {beta: 2.0}

reward_function_by_data_source:
  ls_rare_verb: librispeech

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf
    lora_rank: 256
  actor:
    optim:
      lr: 3.0e-6
      warmup_style: constant
      lr_warmup_steps: 0
  rollout:
    n: 8

data:
  data_source:
    ls_rare_verb: {num_epoch: 1, shuffle: true}
  train_data:
    - ${_ls_train}
  val_data:
    - ${_earning_val}
    - ${_ml_val}
    - ${_ls_val}
  train_batch_size: 64
  shuffle: true

trainer:
  nnodes: 2
  total_epochs: 1
  total_training_steps: null
