# Keep earnings, OpenML including repeats, and LibriSpeech bad cases grouped at a 1:7:7 sample ratio.
# Shuffle within each source, sample 2000/14000/14000 rows respectively, and run one epoch with a constant LR.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - /data/train_data/earnings_tts_verb_langhint@_earning_train
  - /data/train_data/openml_verb_langhint@_ml_train
  - /data/train_data/ls_rare_bad_verb_langhint@_ls_train
  - /data/val_data/earnings22_verb_langhint@_earning_val
  - /data/val_data/openasr_ml_bad_fmt_lang_bracket_langhint@_ml_val
  - /data/val_data/ls_kw_verb_langhint@_ls_val
  - _self_

reward_functions:
  earnings:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 4}
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        lang: {beta: 0.5}
        fmt: {beta: 0.5}
  openml:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 4}
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        lang: {beta: 0.5}
        fmt: {beta: 0.5}
        bracket: {beta: 1.0}
  librispeech:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 4}
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        keyword: {beta: 1.0}
        lang: {beta: 0.5}
        fmt: {beta: 0.5}

reward_function_by_data_source:
  earnings_fy27: earnings
  openml: openml
  ls_rare_verb: librispeech

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf
    lora_rank: 256
  actor:
    optim:
      lr: 3.0e-6
      warmup_style: constant
      lr_warmup_steps: 0
  rollout:
    n: 4

data:
  data_source:
    earnings_fy27: {num_sample: 2000, shuffle: true}
    openml: {num_sample: 14000, shuffle: true}
    ls_rare_verb: {num_sample: 14000, shuffle: true}
  train_data:
    - ${_earning_train}
    - ${_ml_train}
    - ${_ls_train}
  val_data:
    - ${_earning_val}
    - ${_ml_val}
    - ${_ls_val}
  train_batch_size: 128
  shuffle: false

trainer:
  nnodes: 4
  total_epochs: 1
  total_training_steps: null
