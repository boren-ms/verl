# Each grouped pass contains two earnings epochs followed by one OpenML epoch.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - /data/train_data/earnings_tts_verb_langhint@_earning_train
  - /data/train_data/openml_verb_noreps_langhint@_ml_train
  - /data/val_data/earnings22_verb_langhint@_earning_val
  - /data/val_data/openasr_ml_bad_fmt_lang_bracket_langhint@_ml_val
  - _self_

reward_functions:
  earnings:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 4}
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        lang: {beta: 0.5}
        fmt: {beta: 0.2}
  openml:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 4}
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        lang: {beta: 0.5}
        fmt: {beta: 0.2}
        bracket: {beta: 1.0}

reward_function_by_data_source:
  earnings_fy27: earnings
  openml: openml

actor_rollout_ref:
  actor:
    optim:
      lr: 5e-6
      warmup_style: cosine
      lr_warmup_steps: 0
      min_lr_ratio: 0.2
      # Each 232-step pass has 168 earnings-dominant batches (last mixed), then 64 OpenML batches.
      # Keep two source-cycle pairs; later cycles reuse the final length and peak LR.
      cycle_steps: [168, 64, 168, 64]
      cycle_lrs: [5.0e-6, 5.0e-6, 1.0e-6, 1.0e-6]
  rollout:
    n: 8

data:
  data_source:
    earnings_fy27: {num_epoch: 2, shuffle: true}
    openml: {num_epoch: 1, shuffle: true}
  train_data:
    - ${_earning_train}
    - ${_ml_train}
  val_data:
    - ${_earning_val}
    - ${_ml_val}
  train_batch_size: 128
  shuffle: false

trainer:
  nnodes: 4
  total_epochs: 30
  total_training_steps: 464
