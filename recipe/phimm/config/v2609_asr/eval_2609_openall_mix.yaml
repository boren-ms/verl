# Mixed-language data has no hints; OpenASR and OpenML use verbatim language-hint prompts.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - eval_base
  - /data/val_data/mixlang_fy26q2_zh_seg@_mixlang
  - /data/val_data/openasr_verb_langhint@_openasr
  - /data/val_data/openasr_ml_verb_langhint@_openml
  - _self_

data:
  val_data:
    - ${_mixlang}
    - ${_openasr}
    - ${_openml}

val_reward:
  reward_function_by_data_source:
    monsoon_hi_in: openasr_ml
    mixlang_fy26q2: inhouse_zh
    ls_clean: openasr_en
    ls_other: openasr_en
    spgispeech: openasr_en
    ami: openasr_en
    gigaspeech: openasr_en
    voxpopuli_cleaned_aa: openasr_en
    earnings22_cleaned_aa_chunked: openasr_en
    monsoon_en_in: openasr_en
    de_fleurs: openasr_ml
    fr_fleurs: openasr_ml
    it_fleurs: openasr_ml
    es_fleurs: openasr_ml
    pt_fleurs: openasr_ml
    de_mcv: openasr_ml
    fr_mcv: openasr_ml
    it_mcv: openasr_ml
    es_mcv: openasr_ml
    fr_mls: openasr_ml
    it_mls: openasr_ml
    es_mls: openasr_ml
    pt_mls: openasr_ml
    nl_fleurs: openasr_ml
    nl_mcv: openasr_ml
    nl_mls: openasr_ml
