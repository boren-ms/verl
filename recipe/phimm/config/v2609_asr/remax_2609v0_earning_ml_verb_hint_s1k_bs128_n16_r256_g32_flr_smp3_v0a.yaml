# Retain smp3 data sampling and training settings with v0a reward weights.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - /data/train_data/earnings_tts_verb_langhint@_earning_train
  - /data/train_data/openml_verb_noreps_langhint@_ml_train
  - /data/val_data/earnings22_verb_langhint@_earning_val
  - /data/val_data/openasr_ml_bad_fmt_lang_bracket_langhint@_ml_val
  - _self_

reward_functions:
  openml:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: mean
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        lang: {beta: 0.5}
        fmt: {beta: 0.2}
        bracket: {beta: 1.0}

reward_function_by_data_source:
  earnings_fy27: openml
  openml: openml

actor_rollout_ref:
  actor:
    optim:
      lr: 5e-6
      warmup_style: constant
      lr_warmup_steps: 0
  rollout:
    n: 16

data:
  data_source:
    openml: {num_sample: 25600, shuffle: true}
    earnings_fy27: {num_sample: 102400, shuffle: true}
  train_data:
    - ${_earning_train}
    - ${_ml_train}
  val_data:
    - ${_earning_val}
    - ${_ml_val}
  train_batch_size: 128
  shuffle: false

trainer:
  nnodes: 4
  total_epochs: 30
  total_training_steps: 1000
