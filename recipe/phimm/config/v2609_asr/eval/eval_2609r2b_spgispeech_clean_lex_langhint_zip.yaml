# Evaluate the v2609r2b step-400 merged checkpoint on SPGISpeech clean.
# ZIP-backed audio with the lexical prompt and an English language hint.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - eval_base
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/boren/outputs/v2609_asr/remax_2609r2_earning_ml0_ls_bad_verb_hint_e3_bs128_n8_r256_g16_ds1c_sfl_avg6_flr_rm0b_v0/global_step_400/qwen_hf/
    lora_rank: 0

trainer:
  experiment_name: eval_2609r2b_spgispeech_clean_lex_langhint_zip
  nnodes: 1
  resume_mode: disable

data:
  val_data:
    - dataset_name: jsonl
      jsonl_paths: az://orngwus2cresco/data/boren/data/openasr_jsonl/spgispeech/data_zip.jsonl
      cache_name: auto_spgispeech_clean_zip_lex_langhint
      add_task_info:
        task: lang_asr_lex
        language: English
        lang_hint: true
      post_process:
        add_field:
          fields:
            data_source: spgispeech_clean
        verl_format:
          prompt_key: prompt
