# ZIP-backed OpenASR and OpenML evaluation.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - eval_base
  - /data/val_data/openasr_verb_langhint_zip@_openasr
  - /data/val_data/openasr_ml_verb_langhint_zip@_openml
  - _self_

actor_rollout_ref:
  model:
    # Export the raw 54000 checkpoint to qwen_hf before evaluation.
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-en-verbatim-r2/54000/qwen_hf

trainer:
  experiment_name: 2609r3
  nnodes: 4

data:
  val_data:
    - ${_openasr}
    - ${_openml}
