hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - /data/train_data/earnings_tts_verbv_langhint@_earning_train
  - /data/train_data/openml_verb_noreps_langhint@_ml_train
  - /data/val_data/earnings22_verb_langhint@_earning_val
  - /data/val_data/openasr_ml_bad_fmt_lang_bracket_langhint@_ml_val
  - _self_

reward_functions:
  openml:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: mean
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        lang: {beta: 0.2}
        fmt: {beta: 0.1}
        bracket: {beta: 0.5}

reward_function_by_data_source:
  earning_fy27_verb: openml
  earnings_tts_clean_verb: openml
  openml: openml

actor_rollout_ref:
  model:
    # Requires exporting the raw shadow checkpoint to HF format before training.
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.3-shadow/54000/qwen_hf
  actor:
    optim:
      lr: 5e-6
      warmup_style: constant
      lr_warmup_steps: 0
  rollout:
    n: 8

data:
  train_data:
    - ${_earning_train}
    - ${_ml_train}
  val_data:
    - ${_earning_val}
    - ${_ml_val}
  train_batch_size: 128
  shuffle: false

trainer:
  nnodes: 4
  total_epochs: 30
  total_training_steps: 1000
