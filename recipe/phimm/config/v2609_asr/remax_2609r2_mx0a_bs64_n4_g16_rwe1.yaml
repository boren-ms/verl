# First group: 100 batches each of earnings/OpenML/LS.
# Second group: 100 OpenML batches and 1000 LS batches; 1400 batches total.
# At batch size 64, groups contain 19200 and 70400 rows.
# Groups independently sample the full sources and may overlap.
# Average signed char, word, word edit, keyword, and word-normalized language errors with a fixed divisor of 6.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - /data/train_data/openml_verb_langhint_v0@_ml_train
  - /data/train_data/earnings_tts_verb_langhint_v0@_earning_train
  - /data/train_data/ls_rare_bad_verb_langhint_v0@_ls_train
  - /data/val_data/earnings22_verb_langhint@_earning_val
  - /data/val_data/openasr_ml_bad_fmt_lang_bracket_langhint@_ml_val
  - /data/val_data/ls_kw_verb_langhint@_ls_val
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_measure_v0.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 6}
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        word_del: {beta: 1.0}
        word_ins: {beta: 1.0}
        word_kw: {beta: 1.0}
        word_lang: {beta: 1.0}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf
    lora_rank: 256
  actor:
    optim:
      lr: 3.0e-6
      warmup_style: constant
      lr_warmup_steps: 0
  rollout:
    n: 4

data:
  train_data:
    - ${_ml_train}
    - ${_earning_train}
    - ${_ls_train}
  val_data:
    - ${_earning_val}
    - ${_ml_val}
    - ${_ls_val}
  shuffle: false
  train_batch_size: 64
  mix:
    - shuffle: true
      datasource:
        - name: earnings_fy27
          batch: 100
          shuffle: true
        - name: openml
          batch: 100
          shuffle: true
        - name: ls_rare_verb
          batch: 100
          shuffle: true
    - shuffle: true
      datasource:
        - name: openml
          batch: 100
          shuffle: true
        - name: ls_rare_verb
          batch: 1000
          shuffle: true

trainer:
  nnodes: 2
  total_epochs: 1
  total_training_steps: null
