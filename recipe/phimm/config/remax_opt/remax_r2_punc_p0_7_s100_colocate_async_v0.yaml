hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base

defaults:
  - remax_asr
  - data/train_data/qwen_en_hc_200k_entity_fy24q3p2_punc_p0_7
  - data/val_data/enus_conv_fy21q1_seg
  - _self_

# ── GPU layout: async rollout and trainer colocated on all 8 GPUs ──────────
data:
  # V1 colocate_async requires train_batch_size == ppo_mini_batch_size.
  train_batch_size: 30
rollout:
  n_gpus_per_node: 8
  total_updates: 100
  n: 12
trainer:
  use_v1: true
  n_gpus_per_node: 8
  total_epochs: 100
  total_training_steps: 100
  test_freq: 100
  save_freq: 100
  v1:
    trainer_mode: colocate_async
    colocate_async:
      num_warmup_batches: 1
actor_rollout_ref:
  hybrid_engine: true
  model:
    lora:
      merge: true
  actor:
    ppo_mini_batch_size: 30
    ppo_max_token_len_per_gpu: 1024
    fsdp_config:
      fsdp_size: 8   # shard across all 8 colocated GPUs
  rollout:
    free_cache_engine: false
    gpu_memory_utilization: 0.40
    max_num_seqs: 8

async_training:
  staleness_threshold: 0.5
  trigger_parameter_sync_step: 1
  lora_adapter_sync: false

algorithm:
  binary_adv: true
  binary_adv_scale: 1.0

reward:
  custom_reward_function:
    path: pkg://recipe.phimm.reward.punc_cap_measure
    name: compute_score
    reward_kwargs:
      reduce: mean
      measures:
        char: {beta: 1.0}
        punc: {beta: 1.0}
  num_workers: 8

val_reward:
  group_segment: true
  custom_reward_function:
    path: pkg://recipe.phimm.reward.asr_inhouse_measure
    name: eval_score
