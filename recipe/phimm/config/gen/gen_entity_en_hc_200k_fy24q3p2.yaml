hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - gen_asr
  - data/train_data/entity/entity_en_hc_200k_fy24q3p2
  - _self_

model:
  path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2605/amlt-results/fast-llm-2605-qwen3-5-9b-s2-st-example/90000/qwen_hf/

data:
  output_path: az://orngwus2cresco/data/boren/data/verl/gen_qwen/en_hc_200k_entity_fy24q3p2
  # Reduce shmem pressure: prior runs crashed with `unable to mmap ... Cannot allocate memory`
  # in the dataloader producer after ~330 batches due to accumulated shmem state.
  num_workers: 4
  persistent_workers: false
  prefetch_factor: 2

rollout:
  # Leave headroom for torch.compile / inductor benchmark allocations during init.
  gpu_memory_utilization: 0.6
  # Skip torch.compile / CUDA graph capture entirely: prior runs OOM'd in
  # inductor benchmark_combo_kernel even at 0.6 utilization.
  enforce_eager: true
