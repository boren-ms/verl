hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - gen_asr
  - data/train_data/ls_raw
  - _self_

model:
  path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2605/amlt-results/fast-llm-2605-qwen3-5-9b-s2-st-example/90000/qwen_hf/

data:
  output_path: az://orngwus2cresco/data/boren/data/verl/gen_qwen/en_ls
  batch_size: 2048               # large dispatch -> vLLM stays saturated end-to-end
  output_split_size: 20000       # fewer parquet writes; larger chunks per blob upload
  num_workers: 32                # more producers feeding the prep_queue
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true
  prefetch_depth: 6              # deeper prep<->generate<->consume pipeline

rollout:
  temperature: 0.0
  top_k: -1
  top_p: 1
  gpu_memory_utilization: 0.85   # leave headroom for prefill activations on H100
  max_num_batched_tokens: 131072 # 16k * 8 prefilled per step
  max_num_seqs: 2048             # concurrent decodes
  enforce_eager: false
  enable_chunked_prefill: true   # keep: interleaves prefill of long prompts with ongoing decodes
  free_cache_engine: true     