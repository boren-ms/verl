# ASR Generation Config — LibriSpeech
# Uses standalone vLLM server replicas for batch ASR inference.
#
# Usage:
#   python3 -m recipe.phimm.main_asr_gen \
#       --config-path=../../recipe/phimm/config/gen \
#       --config-name=gen_oss_ls

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  custom_cls:
    path: recipe/phimm/data/rl_dataset.py
    name: RLHFDataset
  train_data:
    - dataset_name: tsv
      tsv_paths: az://orngwus2cresco/data/boren/data/LibriSpeech/asr_train_transcribe.tsv
      add_task_info:
        task: lang_asr
      post_process:
        add_field:
          fields:
            data_source: asr
        verl_format:
          prompt_key: prompt
  batch_size: 512
  output_path: az://orngwus2cresco/data/boren/data/verl/gen_qwen/en_ls
  output_split_size: 20000
  max_prompt_length: 1024
  max_response_length: 768
  max_audio_dur: 40
  num_workers: 4
  return_raw_chat: true
  return_multi_modal_inputs: false   # vLLM computes audio embeddings internally
  # Generation sampling overrides (passed to vLLM SamplingParams)
  stop_token_ids: [248044, 248046]

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2605/amlt-results/fast-llm-2605-qwen3-5-9b-s2-st-example/90000/qwen_hf
    trust_remote_code: true
  rollout:
    name: vllm
    nnodes: 1                        # standalone server mode
    temperature: 0.0
    top_p: 1.0
    response_length: ${data.max_response_length}
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.85
    max_num_seqs: 24
    enforce_eager: false
    enable_chunked_prefill: true
    load_format: auto                # load real weights (not dummy)
    free_cache_engine: false         # keep cache for continuous generation
    calculate_log_probs: false

trainer:
  n_gpus_per_node: 8
  nnodes: 1
