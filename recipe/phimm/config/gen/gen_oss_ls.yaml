hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - gen_asr
  - data/train_data/ls_raw
  - _self_

model:
  path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2605/amlt-results/fast-llm-2605-qwen3-5-9b-s2-st-example/90000/qwen_hf/

data:
  output_path: az://orngwus2cresco/data/boren/data/verl/gen_qwen/en_ls
  batch_size: 1024               # large dispatch -> vLLM stays saturated end-to-end
  output_split_size: 20000       # fewer parquet writes; larger chunks per blob upload
  num_workers: 16                # producers feeding the prep_queue (kept small to bound host RAM with audio)
  prefetch_factor: 2
  pin_memory: false              # audio batches are big; pinned memory would balloon host RSS
  persistent_workers: true
  prefetch_depth: 3              # prep<->generate<->consume pipeline depth (host RAM bound)

rollout:
  temperature: 0.0
  top_k: -1
  top_p: 1
  gpu_memory_utilization: 0.78   # share H100 with FSDP shard (~9-18GB) + vLLM weights + KV cache
  max_num_batched_tokens: 131072 # 16k * 8 prefilled per step
  max_num_seqs: 1024             # concurrent decodes (matches input batch)
  enforce_eager: false
  enable_chunked_prefill: true   # interleaves prefill of long prompts with ongoing decodes
  free_cache_engine: true     