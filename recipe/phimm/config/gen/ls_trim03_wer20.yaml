hydra:
  searchpath:
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - gen_asr
  - data/train_data/ls_trim03
  - _self_

model:
  path: ${oc.env:DATA_PATH}/boren/data/ckp/hf_models/Phi4-7b-STT-2603-SR2

data:
  batch_size: 512
  remote_output_dir: ${oc.env:DATA_PATH}/boren/data/verl/gen_filtered/ls_trim03_wer20
  output_split_size: 10000
  wer_range: [0.2, 100.0]

rollout:
  temperature: 0.0
  gpu_memory_utilization: 0.8
