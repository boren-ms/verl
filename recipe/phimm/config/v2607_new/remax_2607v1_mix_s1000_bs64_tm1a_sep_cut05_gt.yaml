hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - data/train_data/bad_mix13k_lid0
  - _self_

reward_functions:
  mix:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2607
      reduce: mean
      measures:
        char: {beta: 0.5}
        word: {beta: 0.5}
        lang: {beta: 1.0, cut: 0.25}
        fmt: {beta: 1.0, cut: 0.5}

reward_function_by_data_source:
  mix: mix

actor_rollout_ref:
  model:
    lora_rank: 64
  rollout:
    gt_rollout: true

data:
  train_batch_size: 64

trainer:
  total_training_steps: 1000