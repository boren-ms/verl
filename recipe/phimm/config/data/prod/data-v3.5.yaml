data_audio_processor:
  name: "cascades"

seq_len: 16384 # 10240 #7168
compression_rate: 8    # in   speech encoder
downsample_rate: 1     # after speech encoder qformer / linear ds
use_storage_api: True
multi_threaded_download: True   # set true for h200 cluster
prefetch_queue_size: 16  # Host-RAM mitigation: fewer prefetched batches per dataset provider.
conv_template: qwen3_audio_nothink_instruct # qwen3_audio_instruct # mistral3_audio_instruct # phi_o_long
prompt_formatter: asr # -lid
prompt_formatter_lexical: asr-lexical
instruction_first: True
tts_domain_data_weight: 0.04
OSS_data_weight: 1.0
padding_mask: True   # True for qwen3.5

batcher_buffer_size: 500
medium_batcher_buffer_size: 2000
large_batcher_buffer_size: 4000
num_chunks_for_shuffling: 3
medium_num_chunks_for_shuffling: 5
large_num_chunks_for_shuffling: 10

tokenizer:
  pretrained_model_name_or_path: /datablob1/users/ruchaofan/Phi-omni-checkpoints/language_ckpt/Qwen3.5-9B/

pad_to_context_length: False

dataset:

  ################   Fast-LLM 2609 Data V3.5 - 25-locale expansion, mixed lexical v2 20260904 ###############

  # Active expansion: 10 Tier-3 locales + 11 additional Indian locales beyond
  # existing hi-IN + vi-VN/fil-PH/lt-LT/et-EE = 25 net-new locales.
  # Stage 1 trains all 11 Indian locales at 2x; ur-IN and the zh-HK/zh-TW
  # candidates are deferred to stage 2, where Indian data uses ASR-LID.

  # Live manifest accounting (2026-09-04). Hours below apply sample_ratio,
  # per-entry ratio, and top-level dataset weight. Indian hours are an upper
  # bound because the Mix/Native label filter is applied per sample at runtime.
  #   EN+DE:                    1,843,831.49 weighted hours
  #   Ghost:                        3,363.37 weighted hours
  #   EN Verbatim:                770,994.79 weighted hours
  #   FR+IT+ES+PT (1.3x):       1,000,931.58 weighted hours
  #   CJK+AR:                   1,703,497.25 weighted hours
  #   Podcast Fast S2S:          638,731.04 weighted hours
  #   Podcast GPT4o-mini (1.3x): 278,286.88 weighted hours
  #   TTS (0.04x):                30,659.83 weighted hours
  #     repeating digits (4x):    11,791.64 weighted hours (effective 0.16x)
  #   Tier-2 + expansion display: 977,189.19 weighted hours
  #   Indian expansion (2x):       <=91,082.91 weighted hours before Mix/Native filtering
  #   Tier-2 + expansion lexical: 414,715.73 weighted hours
  #   OSS lexical/display/WavLLM:  26,998.28 weighted hours
  #   Total:                    <=7,780,282.33 weighted hours before Mix/Native filtering
  # Pre-weight exposure before the Indian sample-level filter is 8,173,690.89 hours.
  # Keep the audited 126,000-step p2 budget; Yue removal and Mix/Native filtering
  # lower actual exposure slightly. P1 remains a fixed 5,000-step warmup.
  #
  # V3.5 changes from V3.4:
  # Xiaoqing Yang (PR 39768):
  # - FR: add 59,468.10h FY26 HC and prefer adjusted-TN-DPP/TN captions
  #       (+77.3k weighted at 1.3).
  # - PL: replace 18,114.96h HC with 116,669.70h FY23-FY27 HC and PL TN (+98.6k).
  # - RU: replace 121,777.43h HC with 86,939.89h display HC, add 230.02h lexical HC,
  #       and apply RU TN to HC/MDT/TTS/lexical data (-34.6k).
  # Ma Jin (PR 40004):
  # - DE: add 8,122.55h HC and 598.55h MDT; merge HT/MDT/TTS at full weight
  #       and add adjusted-TN HC fallback (+8.7k).
  # - HE: replace 4,475.90h verbatim with 7,869.85h lexical HT and 4,407.68h
  #       adjusted-TN display HC (+7.8k).
  # Kenichi Kumatani (PR 38701, PR 39417, PR 39882):
  # - CS: replace 2,882.73h HC with 15,692h FY23-FY27Q1 HC and add 503h HT (+13.3k).
  # - TR: replace 33,673.31h HC with 50,345h FY23-FY26Q4 HC (+16.7k).
  # - KO: replace 72,388.32h HC with 82,064.33h FY23Q2-FY27Q1 HC (+9.7k).
  # - JA: add 22,833.71h FY26Q2-FY27Q1 HC with display_original selection.
  # Yan Zhao (PR 39851, PR 39849):
  # - NL: add 4,884.2h validated FY26 display HC with adjusted-TN selection (+4.9k).
  # - FI: add 5,068.4h validated FY26Q4 display HC with adjusted-TN selection (+5.1k).
  # Ao Zhang (PR 39536):
  # - ZH-CN: add 467,494.52h Free26 Q1 display data at full weight and use the
  #          GPT4o-first, DPP-fallback selector inherited from PR 36769 (+467.5k).
  # - ZH-HK: retain verified 36.3k-hour batch1 as a disabled stage-2 display candidate.
  # - ZH dialect data: remove the 13.50h yue-CN source because its references are Cantonese.
  # Xiaojun Liu:
  # - Tier-3: add 10 prepared locales (ms-MY, ca-ES, ro-RO, fa-IR, sk-SK,
  #           sl-SI, cy-GB, lv-LV, uk-UA, bg-BG, hr-HR).
  # - Tier-4 (Unverified yet): add vi-VN, fil-PH, and lt-LT HC/HT display data, plus verified
  #           lexical vi-VN and et-EE HT. vi-VN lexical durations are recovered
  #           exactly from feature frames because its source manifest reports zero.
  # Indian Team:
  # - 11 Indian locales: train hi-IN, as-IN, bn-IN, gu-IN, kn-IN, ml-IN, mr-IN, or-IN,
  #           pa-IN, ta-IN, and te-IN for 2x exposure with standard ASR in stage 1;
  #           use LID-aware chunks and retain only Mix/Native samples.
  #           Defer ur-IN and ASR-LID targets to stage 2 to avoid Hindi/Urdu confusion.
  # 2609 recipe adjustments:
  # - ZH-CN: sample legacy zh_hc_yan_raw at 0.25 (~97.7k effective hours) to
  #          reduce likely overlap with Free26 (-293.1k).
  # - Buffers: merge weight-1 Tier-3/Tier-4 display and lexical sources into
  #            the matching Tier-2 datasets; keep Indian data separate at 2x.
  # - Tier-1 ablation wins: add curated Illinois display and repeating-digit
  #                         TTS for 9 locales; filter 6 Earnings22 eval calls.

  ################################# EN + DE ####################################################
  - sample_profiles:
      asr_en_core:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_human_caption_adjusted
            filter_tagging_failure_data: false
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50
          illegal_char_filter: true

        text_normalization:
          unicode_normalize: false
          tn_rule_file: /datablob1/users/ruchaofan/tn/filter_disfluency_tags_and_nsnoise.txt

      asr_en_domain:
        filter_options:
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1

      asr_illinois_display:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_trans_abbr_fix
            filter_tagging_failure_data: false
            require_transcription_key: true
          info_field_filter:
            field: display_trans_abbr_fix_wer
            excluded_values:
              - 999
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          illegal_char_filter: true
        text_normalization:
          unicode_normalize: false
          tn_rule_file: /datablob1/users/ruchaofan/tn/filter_disfluency_tags_and_nsnoise.txt

      asr_de_hc:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_human_caption_adjusted
              - display_human_caption_adjusted_tn
            filter_tagging_failure_data: false
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50

        text_normalization:
          unicode_normalize: false
          tn_rule_file: /datablob1/users/ruchaofan/tn/filter_disfluency_tags_de_V3.txt

      asr_de_general:
        filter_options:
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1

        text_normalization:
          unicode_normalize: false
          tn_rule_file: /datablob1/users/ruchaofan/tn/filter_disfluency_tags_de_V3.txt

    dataset_spec:
      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/en/en_asr_hc.json                       # 618199.92 hours
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/en/en_asr_hc_fy24_400k.json             # 389955.90 hours
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/en/en_asr_hc_fy24_200k.json             # 237132.46 hours
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/en/en_asr_ht.json                       # 210169.48 hours
        sample_profile: asr_en_core

      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2505_readable/en/en_asr_digit_tts.json                # 379.59 hours
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2505_readable/en/en_asr_entity.json                   # 7505.86 hours
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2505_readable/en/en_asr_global_dictionary.json        # 266.62 hours
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2505_readable/en/en_asr_medical_tts_new.json          # 9353.46 hours
        sample_profile: asr_en_domain

      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2607/en/en_asr_illinois_accessibility_display.json    # 230.97 hours, 100956 curated examples
        sample_profile: asr_illinois_display

      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/de/de_hc.json                 # 36008.73 hours, number of examples: 5.061M, average duration: 25.61s
        - /datablob1/users/majin/DataSpecs/mlang_asr_data_2605/tier2_260521/data_config_dede_newhc.json # 8122.55 hours
        sample_profile: asr_de_hc

      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/de/de_ht_gpt.json             # 307662.57 hours, number of examples: 195.537M, average duration: 5.66s
        - /datablob1/users/majin/DataSpecs/mlang_asr_data_2605/tier2_260521/data_config_dede_MDT.json # 598.55 hours
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/de/de_tts_domain.json         # 18188.25 hours, number of examples: 7.695M, average duration: 8.51s
        sample_profile: asr_de_general

    transform_cls:
      name: AudioTextConversationTransform
      conv_template: ${conv_template}
      prompt_formatter: ${prompt_formatter}
      fixed_prompt: True
      instruction_first: ${instruction_first}
      batch_format: "samples_to_batch"    # "samples_to_sequence", "samples_to_batch"

    use_storage_api: ${use_storage_api}
    multi_threaded_download: ${multi_threaded_download}
    prefetch_queue_size: ${prefetch_queue_size}
    compression_rate: ${compression_rate}
    qformer_compression_rate: ${downsample_rate}
    seq_len: ${seq_len}
    batcher_buffer_size: ${large_batcher_buffer_size}
    batcher_batch_size: ${seq_len}
    num_chunks_for_shuffling: ${large_num_chunks_for_shuffling}
    weight: 1.0
    tokenizer: ${tokenizer}
    audio_processor: ${data_audio_processor}
    pad_to_context_length: ${pad_to_context_length}
    dataset_provider: blob_chunk_alm

  - dataset_spec:
      - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/en/en_asr_ghost_words.json   # 1681.68 hours

    filter_options:
      max_utterance_frames: 4000
      min_utterance_frames: 0
      max_utterance_labels: 200
      min_utterance_labels: 0

    transform_cls:
      name: AudioTextConversationTransform
      conv_template: ${conv_template}
      prompt_formatter: ${prompt_formatter}
      fixed_prompt: True
      instruction_first: ${instruction_first}
      batch_format: "samples_to_batch"    # "samples_to_sequence", "samples_to_batch"

    use_storage_api: ${use_storage_api}
    multi_threaded_download: ${multi_threaded_download}
    prefetch_queue_size: ${prefetch_queue_size}
    compression_rate: ${compression_rate}
    qformer_compression_rate: ${downsample_rate}
    seq_len: ${seq_len}
    batcher_buffer_size: ${batcher_buffer_size}
    batcher_batch_size: ${seq_len}
    num_chunks_for_shuffling: ${num_chunks_for_shuffling}
    weight: 2.0
    tokenizer: ${tokenizer}
    audio_processor: ${data_audio_processor}
    pad_to_context_length: ${pad_to_context_length}
    dataset_provider: blob_chunk_alm

  ################################# EN Verbatim ####################################################
  - sample_profiles:
      asr_en_verbatim:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_human_caption_adjusted_with_filler_tag
              - display_dpp
            filter_tagging_failure_data: false
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50
          illegal_char_filter: true
          remove_utterance_by_corpus_transcript_pattern:
            corpus_patterns:
              - en-AU_DAI_multiple-speaker-spontaneous_FY22Q4_TRAIN-withseg
              - en-GB_DAI_multiple-speaker-spontaneous_FY22Q4_TRAIN-withseg
              - en-GB_DAI_single-speaker-spontaneous_FY22Q4_TRAIN-withseg
              - en-GB_King-ASR-680_TRAIN-withseg
              - en-PH_DAI_multiple-speaker-spontaneous_FY22Q4_TRAIN-withseg
              - en-US_DAI_multiple-speaker-spontaneous_FY22Q4_TRAIN-withseg
              - en-US_DAI_single-speaker-spontaneous_FY22Q4_TRAIN-withseg
              - en-US_King-ASR-733_TRAIN-withseg
            original_transcript_patterns:
              - <FILL/>
        text_normalization:
          unicode_normalize: false
          tn_rule_file: /datablob1/users/ruchaofan/tn/verbatim_keep_fillers.txt

    dataset_spec:
      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/en/en_asr_hc_600k_verbatim.json         # 612771 hours (HC v2 FY22+FY23)
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/en/en_asr_ht_verbatim.json              # DPP r8/r9/r10/r12 + conversation (101 corpora)
        sample_profile: asr_en_verbatim

    transform_cls:
      name: AudioTextConversationTransform
      conv_template: ${conv_template}
      prompt_formatter: asr-verbatim
      fixed_prompt: True
      instruction_first: ${instruction_first}
      batch_format: "samples_to_batch"

    use_storage_api: ${use_storage_api}
    multi_threaded_download: ${multi_threaded_download}
    prefetch_queue_size: ${prefetch_queue_size}
    compression_rate: ${compression_rate}
    qformer_compression_rate: ${downsample_rate}
    seq_len: ${seq_len}
    batcher_buffer_size: ${medium_batcher_buffer_size}
    batcher_batch_size: ${seq_len}
    num_chunks_for_shuffling: ${medium_num_chunks_for_shuffling}
    weight: 1.0
    tokenizer: ${tokenizer}
    audio_processor: ${data_audio_processor}
    pad_to_context_length: ${pad_to_context_length}
    dataset_provider: blob_chunk_alm

  ################################# FR + IT + ES + PT with data weight 1.3 ####################################################
  - sample_profiles:
      asr_fr_it_hc:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_human_caption_adjusted
            filter_tagging_failure_data: false
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50

        text_normalization:
          unicode_normalize: false
          tn_rule_file: /datablob1/users/ruchaofan/tn/hc_simple_tn_rules.txt

      asr_fr_gpt:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_GPT4o_from_dpp_fr-fr_DisfluencyRemoved
              - display_GPT4o_from_dpp_fr-ca_DisfluencyRemoved
              - display_dpp_fr-fr_DisfluencyRemoved
              - display_dpp_fr-ca_DisfluencyRemoved
            apply_gpt_dpp_fall_back_logic: true
            apply_gpt_dpp_fall_back_punctuation: "!\"#$%&'()*+,-./:;<=>?@[]^_`{|}~«»€"
            apply_gpt_dpp_fall_back_punctuation_to_remove: "LEADING_TRAILING"
            apply_gpt_dpp_fall_back_enable_gpt_fallback: true
            apply_gpt_dpp_fall_back_enable_alignment_err_fallback: False
            apply_gpt_dpp_fall_back_alignment_err_threshold: 20
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50

      asr_it_gpt:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_GPT4o_from_dpp_it-it_DisfluencyRemoved
              - display_dpp_it-it_DisfluencyRemoved
            apply_gpt_dpp_fall_back_logic: true
            apply_gpt_dpp_fall_back_punctuation: "!\"#$%&'()*+,-./:;<=>?@[]^_`{|}~«»€"
            apply_gpt_dpp_fall_back_punctuation_to_remove: "LEADING_TRAILING"
            apply_gpt_dpp_fall_back_enable_gpt_fallback: true
            apply_gpt_dpp_fall_back_enable_alignment_err_fallback: False
            apply_gpt_dpp_fall_back_alignment_err_threshold: 20
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50

      asr_es_core:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_dpp_es-mx_DisfluencyRemoved
              - display_human_caption_adjusted
            filter_tagging_failure_data: false
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50
          remove_utterance_by_punctuation_numbers:
            punctuation_list_file: /datablob1/users/v-lianlanxu/HC_es_Dispaly/Trans/es_punc_V1.txt
            threshold: 25

        text_normalization:
          unicode_normalize: false
          tn_rule_file: /datablob1/users/majin1/tn/filter_disfluency_tags_v6_fix.txt

      asr_es_gpt:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_GPT4o_from_dpp_es-mx_DisfluencyRemoved
              - display_dpp_es-mx_DisfluencyRemoved
            apply_gpt_dpp_fall_back_logic: true
            apply_gpt_dpp_fall_back_punctuation: "!\"#$%&'()*+,-./:;<=>?@[]^_`{|}~\xBF\
                        \xA1\xBA\xAA\xAB\xBB\u20AC"
            apply_gpt_dpp_fall_back_punctuation_to_remove: LEADING_TRAILING
            apply_gpt_dpp_fall_back_enable_gpt_fallback: true
            apply_gpt_dpp_fall_back_enable_alignment_err_fallback: false
            apply_gpt_dpp_fall_back_alignment_err_threshold: 20
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50

        text_normalization:
          unicode_normalize: false
          tn_rule_file: /datablob1/users/majin1/tn/filter_disfluency_tags_v6_fix.txt

      asr_pt_hc:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_human_caption_adjusted
            filter_tagging_failure_data: false
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 1000
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50
      asr_pt_ht_domain:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_GPT4o_from_dpp_pt_DisfluencyRemoved
            apply_gpt_dpp_fall_back_logic: false
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 1000
          min_utterance_labels: 1

    dataset_spec:
      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/fr/fr_hc.json      # 29406.17 hours, number of examples: 4.128M, average duration: 25.65s
        - /datablob1/users/xiaoqingyang/fr/fr_0803/fr_hc_FY26_newPipeline_display.json # 59468.10 hours, number of examples: 9.015M
        sample_profile: asr_fr_it_hc
        sample_overrides:
          filter_options:
            transcript_selector:
              transcription_keys:
                - display_human_caption_adjusted_tn_dpp
                - display_human_caption_adjusted_tn
                - display_human_caption_adjusted

      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/it/it_hc.json      # 18856.12 hours, number of examples: 2.680M, average duration: 25.33s
        # V3.2: removed fr_cortana - caused -7.8% EER regression on fr-FR OnlineMeetings
        # - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/fr/fr_cortana.json # 4833.15 hours, number of examples: 4.799M, average duration: 3.63s
        sample_profile: asr_fr_it_hc
      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/fr/fr_ht_gpt.json                    # 137631.11 hours, number of examples: 109.133M, average duration: 4.54s
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/fr/fr_old_domain_wo_tts_digits.json # 5358.26 hours, number of examples: 3.928M, average duration: 4.91s
        sample_profile: asr_fr_gpt

      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/it/it_ht_gpt.json                   # 194323.63 hours, number of examples: 112.692M, average duration: 6.21s
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/it/it_old_domain_wo_tts_digit.json              # 2873.48 hours, number of examples: 2.300M, average duration: 4.50s
        sample_profile: asr_it_gpt
      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/es/es_hc.json                 # 84183.54 hours, number of examples: 11.854M, average duration: 25.57s
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/es/es_tts_domain.json         # 12209.71 hours, number of examples: 2.212M, average duration: 19.87s
        sample_profile: asr_es_core

      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/es/es_ht_gpt.json     # 105634.51 hours, number of examples: 83.076M, average duration: 4.58s
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/es/es_old_domain.json # 2911.12 hours, number of examples: 2.672M, average duration: 3.92s
