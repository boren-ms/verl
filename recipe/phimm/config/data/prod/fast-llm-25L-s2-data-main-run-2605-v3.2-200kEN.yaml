  ################################# CJK + AR with data weight 1.0 ####################################################
  # Total Training Audio Text Pairs: 711214534, Total Duration: 1589712.8906555385 hours
  - sample_profiles:
      asr_ko_core:
        filter_options:
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
