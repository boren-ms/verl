data_audio_processor: 
  name: "cascades"
  
seq_len: 16384 # 10240 #7168
compression_rate: 8    # in   speech encoder
downsample_rate: 1     # after speech encoder qformer / linear ds
use_storage_api: True 
multi_threaded_download: True   # set true for h200 cluster
prefetch_queue_size: 16 # 64
large_prefetch_queue_size: 32
conv_template: qwen3_audio_instruct # mistral3_audio_instruct # phi_o_long
prompt_formatter: asr-lid # -lid
tts_domain_data_weight: 0.01
padding_mask: True   # True for qwen3.5

batcher_buffer_size: 1000
medium_batcher_buffer_size: 2000
large_batcher_buffer_size: 4000
num_chunks_for_shuffling: 5
medium_num_chunks_for_shuffling: 5
large_num_chunks_for_shuffling: 10

bias_max_num: 4000
max_hit_ratio: 0.4
bias_prompt_formatter: asr-lid-pl # -ctc
bias_data_weight: 100

codeswitch_data_weight: 0.075
OSS_data_weight: 1.0


batcher_batch_size_asr: 64
batcher_batch_size_cs: 32
batcher_batch_size_ast: 64

ghost_words_prompt_formatter: asr-lid-ghost
asr_lexical_prompt_formatter: asr-lid-lexical
ast_cot_prompt_formatter: ast-lid-cot
ast_prompt_formatter: ast-lid

tokenizer:
  pretrained_model_name_or_path: /datablob1/users/ruchaofan/Phi-omni-checkpoints/language_ckpt/Qwen3.5-9B/

pad_to_context_length: False 

dataset:

  ################   Fast-LLM 2605 Data V1 Main Run ###############
  # Compared to 2603 version
  # 1. LLM Backbone: we decide to use Qwen3-8b as it has longer context length and more balanced performance on tier-1 languages
  # 2. Tier-1 - ar data update (add missing data in 2603 version)
  # 3. Tier-1 - zh-CN config fix with sp_transcription = False for untokenized data
  # 4. Tier-2 - new data shared by @Rui Jiang, data: 20260320
  # Note:
  # HT not verified: he-IL, hu-HU, sv-SE, cs-CZ, using verbatim data from Yan, no id-ID ht data
  # TTS data not ready: da/he/nb/hu
  # 5. Tier-2 - 12 Indian locales added
  ###################  V2 20260406 ####################
  # 0. Update to Qwen3.5 - larger vocab size and longer context length
  # 1. FR, IT remove tts digits
  # 2. TH Fall back to 2603 version
  # 3. Indian lcoales, use Hi-IN only in stage-1, because there are script issues.
  # 4. Remove zh-TW, it is a script issue and we move it to later stage
  # 5. Do not use ctc filter for tier2, in case the tokenizer does not support the language well
  # 6. For tier1, change the ratio to 4 in case data filtered
  ###################  V2.5  20260409 #####################
  # 1. Remove all ctc filters as it is a legacy issue to remove fast-paced data
  # 2. pt-BR GPT data, verified by @Rui Zhao
  # 3. Xiaoyang data fix v2
  # 4. Fi-FI fallback to 2603
  ###################  V3 20260415 ########################
  # 1. FR - Cortana data (4.8k hours), by @Eric Sun
  # 2. Update PT data - v17 domain, verified by @Eric Sun
  # 3. Add PT-IT podcast - 59.7k + 59.3k hours, verified gain on onlinemeeting by @Rui Zhao
  # 4. New KO data - 11.5k HC + 1.1k MDT, by @An Zhou
  # 5. New AR data - 6.8k MDT + KingASR, by @Xiaoqing Yang
  # 6. Tier2 Data updates by @Rui Jiang
  #    turbo version, removing gpt refine and concat (unverified)
  #    (1) Update cs/fi/th/hu/pl/ru/da/he/id/nb/nl/sv data
  #    (2) Add concat data for cs/da/fi/he/hu/id/nb/nl/pl/ru/sv
  #    (3) HC data TN rule, efficient TN implementation by @Ma Jin
  #    (4) Offline RU TN (cost 3 hours) by @Ruchao Fan
  # 7. Add JA customer data: 160h by @Kenichi
  # 8. zh-CN data: setup C -> G, gain on onlinemeeting by @Ao Zhang
  ###################  V3.2 20260502 ########################
  # Performance-based fixes from V3 evaluation:
  # 1. AR: Downsample ar_tts_domain_clean (130k) with sample_ratio=0.5 in CJK+AR block
  #    Reason: 130k TTS at full weight overwhelms real AR data, causes regression with longer training
  # 2. JA: Remove ja_customer.json (160h) - caused JA regression
  # 3. id-ID: Remove new id-ID HT (260415) - caused -15.3% TER regression
  # 4. ru-RU: Revert HT to 260320 version - 260415 caused -8.8% TER regression
  # 5. sv-SE: svse_ht (21.9k) with sample_ratio=0.5 (~11k effective) - 260415 caused -5.1% EER regression
  # 6. FR: Remove fr_cortana.json (4.8k) - caused -7.8% EER regression on OnlineMeetings
  # 7. Tier-2: Merge 3 separate data specs (HC, HT+MDT, TTS) into one, grouped by locale
  # 8. ZH: Setup K from Ao - separate ZH block, use zh_ht_dialect_raw_recapgpt
  # 9. Podcast (Fast S2S): Add 8 new locales (ar/es-ES/es-MX/fr-CA/fr-FR/ja/ko/zh), weight 1.5
  #    Total Fast S2S podcast: 119k -> 725k hours (606k new)
  # 10. Podcast (GPT4o-mini): Add 9 locales (cs/en/fi/ko/pl/pt/ru/sv), ~65k hours, weight 2.0
  #     Source: am_data/mai_podcast/gpt4o-mini-transcribe/release20260417
  # 11. th-TH: Downsample thth_tts (40.5k) with sample_ratio=0.1 (~4k effective)
  #     assumption: th-TH TTS data has quality issues, as EER drops from v2.5 -> v3
  
  # V3.2 Data Changes (V3 -> V3.2):
  #   FR+IT+ES+PT:  715k -> 711k  (-4.8k, removed fr_cortana)
  #   JA:           328k -> 328k  (-0.2k, removed ja_customer, negligible)
  #   AR:           423k -> 423k  (same raw, but ar_tts_domain_clean uses sample_ratio=0.5, ~65k effective)
  #   ZH:            506k -> 506k  (same data, new recapgpt HT)
  #   Tier-2 HT+MDT: 525k -> 495k (-30k, removed id-ID HT, reverted ru-RU/sv-SE HT; +svse_ht*0.5)
  #   Tier-2 TTS:   547k -> 510k  (-37k, th-TH TTS uses sample_ratio=0.1)
  #   Podcast:      119k -> 725k  (+606k Fast S2S, weight 1.5) + 59k (GPT4o-mini, weight 2.0)
  #   Tier-2:       merged HC/HT+MDT/TTS into single block grouped by locale
  #   Total:        6026k -> 6854k hours (weighted, after sample_ratio)

  # ASR Data Details (computed by compute_data_hours.py):
  # Tier-1 (weighted):
  #   EN+DE:              1835k * 1.0 = 1835k
  #   Ghost:              1.7k  * 2.0 = 3k
  #   FR+IT+ES+PT:        711k  * 1.4 = 995k
  #   CJK+AR:             1557k * 1.0 = 1557k  (ar_tts_domain_clean 130k uses sample_ratio=0.5, -65k)
  #   Podcast Fast S2S:   725k  * 1.5 = 1088k
  #   Podcast GPT4o-mini: 59k   * 2.0 = 118k
  #   TTS domain:         1815k * 0.01 = 18k
  #   Subtotal:           5614k  (after sample_ratio: ~5548k)
  # Tier-2 (weight 1.0):
  #   Raw: 1307k  (svse_ht 21.9k*0.5=-11k, thth_tts 40.5k*0.1=-36k => effective ~1260k)
  # Indian (hi-IN x2): 46k
  # Total: 5548k + 1260k + 46k = ~6854k hours

  ################################# EN + DE ####################################################
  - sample_profiles:
      asr_en_core:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_human_caption_adjusted
            filter_tagging_failure_data: false
          
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50
          illegal_char_filter: true
        
        text_normalization:
          unicode_normalize: false
          tn_rule_file: /datablob1/users/ruchaofan/tn/filter_disfluency_tags_and_nsnoise.txt
        
      asr_en_domain:
        filter_options:   
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1

      asr_de_core:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_human_caption_adjusted
            filter_tagging_failure_data: false
          
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50

        text_normalization:
          unicode_normalize: false
          tn_rule_file: /datablob1/users/ruchaofan/tn/filter_disfluency_tags_de_V3.txt

    dataset_spec: 
      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/en/en_asr_hc.json                       # 618199.92 hours
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/en/en_asr_hc_fy24_400k.json             # 389955.90 hours
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/en/en_asr_hc_fy24_200k.json             # 237132.46 hours
        sample_profile: asr_en_core
        sample_ratio: 0.135

      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605_s2_sampled/en/en_asr_ht.json                       # 11785.70 hours, number of examples: 8.596M, average duration: 4.94s
        sample_profile: asr_en_core
      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2505_readable/en/en_asr_digit_tts.json                # 379.59 hours
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2505_readable/en/en_asr_entity.json                   # 7505.86 hours
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2505_readable/en/en_asr_global_dictionary.json        # 266.62 hours
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2505_readable/en/en_asr_medical_tts_new.json          # 9353.46 hours
        sample_profile: asr_en_domain
      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605_s2_sampled/de/de_hc.json                 # 2579.00 hours, number of examples: 0.363M, average duration: 25.61s
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605_s2_sampled/de/de_ht_gpt.json             # 21637.14 hours, number of examples: 13.699M, average duration: 5.69s
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605_s2_sampled/de/de_tts_domain.json         # 6009.58 hours, number of examples: 2.543M, average duration: 8.51s
        sample_profile: asr_de_core
    transform_cls:
      name: AudioTextConversationTransform
      conv_template: ${conv_template}
      prompt_formatter: ${prompt_formatter}
      fixed_prompt: False
      batch_format: "samples_to_batch"    # "samples_to_sequence", "samples_to_batch"

    use_num_examples_as_durations: True
    use_storage_api: ${use_storage_api}
    multi_threaded_download: ${multi_threaded_download}
    prefetch_queue_size: ${prefetch_queue_size}
    compression_rate: ${compression_rate}
    qformer_compression_rate: ${downsample_rate}
    seq_len: ${seq_len}
    batcher_buffer_size: ${large_batcher_buffer_size}
    batcher_criterion: "utterance"
    batcher_batch_size: ${batcher_batch_size_asr}
    num_chunks_for_shuffling: ${large_num_chunks_for_shuffling}
    weight: 1.0
    tokenizer: ${tokenizer}
    audio_processor: ${data_audio_processor}
    pad_to_context_length: ${pad_to_context_length} 
    dataset_provider: blob_chunk_alm 
  
  # Total Training Audio Text Pairs: 671521, Total Duration: 1681.6831916666672 hours
  - dataset_spec: 
      - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/en/en_asr_ghost_words.json   # 1681.68 hours

    filter_options:   
      max_utterance_frames: 4000
      min_utterance_frames: 0
      max_utterance_labels: 200
      min_utterance_labels: 0

    transform_cls:
      name: AudioTextConversationTransform
      conv_template: ${conv_template}
      prompt_formatter: ${ghost_words_prompt_formatter}
      fixed_prompt: False
      batch_format: "samples_to_batch"    # "samples_to_sequence", "samples_to_batch"

    use_num_examples_as_durations: True
    use_storage_api: ${use_storage_api}
    multi_threaded_download: ${multi_threaded_download}
    prefetch_queue_size: ${prefetch_queue_size}
    compression_rate: ${compression_rate}
    qformer_compression_rate: ${downsample_rate}
    seq_len: ${seq_len}
    batcher_buffer_size: ${batcher_buffer_size}
    batcher_criterion: "utterance"
    batcher_batch_size: ${batcher_batch_size_asr}
    num_chunks_for_shuffling: ${num_chunks_for_shuffling}
    weight: 2.0
    tokenizer: ${tokenizer}
    audio_processor: ${data_audio_processor}
    pad_to_context_length: ${pad_to_context_length} 
    dataset_provider: blob_chunk_alm 


  ################################# FR + IT + ES + PT with data weight 1.4 ####################################################
  # Total Training Audio Text Pairs: 381802106, Total Duration: 708999.6123138629 hours
  - sample_profiles:
      asr_fr_it_hc:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_human_caption_adjusted
            filter_tagging_failure_data: false
          
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50

        text_normalization:
          unicode_normalize: false
          tn_rule_file: /datablob1/users/ruchaofan/tn/hc_simple_tn_rules.txt
        
      asr_fr_gpt:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_GPT4o_from_dpp_fr-fr_DisfluencyRemoved
              - display_GPT4o_from_dpp_fr-ca_DisfluencyRemoved
              - display_dpp_fr-fr_DisfluencyRemoved
              - display_dpp_fr-ca_DisfluencyRemoved
            apply_gpt_dpp_fall_back_logic: true
            apply_gpt_dpp_fall_back_punctuation: "!\"#$%&'()*+,-./:;<=>?@[]^_`{|}~«»€"
            apply_gpt_dpp_fall_back_punctuation_to_remove: "LEADING_TRAILING"
            apply_gpt_dpp_fall_back_enable_gpt_fallback: true
            apply_gpt_dpp_fall_back_enable_alignment_err_fallback: False
            apply_gpt_dpp_fall_back_alignment_err_threshold: 20
          
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50

      asr_it_gpt:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_GPT4o_from_dpp_it-it_DisfluencyRemoved
              - display_dpp_it-it_DisfluencyRemoved
            apply_gpt_dpp_fall_back_logic: true
            apply_gpt_dpp_fall_back_punctuation: "!\"#$%&'()*+,-./:;<=>?@[]^_`{|}~«»€"
            apply_gpt_dpp_fall_back_punctuation_to_remove: "LEADING_TRAILING"
            apply_gpt_dpp_fall_back_enable_gpt_fallback: true
            apply_gpt_dpp_fall_back_enable_alignment_err_fallback: False
            apply_gpt_dpp_fall_back_alignment_err_threshold: 20
          
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50

      asr_es_core:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_dpp_es-mx_DisfluencyRemoved
              - display_human_caption_adjusted
            filter_tagging_failure_data: false
          
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50
          remove_utterance_by_punctuation_numbers:
            punctuation_list_file: /datablob1/users/v-lianlanxu/HC_es_Dispaly/Trans/es_punc_V1.txt
            threshold: 25

        text_normalization:
          unicode_normalize: false
          tn_rule_file: /datablob1/users/majin1/tn/filter_disfluency_tags_v6_fix.txt

      asr_es_gpt:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_GPT4o_from_dpp_es-mx_DisfluencyRemoved
              - display_dpp_es-mx_DisfluencyRemoved
            apply_gpt_dpp_fall_back_logic: true
            apply_gpt_dpp_fall_back_punctuation: "!\"#$%&'()*+,-./:;<=>?@[]^_`{|}~\xBF\
                        \xA1\xBA\xAA\xAB\xBB\u20AC"
            apply_gpt_dpp_fall_back_punctuation_to_remove: LEADING_TRAILING
            apply_gpt_dpp_fall_back_enable_gpt_fallback: true
            apply_gpt_dpp_fall_back_enable_alignment_err_fallback: false
            apply_gpt_dpp_fall_back_alignment_err_threshold: 20
          
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50

        text_normalization:
          unicode_normalize: false
          tn_rule_file: /datablob1/users/majin1/tn/filter_disfluency_tags_v6_fix.txt

      asr_pt_hc:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_human_caption_adjusted
            filter_tagging_failure_data: false
 
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 1000
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50
 
      asr_pt_ht_domain:
        filter_options:
          transcript_selector:
            transcription_keys:
              - display_GPT4o_from_dpp_pt_DisfluencyRemoved
            apply_gpt_dpp_fall_back_logic: false
 
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 1000
          min_utterance_labels: 1

    dataset_spec: 
      - file:
        - /datablob1/users/ruchaofan/DataSpecs/mlang_asr_data_2605/fr/fr_hc.json      # 29406.17 hours, number of examples: 4.128M, average duration: 25.65s
