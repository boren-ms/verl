            max_piece_len: 5
            max_num: ${bias_max_num}
            #   bias_prob: 0.6
            hit_prob: ${hit_prob}
            log_interval: 1000 # print biasing every 10000 samples
            new_sampling: True
            max_hit_ratio: ${max_hit_ratio}
          transcript_selector:
            transcription_keys:
              - display_trans_abbr_fix
