
# Estimated durations from raw-hour comments, before utterance filtering and audio cropping.
# Formula: raw hours * sample_ratio * top-level dataset weight; missing ratios/weights default to 1.0.
# Per-entry repetition ratio values are not applied; repeated manifest list items are counted separately.
#
# Effective duration by locale (hours * sample_ratio * weight, excl. code-switch & OSS):
#   en-US:       120,618.9 hours
#   zh-CN:        29,772.0 hours
#   ko-KR:        15,374.7 hours
#   de-DE:        15,095.7 hours
#   es:           15,085.2 hours
#   ja-JP:        15,070.3 hours
#   ar-SA:        15,053.6 hours
#   pt-BR:        15,008.6 hours
#   it-IT:        14,932.8 hours
#   fr-FR:        14,609.5 hours
#   zh-TW:         6,873.2 hours
#   hi-IN:         5,535.5 hours
#   he-IL:         5,420.6 hours
#   ru-RU:         5,041.0 hours
#   tr-TR:         5,035.7 hours
#   fi-FI:         5,035.5 hours
#   cs-CZ:         5,030.6 hours
#   nl-NL:         5,026.2 hours
#   th-TH:         5,023.4 hours
#   id-ID:         5,020.8 hours
#   sv-SE:         5,020.4 hours
#   el-GR:         5,020.2 hours
#   hu-HU:         5,019.0 hours
#   nb-NO:         5,003.1 hours
#   da-DK:         5,002.6 hours
#   pl-PL:         5,000.0 hours
#   vi-VN:         4,811.2 hours
#   bg-BG:         4,370.6 hours
#   fil-PH:        4,049.8 hours
#   lv-LV:         4,037.5 hours
#   ro-RO:         4,015.4 hours
#   fa-IR:         4,003.5 hours
#   ca-ES:         4,001.5 hours
#   et-EE:         4,001.1 hours
#   ms-MY:         4,000.5 hours
#   zh-HK:         3,998.4 hours
#   uk-UA:         3,965.1 hours
#   sk-SK:         3,839.5 hours
#   te-IN:         3,800.2 hours
#   sl-SI:         3,656.1 hours
#   gu-IN:         2,914.9 hours
#   ml-IN:         2,733.8 hours
#   ta-IN:         2,694.3 hours
#   cy-GB:         2,665.6 hours
#   mr-IN:         2,365.1 hours
#   multi-9:       2,009.2 hours
#   or-IN:         1,914.8 hours
#   as-IN:         1,798.1 hours
#   ur-IN:         1,557.8 hours
#   bn-IN:         1,540.2 hours
#   pa-IN:         1,488.3 hours
#   hr-HR:         1,341.2 hours
#   kn-IN:         1,313.7 hours
#   lt-LT:         1,093.3 hours
#   yue-CN:          806.4 hours
#   fr-CA:           500.7 hours
#   Total:       439,017.0 hours
#
# Known effective duration by top-level dataset block (including code-switch & OSS):
#   EN + DE (with biasing):                                      37,687.25 hours
#   Ghost words (x5 weight):                                      8,408.40 hours
#   EN verbatim (with biasing):                                  50,046.94 hours
#   FR + IT + ES + PT (with biasing):                            20,789.92 hours
#   CJK + AR (incl. embedded code-switch):                       55,110.49 hours
#   Podcast Fast S2S (with biasing):                             10,411.86 hours
#   Podcast GPT4o-mini (with biasing):                            5,417.31 hours
#   TTS domain ASR (with biasing):                               10,185.63 hours
#   Tier-2 + expansion non-lexical (incl. CY/ET & Polish OSS):    65,649.33 hours
#   Indian expansion (with biasing):                             29,130.89 hours
#   Tier-2 + expansion lexical HT/MDT (incl. CY/ET):             48,223.22 hours
#   Human annotation expansion (incl. EN-IN):                     6,966.18 hours
#   HC releases 2026-09-13 + 2026-09-29:                         91,328.79 hours
#   Dedicated code-switch:                                      10,682.41 hours
#   OSS lexical (MLS/GigaSpeech/AAA):                            14,018.55 hours
#   OSS display (CV15/FLEURS/IndicVoices):                         9,270.32 hours
#   OSS AMI/refined earnings/CHiME6:                              5,902.33 hours
#   OSS earnings:                                                  287.16 hours
#   OSS AA + HT earnings verbatim:                               1,059.69 hours
#   OSS WavLLM lexical:                                          3,772.18 hours
#   OSS 3com + Quartr earnings:                                    unknown (7 manifest occurrences)
#   Known total across all blocks:                             484,348.84 hours
# Notes:
#   - English and Arabic locale buckets include EN-IN and AR-BH human annotations, respectively.
#   - Filipino (fil-PH) annotations are counted separately from Finnish (fi-FI).
#   - CY/ET data is merged into the shared lexical/non-lexical blocks; both ET HT ratios are 0.31758.
#   - Locale totals exclude all dedicated and embedded code-switch and open-source training manifests.
#   - The CJK block includes 165.71 code-switch hours; the non-lexical Tier-2 block includes 173.46 OSS hours.
#   - OSS accounting includes the FLEURS/IndicVoices manifests stored outside the /oss/ directory.
#   - The multi-9 manifest covers de/en/es/fr/it/ja/ko/pt/zh; no per-locale split is available.
#   - EN-IN uses 499.95 hours documented for the same path in data-v3.5.4-ha-s2.yaml.
#   - Each AMI occurrence uses the existing 156.33-hour estimate; its manifest has no inline duration.
#   - Where comments contain an arrow, the first raw-hour value is used, not the alternative total.
#   - Unknown hours: asr_chunk_openasr_earnings_3com_ht_display.json (x3),
#     asr_chunk_openasr_earnings_3com_ht_batch2_display.json (x3), and asr_chunk_openasr_earnings_Quartr.json.
#     These are excluded from the known subtotal; the complete dataset duration is not available.
#   - Applying ratio: 4 for repeating-digit TTS adds 6,027.71 hours to the convention used above.
#   - Totals are summed before rounding; individually rounded rows may not sum exactly.
#
# Locale total excluding code-switch and OSS:     439,017.04 hours
# Code-switch effective duration:                  10,848.11 hours
# Known open-source effective duration:             34,483.69 hours
# Known total including code-switch and OSS:       484,348.84 hours
# Known total also applying repetition ratios:     490,376.54 hours

data_audio_processor:
  name: "cascades"

seq_len: 16384 # 10240 #7168
compression_rate: 8    # in   speech encoder
downsample_rate: 1     # after speech encoder qformer / linear ds
audio_frame_crop_prob: 0.1  # 0.1 cuts 10% of utterances; 0 disables
use_storage_api: True
multi_threaded_download: True   # set true for h200 cluster
prefetch_queue_size: 16  # Host-RAM mitigation: fewer prefetched batches per dataset provider.
conv_template: qwen3_audio_nothink_instruct # qwen3_audio_instruct # mistral3_audio_instruct # phi_o_long
prompt_formatter: asr-lid
prompt_formatter_lexical: asr-lid-lexical
instruction_first: True
tts_domain_data_weight: 0.04
OSS_data_weight: 1.0
padding_mask: True   # True for qwen3.5

batcher_buffer_size: 500
medium_batcher_buffer_size: 2000
large_batcher_buffer_size: 4000
num_chunks_for_shuffling: 3
medium_num_chunks_for_shuffling: 5
large_num_chunks_for_shuffling: 10

bias_max_num: 4000
max_hit_ratio: 0.3
hit_prob: 0.3
codeswitch_data_weight: 0.04

ghost_words_prompt_formatter: asr-lid-ghost

tokenizer:
  pretrained_model_name_or_path: /datablob1/users/ruchaofan/Phi-omni-checkpoints/language_ckpt/Qwen3.5-9B/

pad_to_context_length: False

dataset:

  
  ################################# EN + DE ####################################################
  - sample_profiles:
      asr_en_core:
        filter_options:
          mix_normal_sr: 0.94
          biasing:
            buffer_size: 10000
            max_piece_len: 5
            max_num: ${bias_max_num}
            #   bias_prob: 0.6
            hit_prob: ${hit_prob}
            log_interval: 1000 # print biasing every 10000 samples
            new_sampling: True
            max_hit_ratio: ${max_hit_ratio}
          transcript_selector:
            transcription_keys:
              - display_human_caption_adjusted
            filter_tagging_failure_data: false

          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1
          remove_utterance_by_wer: true
          max_wer: 0.50
          illegal_char_filter: true

        text_normalization:
          unicode_normalize: false
          tn_rule_file: /datablob1/users/ruchaofan/tn/filter_disfluency_tags_and_nsnoise.txt

      asr_en_domain:
        filter_options:
          mix_normal_sr: 0.94
          biasing:
            buffer_size: 10000
            max_piece_len: 5
            max_num: ${bias_max_num}
            #   bias_prob: 0.6
            hit_prob: ${hit_prob}
            log_interval: 1000 # print biasing every 10000 samples
            new_sampling: True
            max_hit_ratio: ${max_hit_ratio}
          max_utterance_frames: 4000
          min_utterance_frames: 0
          max_utterance_labels: 800
          min_utterance_labels: 1

      asr_illinois_display:
        filter_options:
          mix_normal_sr: 0.94
          biasing:
