  - dataset_spec:
      - file:
        - /datablob1/users/v-wanhu/TaskForRui/Word_ratio/Json_sample/users/ruchaofan/DataSpecs/mlang_asr_data_2605/en/en_asr_ghost_words.json   #1681.68h
        
