        type: CustomNoamDecayLR
        config:
            warmup_steps: 2560000
            decay_type: linear
            decay_from: 1
            total_step: 5440000
            base_value: 888
            peak_lr: 5.0e-05
trainer:
    type: BaseTrainer
    config:
        log_interval: 10000
        checkpoint_interval: 272000
        validation_interval: 100000
        nan_loss_patience: 2
        grad_acc_step: 1
criteria:
    loss:
        type: CombinedLoss
        config:
            loss_weights: [0.8, 0.1, 0.2]
            weights_norm: false
            loss_configs:
            -   type: LabelSmoothingLoss
                config:
                    ignore_index: -1
                    label_smooth: 0.1
                    normalize_loss_by_frame: false
            -   type: LabelSmoothingLoss
                config:
                    ignore_index: -1
                    label_smooth: 0.1
                    normalize_loss_by_frame: false
                    suffix: _filler
            -   type: CTCLoss
                config:
                    ctc_type: builtin
                    suffix: _1
distributed:
    type: hit
    config:
        backend: nccl
        topology_type: sharded_pyramid
        disable_speed_test: true
        autosp:
            enabled: true
        layers:
        -   type: deepspeed
            sync_factor: 1
        -   type: auto
            use_params_in_pg: bit16
            momentum: 0.6
            sync_factor: 16
        deepspeed:
            gradient_clipping: 0.01
            train_micro_batch_size_per_gpu: 1
            steps_per_print: 100
            zero_allow_untested_optimizer: true
            fp16:
                enabled: true
                loss_scale: 0
                loss_scale_window: 1000
                initial_scale_power: 16
                min_loss_scale: 1
            zero_optimization:
                stage: 1
                find_unused_parameters: true
                allgather_partitions: true
                allgather_bucket_size: 200000000.0
                overlap_comm: true
                reduce_scatter: true
                reduce_bucket_size: 200000000.0
                contiguous_gradients: true
