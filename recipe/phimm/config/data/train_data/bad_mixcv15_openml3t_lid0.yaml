# Bad-language + OpenML training data with ASR, verbatim, and lexical prompts.

- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/verl/gen_cached/mix_cv15_n1k_task3/bad_lang.jsonl
  add_task_info:
    task: lang_asr
    prefix_prob: 0.0
  post_process:
    cache_audio: {}
    shuffle:
      seed: 42
    add_field:
      fields:
        data_source: mix
    verl_format:
      prompt_key: prompt
