# @package data.train_data
# Entity-only variant of entity_en_ht_v1_cer_egs: keeps samples with >=1 entity
# keyword. Mirrors the source spec in
# recipe/phimm/config/data/cache/entity_en_ht_v1_cer_egs_entity_only.yaml.
- dataset_name: jsonl
  jsonl_paths:
    - az://orngwus2cresco/data/boren/data/audio_trans_filter_cer05_entity/inhouse/mlang_asr_data_2025_readable/en/en_asr_ht/short_form_fix_16k/r8/Engineer_Telephony_8kHz/samples/
  pre_process:
    extract_chat:
      metadata_key: metadata
    filter_by_keywords:
      min_num: 1
  add_task_info:
    task: lang_asr
  post_process:
    add_field:
      fields:
        data_source: entity_en_ht_v1_cer_egs_entity_only
    verl_format:
      prompt_key: prompt
