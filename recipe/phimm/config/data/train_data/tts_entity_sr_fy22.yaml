-  dataset_name: audio_dir
   data_dir: ${oc.env:DATA_PATH}/users/boren/data/inhouse/GeneratedAudio/Entity/AudioEntityV1 # shorter
   cache_name: auto_train
   num_proc: auto
   add_prompt:
     task: rare_asr
     forced: True
   post_process:
     add_field:
       fields:
         data_source: asr
     verl_format:
       prompt_key: prompt
-  dataset_name: parquet
   parquet_paths: ${oc.env:DATA_PATH}/users/boren/data/cache_datasets/gen_prod_fy22_phi4_7b_wer_20/part-*.parquet
   num_proc: auto
   cache_name: auto_train
   pre_process:
     filter_by_wer:
       wer_range: [0.0, 0.2] # filter WER between 0.0% and 20%
     path_map:
       field: audio_chunk
       src_part: "az://orngwus2cresco/data"
       dst_part: "${oc.env:DATA_PATH}"
   add_prompt:
     task: rare_asr
     forced: True
   post_process:
     add_field:
       fields:
         data_source: asr
     verl_format:
       prompt_key: prompt
