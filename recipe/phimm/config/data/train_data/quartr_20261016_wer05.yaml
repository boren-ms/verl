# @package data.train_data
# Quartr reviewed data with wer_maiears <= 5%: 9,893 segments, approximately 82.02 hours.
dataset_name: jsonl
jsonl_paths: az://orngwus2cresco/data/speech/users/xiaoych/quartr_earliest2_reviewed_bitbank_20261016/data_zip.jsonl.gz
cache_name: auto_quartr_20261016_wer05_verb_langhint_zip
pre_process:
  rename_fields:
    mappings:
      wer: wer_maiears
add_task_info:
  task: lang_asr_verb
  language: English
  prefix_prob: 0.0
  lang_hint: true
post_process:
  filter_by_wer:
    wer_range: [0.0, 0.05]
  add_field:
    fields:
      data_source: quartr_20261016
  verl_format:
    prompt_key: prompt
