# FY27 batches 1/2 with the 2026-10-21 Display_NE_Tags_Wrapped transcriptions.
# clean_tagged_text strips tags and extracts ordered, unique NE/PName keywords.
# Keep angle brackets until this step: remove_brackets would destroy the tags.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/EarningsCall_2026_conversion_svad/earningscall-fy27-en-us-batch1_ne_tagged_20261021.jsonl
  pre_process:
    path_map:
      field: audio_path
      src_part: "audios/"
      dst_part: "az://orngwus2cresco/data/speech/EarningsCall_2026_conversion_svad/"
    rename_fields:
      mappings:
        text: display_ne_tagged
    clean_tagged_text: {}
  add_task_info:
    task: lang_asr_verb
    language: English
    prefix_prob: 0.0
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: earnings_fy27
    verl_format:
      prompt_key: prompt

