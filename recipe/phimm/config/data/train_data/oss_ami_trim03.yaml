  - az://orngwus2cresco/data/speech/users/ruchaofan/DataSpecs/mlang_asr_data_2605/oss/asr_chunk_openasr_ami.json
chunk_types:
  - audios
  - sft.0.messages.1.content
num_proc: auto
cache_name: auto_train
pre_process:
