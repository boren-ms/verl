# Training data: mixed-language cv15 + OpenML edge cases (4x) in verbatim (lang_asr_verb) mode.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/verl/mix_lang/mix_cv15_all/mixed_22_100.jsonl
  add_task_info:
    task: lang_asr
    prefix_prob: 0.0
  post_process:
    add_field:
      fields:
        data_source: mix_cv15_all
    shuffle:
      seed: 42
    verl_format:
      prompt_key: prompt
