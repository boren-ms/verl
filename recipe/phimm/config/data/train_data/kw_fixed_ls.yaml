# LibriSpeech filtered to samples containing keywords fixed by bias prompting.

- dataset_name: tsv
  tsv_paths: az://orngwus2cresco/data/boren/data/LibriSpeech/asr_train_transcribe.tsv
  add_rare_keywords:
    rare_file: az://orngwus2cresco/data/boren/data/librispeech_biasing/ref/ls_kw_fixed_list.txt
    rare_ratio: 1.0
  add_task_info:
    task: lang_asr
  pre_process:
    shuffle:
      seed: 42
  post_process:
    filter_by_keywords:
      min_num: 1
    add_field:
      fields:
        data_source: kw_fixed
    verl_format:
      prompt_key: prompt