# Verb-only earnings-call ASR data v1: FY27 en-US Batches 1 and 2 plus clean Polyus 2022-2026 TTS
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/EarningsCall_2026_conversion_svad/earningscall-fy27-en-us-batch1.jsonl
  pre_process:
    path_map:
      field: audio_path
      src_part: "audios/"
      dst_part: "az://orngwus2cresco/data/speech/EarningsCall_2026_conversion_svad/"
    rename_fields:
      mappings:
        text: display
    clean_tagged_text: {}
  add_task_info:
    task: lang_asr_verb
    language: English
    prefix_prob: 0.0
  post_process:
    add_field:
      fields:
        data_source: earning_fy27_verb
    verl_format:
      prompt_key: prompt

