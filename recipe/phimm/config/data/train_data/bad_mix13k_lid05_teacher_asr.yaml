# 13k bad-language examples with 50% LID student prompts and a keyword-biased teacher prompt.

- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/verl/gen_cached/mix_cv15_n1k_task3/bad_lang.jsonl
  add_task_info:
    task: lang_asr
    prefix_prob: 0.5
  add_teacher:
    task: lang_asr
    biasing: true
  pre_process:
    shuffle:
      seed: 42
  post_process:
    input_egs_limit: 13000
    cache_audio: {}
    add_field:
      fields:
        data_source: mix
    verl_format:
      prompt_key: prompt
