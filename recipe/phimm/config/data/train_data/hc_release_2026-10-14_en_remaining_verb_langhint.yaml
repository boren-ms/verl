# Remaining English Human Caption chunks, intentionally separate from the
# deterministic ~10,000-hour subset used by the first generation run.
- dataset_name: chunk
  specs:
    - manifest_file: az://orngwus2cresco/data/speech/am_data/human_caption/hc_release_2026-10-14_remaining/en/file_set.json
      chunk_path: az://orngwus2cresco/data/speech/am_data/human_caption/hc_release_2026-10-14_remaining/en/chunks/
  chunk_types:
    - audio
    - transcription
  num_proc: auto
  add_task_info:
    task: lang_asr_verb
    language: English
    prefix_prob: 0.0
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: hc_release_20261014_en_remaining
    verl_format:
      prompt_key: prompt
