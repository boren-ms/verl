# @package data.train_data
# Multilingual datasets missing from noen.yaml
# fleurs includes en alongside other langs; tier2 datasets are non-English only

- dataset_name: chunk
  specs:
    - az://orngwus2cresco/data/speech/users/ruchaofan/DataSpecs/mlang_asr_data_2605/oss/asr_chunk_cv15_tier2.json          # 603.61 hours, number of examples: 0.486M, average duration: 4.47s  (ar,cs,da,fi,he,hi,hu,ko,nl,pl,ru,sv,th,tr)
  chunk_types:
    - audios
    - sft.0.messages.1.content
  num_proc: auto
  pre_process:
    rename_fields:
      mappings:
        text: sft.0.messages.1.content
  add_task_info:
    task: lang_asr
    forced: True
  post_process:
    verl_format:
      prompt_key: prompt

