# @package data.train_data
# Source gap only: 3,354,993 samples; existing source chunks excluded.
- dataset_name: chunk
  specs:
  - manifest_file: az://orngwus2cresco/data/boren/data/oss_missing_from_moe_20261112/manifests/indicvoices_non_hi_missing_as.json
    chunk_path: az://orngwus2cresco/data/speech/users/ruchaofan/phi3_asr_data/IndicVoices/as_verbatim_c96f9088/chunks
    language: Assamese
    trans_path: az://orngwus2cresco/data/speech/users/ruchaofan/phi3_asr_data/IndicVoices/as_verbatim_c96f9088/chunks
  chunk_types:
  - audios
  - sft.0.messages.1.content
  num_proc: auto
  pre_process:
    rename_fields:
      mappings:
        text: sft.0.messages.1.content
  add_task_info:
    task: lang_asr_verb
    prefix_prob: 0.0
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: asr
        source_family: IndicVoices
        source_language: as
    verl_format:
      prompt_key: prompt
      extra_keys:
      - source_family
      - source_language
