    chunk_path: az://orngwus2cresco/data/speech/am_data/publicdataset_process/WenetSpeech/Chunk/train/Chunkfiles
    language: Chinese
    trans_path: az://orngwus2cresco/data/speech/am_data/publicdataset_process/WenetSpeech/Chunk/train/Chunkfiles
  chunk_types:
  - audio
  - transcription
  num_proc: auto
  add_task_info:
    task: lang_asr
    prefix_prob: 0.0
