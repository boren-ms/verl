# 11,000 English-hint foreign examples (1,000 per language) plus 10,000 mixed-language pairs.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/users/boren/foreign_language_1k_09e24427354c1064/train_1k.jsonl
  mask_foreign_language: {}
  add_task_info:
    task: lang_asr_verb
    language: English
    prefix_prob: 0.0
    lang_hint: true
  post_process:
    verl_format:
      prompt_key: prompt
      extra_keys: [source_language, source_corpus, source_split]

# The mixed targets already contain <foreign_language> in the correct position.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/users/boren/foreign_language_mixed_10k_5bf59b28a713b14b/mixed_noen_en_10k.jsonl
  add_task_info:
    task: lang_asr_verb
    language: English
    prefix_prob: 0.0
    lang_hint: true
  post_process:
    verl_format:
      prompt_key: prompt
      extra_keys: [source_language, source_corpus, source_split]
