# Original FY27 batch 1/2 transcriptions, without Polyus TTS.
# Match the NE-tagged comparison's processing, task, and datasource settings.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/EarningsCall_2026_conversion_svad/earningscall-fy27-en-us-batch1.jsonl
  pre_process:
    path_map:
      field: audio_path
      src_part: "audios/"
      dst_part: "az://orngwus2cresco/data/speech/EarningsCall_2026_conversion_svad/"
    rename_fields:
      mappings:
        text: display
    clean_tagged_text: {}
  add_task_info:
    task: lang_asr_verb
    language: English
    prefix_prob: 0.0
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: earnings_fy27
    verl_format:
      prompt_key: prompt

