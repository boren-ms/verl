# Strip paired bracket characters from text, preserving enclosed words.
# Preprocess before add_task_info so generated references use cleaned text.
- dataset_name: jsonl
  jsonl_paths:
    - az://orngwus2cresco/data/boren/data/verl/cached_qwen/qwen_oss_brackets/all_wav.jsonl
    - az://orngwus2cresco/data/boren/data/verl/cached_qwen/qwen_oss_reps/all_wav.jsonl
  pre_process:
    remove_brackets: {}
  add_task_info:
    task: lang_asr_verb
    prefix_prob: 0.0
    lang_hint: true
  post_process:
    cache_audio: {}
    add_field:
      fields:
        data_source: openml
    shuffle:
      seed: 44
    verl_format:
      prompt_key: prompt
