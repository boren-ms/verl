    remove_brackets: {}
    path_map:
      field: audio_path
      src_part: "am_data/"
      dst_part: "az://orngwus2cresco/data/speech/am_data/"
  add_task_info:
    task: lang_asr_verb
    language: English
    prefix_prob: 0.0
    lang_hint: true
  post_process:
