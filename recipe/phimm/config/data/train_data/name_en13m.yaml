# Deduplicated by exact (id, transcription), keeping the first record.
# Strip paired bracket characters before generating references, preserving enclosed words.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/am_data/en/data_prep_e2e_R15/human_caption_v2/name_filtering/dedup_20261016_183641/all_gpt_tagged_person.train.dedup.jsonl
