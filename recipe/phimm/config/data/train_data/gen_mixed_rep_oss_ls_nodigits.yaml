# Mixed training data: rep_oss + ls_raw_rp_edge_nodigits
# rep_oss (jsonl)
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/verl/gen_cached/rep_oss/data.jsonl
  add_task_info:
    task: lang_asr
  post_process:
    filter_text_with_numbers:
      text_norm: english
    add_field:
      fields:
        data_source: asr
    verl_format:
      prompt_key: prompt

# ls_raw_rp_edge_nodigits (parquet)
- dataset_name: parquet
  parquet_paths: az://orngwus2cresco/data/boren/data/verl/gen_filtered/ls_raw_rp_edge/part-*.parquet
  add_task_info:
    task: lang_asr
  post_process:
    filter_text_with_numbers:
      text_norm: english
    add_field:
      fields:
        data_source: asr
    verl_format:
      prompt_key: prompt
