# Training data: mixed-language cv15, en-US digits, and verbatim OpenML edge cases (2x).
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/verl/mix_lang/mix_cv15_all/mixed_22_100.jsonl
  add_task_info:
    task: lang_asr
  post_process:
    cache_audio: {}
    add_field:
      fields:
        data_source: mix_cv15_all
    shuffle:
      seed: 42
    verl_format:
      prompt_key: prompt
- dataset_name: jsonl
  jsonl_paths:
    - az://orngwus2cresco/data/boren/data/verl/cached/enus_digits_chunk_100/repeat_audio_path.jsonl
    - az://orngwus2cresco/data/boren/data/verl/cached/enus_digits_chunk_100/random_audio_path.jsonl
  cache_name: enus_digits_chunk_100
  add_task_info:
    task: lang_asr
  post_process:
    cache_audio: {}
    add_field:
      fields:
        data_source: enus_digits_chunk_100
    shuffle:
      seed: 43
    verl_format:
      prompt_key: prompt
- dataset_name: jsonl
  jsonl_paths:
    - az://orngwus2cresco/data/boren/data/verl/cached_qwen/qwen_oss_brackets/all_wav.jsonl
    - az://orngwus2cresco/data/boren/data/verl/cached_qwen/qwen_oss_reps/all_wav.jsonl
    - az://orngwus2cresco/data/boren/data/verl/cached_qwen/qwen_oss_brackets/all_wav.jsonl
    - az://orngwus2cresco/data/boren/data/verl/cached_qwen/qwen_oss_reps/all_wav.jsonl
  add_task_info:
    task: lang_asr_verb
  post_process:
    cache_audio: {}
    add_field:
      fields:
        data_source: openml
    shuffle:
      seed: 44
