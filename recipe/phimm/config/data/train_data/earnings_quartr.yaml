# @package data.train_data
# Quartr English verbatim data: 16,069 samples, 81 chunks, 140.52 hours.
dataset_name: chunk
specs:
  - manifest_file: az://orngwus2cresco/data/speech/am_data/en/quartr_valid/file_set.json
    chunk_path: az://orngwus2cresco/data/speech/am_data/en/quartr_valid/chunks/
chunk_types:
  - audio
  - transcription
num_proc: auto
add_task_info:
  task: lang_asr_verb
  language: English
  prefix_prob: 0.0
post_process:
  add_field:
    fields:
      data_source: quartr_verb
  verl_format:
    prompt_key: prompt