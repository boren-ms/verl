# GPT-tagged earnings-call ASR verbatim and lexical training data with random 0-1s edge cuts
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/EarningsCall_2026_conversion_svad/earningscall-fy27-en-us-batch1_gpt_tagged.jsonl
  pre_process:
    path_map:
      field: audio_path
      src_part: "audios/"
      dst_part: "az://orngwus2cresco/data/speech/EarningsCall_2026_conversion_svad/"
    rename_fields:
      mappings:
        text: display
    clean_tagged_text: {}
    random_edge_audio_cut:
      head_cut: [0, 1]
      tail_cut: [0, 1]
  add_task_info:
    task: lang_asr_verb
    language: English
    prefix_prob: 0.0
  post_process:
    add_field:
      fields:
        data_source: earning_fy27_verb
    verl_format:
      prompt_key: prompt

