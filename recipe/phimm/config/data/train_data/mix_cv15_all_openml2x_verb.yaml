# OpenML 2x training data: 72,538 effective rows total.
#   mix_cv15_all: 46,200 (63.7%)
#   openml: 13,169 unique x2 = 26,338 effective (36.3%)

- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/verl/mix_lang/mix_cv15_all/mixed_22_100.jsonl
  add_task_info:
    task: lang_asr
    prefix_prob: 0.0
  post_process:
    cache_audio: {}
    add_field:
      fields:
        data_source: mix_cv15_all
    shuffle:
      seed: 42
    verl_format:
      prompt_key: prompt
- dataset_name: jsonl
  jsonl_paths:
    - az://orngwus2cresco/data/boren/data/verl/cached_qwen/qwen_oss_brackets/all_wav.jsonl
    - az://orngwus2cresco/data/boren/data/verl/cached_qwen/qwen_oss_reps/all_wav.jsonl
    - az://orngwus2cresco/data/boren/data/verl/cached_qwen/qwen_oss_brackets/all_wav.jsonl
    - az://orngwus2cresco/data/boren/data/verl/cached_qwen/qwen_oss_reps/all_wav.jsonl
  add_task_info:
    task: lang_asr_verb
  post_process:
    cache_audio: {}
    add_field:
      fields:
        data_source: openml
    shuffle:
      seed: 44
    verl_format:
      prompt_key: prompt