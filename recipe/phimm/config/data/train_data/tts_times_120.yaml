# Synthetic ASR dataset generated with Azure Text to Speech
dataset_name: jsonl
jsonl_paths: az://orngwus2cresco/data/boren/data/tts/tts_times_120/tts_times_120.jsonl
pre_process:
  path_map:
    field: audio_path
    src_part: "audios/"
    dst_part: "az://orngwus2cresco/data/boren/data/tts/tts_times_120/audios/"
add_task_info:
  task: lang_asr
  prefix_prob: 0.0
post_process:
  add_field:
    fields:
      data_source: tts_times_120
  verl_format:
    prompt_key: prompt