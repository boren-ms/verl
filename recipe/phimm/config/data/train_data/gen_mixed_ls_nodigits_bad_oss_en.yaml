# Mixed training data: LibriSpeech-raw-nodigits + bad_oss_en
# ls_raw_rp_edge_nodigits (parquet)
- dataset_name: parquet
  parquet_paths: az://orngwus2cresco/data/boren/data/verl/gen_filtered/ls_raw_rp_edge/part-*.parquet
  add_prompt:
    task: lang_asr_lex
    forced: True
  post_process:
    filter_text_with_numbers:
      text_norm: english
    add_field:
      fields:
        data_source: asr
    verl_format:
      prompt_key: prompt

# bad_oss_en_rp_edge (jsonl)
- dataset_name: jsonl
  jsonl_paths: 
    - az://orngwus2cresco/data/boren/data/verl/gen_cached/bad_oss_en_rp_edge/data.jsonl
    - az://orngwus2cresco/data/boren/data/verl/gen_cached/bad_oss_en_rp_edge/data.jsonl
  add_prompt:
    task: lang_asr
    forced: True
  post_process:
    add_field:
      fields:
        data_source: asr
    verl_format:
      prompt_key: prompt
