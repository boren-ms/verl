# LibriSpeech filtered to samples containing keywords fixed by bias prompting.

- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/verl/cached/ls_ts_kw_fixed/data.jsonl
  add_task_info:
    task: lang_asr
  add_teacher:
    task: lang_asr
    biasing: true
  pre_process:
    shuffle:
      seed: 42
  post_process:
    add_field:
      fields:
        data_source: ls_ts_rare
    verl_format:
      prompt_key: prompt