dataset_name: parquet
parquet_paths: az://orngwus2cresco/data/boren/data/LibriSpeechTrim03/dataset.parquet
num_proc: auto
cache_name: auto_train
pre_process:
  filter_short_audio:
    min_dur_ms: 300
    field: audio_file
  path_map:
    field: audio_file
    src_part: "az://orngwus2cresco/data"
    dst_part: "${oc.env:DATA_PATH}"
  rename_fields:
    mappings:
      audio_path: audio_file
add_prompt:
  task: lang_asr_lex
  forced: True
post_process:
  add_field:
    fields:
      data_source: asr
  verl_format:
    prompt_key: prompt
