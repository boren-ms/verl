# All country splits for the common English personal names TTS dataset.
- nickname: common-english-personal-names-bi
  dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/tts/common-english-personal-names-bi/common-english-personal-names-bi.jsonl
  pre_process:
    path_map: {field: audio_path, src_part: "audios/", dst_part: "az://orngwus2cresco/data/boren/data/tts/common-english-personal-names-bi/audios/"}
  add_task_info: {task: lang_asr, prefix_prob: 0.0}
  post_process:
    add_field: {fields: {data_source: common-english-personal-names-bi}}
    verl_format: {prompt_key: prompt}
