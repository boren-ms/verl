hydra:
  searchpath:
    - file://recipe/phimm/config/base
    - file://verl/trainer/config

# --- Mix selection: auto-generate ordered four-language mixes with distinct adjacent languages ---
languages: en,de,es,fr,it,ja,pt,zh,ar,cs,da,fi,he,hi,hu,ko,nl,pl,ru,sv,th,tr
mix_size: 4

# --- Sampling ---
num_per_type: 100
seed: 1234
allow_reuse: true

# --- Parallelism: threads for audio load/mix/write. 1 = sequential, <=0 = all CPUs ---
num_workers: 8

# --- Source specs: explicit spec path (or list of paths) per language ---
specs:
  en: az://orngwus2cresco/data/speech/users/ruchaofan/DataSpecs/mlang_asr_data_2605/oss/asr_chunk_cv15_en.json
  de: az://orngwus2cresco/data/speech/users/ruchaofan/DataSpecs/mlang_asr_data_2605/oss/asr_chunk_cv15_de.json
