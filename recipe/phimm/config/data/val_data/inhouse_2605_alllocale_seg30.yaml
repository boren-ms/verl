# Combined 30-second pre-segmented InhouseASR_2605 eval for ALL 25 locales:
# ar-SA, cs-CZ, da-DK, de-DE, en-GB, en-IN, en-US, es-ES, es-MX, fi-FI,
# fr-FR, hi-IN, hu-HU, id-ID, it-IT, ja-JP, ko-KR, nb-NO, nl-NL, pl-PL,
# pt-BR, ru-RU, sv-SE, tr-TR, zh-CN.
# All corpora are pre-segmented offline with SVAD (max_len_sec=30). Per-corpus aggregation is keyed
# on CorpusName -> data_source.

# ── arsa ──
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/InhouseASR_2605_seg_presegment_30s/ar-SA/Conversation_DTEST_FY24Q2_ar-SA_DTEST/test.jsonl
  pre_process:
    rename_fields:
      mappings:
        audio_path: WavPath
        text: DisplayTranscription
  add_task_info:
    task: lang_asr
    language: Arabic
  post_process:
    add_field:
      fields:
        data_source: arsa_conv_fy24q2
    verl_format:
      prompt_key: prompt
      extra_keys: ["id", "language", "audio_path", "parent_audio_path", "seg_start"]

