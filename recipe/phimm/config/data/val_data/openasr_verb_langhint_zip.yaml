- dataset_name: jsonl
  val_batch_size: -1
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/ArtificialAnalysis_seg_presegment_30s/VoxPopuli-Cleaned-AA/voxpopuli_cleaned_aa_v1_zip.jsonl
  cache_name: auto_voxpopuli_cleaned_aa_verb_langhint_zip
  pre_process:
    rename_fields:
      mappings:
        audio_path: url
        text: transcript
  add_task_info:
    task: lang_asr_verb
    language: English
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: voxpopuli_cleaned_aa
    verl_format:
      prompt_key: prompt
      extra_keys: ["id", "language", "audio_path", "parent_audio_path", "seg_index", "n_segments", "seg_start", "seg_end"]

