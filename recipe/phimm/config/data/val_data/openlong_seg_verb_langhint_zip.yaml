# ZIP-backed openlong_seg_zip.yaml with verbatim and known-language prompts.
# Prepare and publish ZIP manifests as documented in openlong_seg_zip.yaml.
# Audio fields use Bitbank audio.zip!offset:length#start:end references.
# Full parent references and grouping metadata are unchanged; val_batch_size=-1
# keeps each corpus's parent groups complete for grouped long-audio scoring.

- dataset_name: jsonl
  val_batch_size: -1
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/OpenASR_long_seg_presegment_30s/earnings21/test-*/data_zip.jsonl
  cache_name: auto_openlong_earnings21_seg_verb_langhint_zip
  add_task_info:
    task: lang_asr_verb
    language: English
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: earnings21
    verl_format:
      prompt_key: prompt
      extra_keys: ["id", "language", "audio_path", "parent_audio_path", "seg_index", "n_segments", "seg_start", "seg_end"]

