# Base1 validation: six sources use lang_only_verb; enhint_noen keeps lang_asr_verb.
# This data config is self-contained and does not depend on recipe-level aliases.

# All 184 segments of one Earnings22 parent, scored with its full-parent reference.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/users/boren/earnings22_parent4_segments_070c38d5706289cd/earnings22_parent4_segments.jsonl
  val_batch_size: -1
  add_task_info: &target_language_task
    task: lang_only_verb
    language: English
    prefix_prob: 0.0
    lang_hint: true
  post_process:
    add_field:
      fields: {data_source: earnings22_parent4}
    verl_format:
      prompt_key: prompt
      extra_keys: [source_id, parent_audio_path, seg_index, seg_start, seg_end, n_segments]

- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/users/boren/foreign_language_dataset_20261031T235227Z/manifests/english_hint_heldout_en_07abbf9009c5.jsonl
  mask_foreign_language: {}
  add_task_info: *target_language_task
  post_process:
    add_field:
      fields: {data_source: enhint_en}
    verl_format:
      prompt_key: prompt

- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/users/boren/foreign_language_dataset_20261031T235227Z/manifests/english_hint_heldout_noen_3e8509d3677e.jsonl
  mask_foreign_language: {}
  add_task_info: {task: lang_asr_verb, language: English, prefix_prob: 0.0, lang_hint: true}
  post_process:
    add_field:
      fields: {data_source: enhint_noen}
    verl_format:
      prompt_key: prompt

