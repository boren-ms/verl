# Auto-generated InhouseASR_2605 sv-SE D-test sets.
# One section per subdir test.jsonl; uses on-the-fly svad_explode.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/users/ruchaofan/Evaluation/InhouseASR_2605/sv-SE/Conversation_DTEST_FY23Q2_sv-SE_DTEST/test.jsonl
  pre_process:
    svad_explode:
      max_len_sec: 40.0
      audio_key: WavPath
      path_replace:
        /datablob1/: az://orngwus2cresco/data/speech/
    rename_fields:
      mappings:
        audio_path: WavPath
        text: DisplayTranscription
        data_source: CorpusName
  add_task_info:
    task: lang_asr
    language: Swedish
  post_process:
    verl_format:
      prompt_key: prompt
      extra_keys: ["id", "language", "audio_path", "parent_audio_path", "seg_start"]

