# Top 100 clips per corpus ranked by S+D+I word-error count, not WER.
# References are Qwen-aligned candidates, not human-verified ground truth.
# Empty normalized references are eligible: their insertions still count,
# and reference_word_count=0 means WER is undefined. Retain all QA flags.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/OpenLong_qwen_error_top100_2609r2b_step400_v1/earnings21.jsonl
  cache_name: auto_openlong_qwen_error_top100_2609r2b_earnings21_v1
  add_task_info: {task: lang_asr_verb, language: English, lang_hint: true}
  post_process:
    add_field: {fields: {data_source: earnings21}}
    verl_format:
      prompt_key: prompt
      extra_keys: ["baseline_hypothesis", "baseline_n_err", "baseline_n_ins", "baseline_n_del", "baseline_n_sub", "baseline_n_ref", "reference_word_count", "error_count_rank", "alignment_method", "alignment_status", "alignment_flags"]

