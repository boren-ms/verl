# OpenASR English evaluation suite from run_opensr_eval.sh (June 2026).
# AMI and GigaSpeech use >=1s manifests matching the openasr_clean task.

- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/openasr_jsonl/ls-clean/data.jsonl
  cache_name: auto_openasr_2606_ls_clean_verb
  pre_process:
    path_map:
      field: audio_path
      src_part: "audio/"
      dst_part: "az://orngwus2cresco/data/boren/data/openasr_jsonl/ls-clean/audio/"
  add_task_info:
    task: lang_asr_verb
    language: English
    prefix_prob: 1.0
  post_process:
    add_field:
      fields:
        data_source: ls_clean
    verl_format:
      prompt_key: prompt

