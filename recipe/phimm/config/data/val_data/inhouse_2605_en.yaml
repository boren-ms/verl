- dataset_name: jsonl
  # Segment-exploded inhouse 2605 (per [s e] marker → one row per segment).
  # WavPath already az:// form with time-range suffix "#start:end".
  # CorpusName -> data_source for per-corpus metric aggregation.
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/InhouseASR_2605_seg/en-US/*/*.jsonl
  pre_process:
    rename_fields:
      mappings:
        audio_path: WavPath
        text: DisplayTranscription
        data_source: CorpusName
  add_task_info:
    task: lang_asr
    language: English
  post_process:
    verl_format:
      prompt_key: prompt
      # audio_path carries the "<wav>#start:end" chunk spec — needed for
      # post-hoc per-parent aggregation (group segments by parent wav).
      extra_keys: ["id", "language", "keywords", "prefix", "audio_path"]
