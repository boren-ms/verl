- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/openasr_jsonl/ami/data.jsonl
  cache_name: auto_ami
  pre_process:
    path_map:
      field: audio_path
      src_part: "audio/"
      dst_part: "az://orngwus2cresco/data/boren/data/openasr_jsonl/ami/audio/"
  add_task_info:
    task: lang_asr_en
  post_process:
    add_field:
      fields:
        data_source: ami
    verl_format:
      prompt_key: prompt

