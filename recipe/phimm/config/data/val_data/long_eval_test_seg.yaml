# Pre-segmented variant of long_eval_test. The long meeting wav has already
# been chunked offline by recipe.phimm.data.long_audio_vad_explode (same SVAD
# logic as the on-the-fly svad_explode), so every row here is already one
# segment carrying WavPath#start:end plus seg_index / n_segments / seg_start /
# seg_end / parent_audio_path. No svad_explode pre_process is needed — we only
# rename the raw fields and emit the verl prompt. Post-eval aggregation
# (recipe.phimm.data.inhouse_2605_aggregate) still groups by parent_audio_path.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/long_audio_test_seg/sample_210d3d05.jsonl
  pre_process:
    rename_fields:
      mappings:
        audio_path: WavPath
        text: DisplayTranscription
        data_source: CorpusName
  add_task_info:
    task: lang_asr
    language: English
  post_process:
    verl_format:
      prompt_key: prompt
      extra_keys: ["id", "language", "keywords", "prefix", "audio_path", "parent_audio_path", "seg_index", "n_segments", "seg_start", "seg_end"]
