- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/openasr_jsonl/ami/bad_fmt_lang.jsonl
  cache_name: auto_ami_bad_fmt_lang
  pre_process:
    path_map:
      field: audio_path
      src_part: "audio/"
      dst_part: "az://orngwus2cresco/data/boren/data/openasr_jsonl/ami/audio/"
  add_prompt:
    task: lang_asr
    forced: True
  post_process:
    add_field:
      fields:
        data_source: ami_bad_fmt_lang
    verl_format:
      prompt_key: prompt

