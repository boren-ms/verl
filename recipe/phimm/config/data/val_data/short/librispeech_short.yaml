# Full LibriSpeech test-clean and test-other; metrics remain separate.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/LibriSpeech/short_2to5_v1/test-clean/data_flagged.jsonl
  add_task_info: {task: lang_asr_verb, language: English, prefix_prob: 0.0, lang_hint: true}
  post_process:
    add_field:
      fields: {data_source: ls_short_clean}
    verl_format: {prompt_key: prompt, extra_keys: [alignment_warnings]}
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/LibriSpeech/short_2to5_v1/test-other/data_flagged.jsonl
  add_task_info: {task: lang_asr_verb, language: English, prefix_prob: 0.0, lang_hint: true}
  post_process:
    add_field:
      fields: {data_source: ls_short_other}
    verl_format: {prompt_key: prompt, extra_keys: [alignment_warnings]}
