- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/openasr_jsonl/ls-clean/data.jsonl
  cache_name: auto_ls_clean
  pre_process:
    path_map:
      field: audio_path
      src_part: "audio/"
      dst_part: "az://orngwus2cresco/data/boren/data/openasr_jsonl/ls-clean/audio/"
  add_task_info:
    task: lang_asr_lex
  post_process:
    add_field:
      fields:
        data_source: ls_clean
    verl_format:
      prompt_key: prompt

