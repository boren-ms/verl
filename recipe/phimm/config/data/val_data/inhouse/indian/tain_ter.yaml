# @package data.val_data
# In-house ta-IN TER benchmark datasets.
# Uses on-the-fly SVAD splitting with a 40-second limit.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/users/ruchaofan/Evaluation/InhouseASR_2605/ta-IN/DeviceCommands_DisplayGPT/test.jsonl
  pre_process:
    svad_explode:
      max_len_sec: 40.0
      audio_key: WavPath
      path_replace:
        /datablob1/: az://orngwus2cresco/data/speech/
    rename_fields:
      mappings:
        audio_path: WavPath
        text: DisplayTranscription
        data_source: CorpusName
  add_task_info:
    task: lang_asr
    language: Tamil
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: tain_devicecommands_displaygpt
    verl_format:
      prompt_key: prompt
      extra_keys: ["id", "language", "audio_path", "parent_audio_path", "seg_start"]

- dataset_name: jsonl
