# @package data.val_data
# In-house hi-IN TER benchmark datasets.
# Uses the existing pre-segmented Hindi manifests.
- dataset_name: jsonl
  val_batch_size: -1
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/InhouseASR_2605_seg_presegment/hi-IN/Conversation_DTEST_FY23Q3_hi-IN_DTEST/test.jsonl
  pre_process:
    rename_fields:
      mappings:
        audio_path: WavPath
        text: DisplayTranscription
  add_task_info:
    task: lang_asr
    language: Hindi
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: hiin_conversation_dtest_fy23q3_hi_in_dtest
    verl_format:
      prompt_key: prompt
      extra_keys: ["id", "language", "audio_path", "parent_audio_path", "seg_start"]

