# MOE 18143a6e supplementary coverage (excluded from headline averages).
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/openasr_ml_expansion/18143a6e/fleurs_zh/data_zip.jsonl
  cache_name: openasr_expansion_18143a6e_fleurs_zh_openasr_ml
  add_task_info:
    task: lang_asr
    language: Chinese
  post_process:
    add_field:
      fields:
        data_source: zh_fleurs
    verl_format:
      prompt_key: prompt
      extra_keys:
      - id
      - language
      - audio_path
      - source_revision
      - source_row
      - metric
      - include_in_average_wer
