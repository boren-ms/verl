# @package data.val_data
# Eight CORAAL locations. Aggregate corpus WER uses summed errors/reference counts.
- dataset_name: jsonl
  val_batch_size: -1
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/OpenASR_long_seg_presegment_30s/coraal/ATL/test-*/data_zip.jsonl
  cache_name: openasr_coraal_ATL_verb_langhint_zip
  add_task_info:
    task: lang_asr_verb
    language: English
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: coraal_atl
    verl_format:
      prompt_key: prompt
      extra_keys:
      - id
      - language
      - audio_path
      - parent_audio_path
      - seg_index
      - n_segments
      - seg_start
      - seg_end
