# Single InhouseASR_2605 en-US D-test set: Conversation_DTEST_FY21Q1_en-US.
# Used in-place via blobfile — no copy. Per-corpus aggregation is keyed on
# CorpusName -> data_source. WavPath in source uses /datablob1/...; svad_explode
# rewrites the prefix to az:// in-place before loading audio.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/users/ruchaofan/Evaluation/InhouseASR_2605/en-US/Conversation_DTEST_FY21Q1_en-US/test.jsonl
  pre_process:
    svad_explode:
      max_len_sec: 40.0
      audio_key: WavPath
      path_replace:
        /datablob1/: az://orngwus2cresco/data/speech/
    rename_fields:
      mappings:
        audio_path: WavPath
        text: DisplayTranscription
        data_source: CorpusName
  add_task_info:
    task: lang_asr
    language: English
  post_process:
    verl_format:
      prompt_key: prompt
      extra_keys: ["id", "language", "audio_path", "parent_audio_path", "seg_start"]
