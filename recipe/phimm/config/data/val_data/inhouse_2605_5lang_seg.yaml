# Combined pre-segmented InhouseASR_2605 eval for 5 locales:
# en-US, da-DK, hu-HU, nb-NO, nl-NL.
# All corpora are pre-segmented (offline SVAD). Per-corpus aggregation is keyed
# on CorpusName -> data_source.

# ── en-US ──────────────────────────────────────────────────────────────────────
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/InhouseASR_2605_seg_presegment/en-US/Conversation_DTEST_FY21Q1_en-US/test.jsonl
  pre_process:
    rename_fields:
      mappings:
        audio_path: WavPath
        text: DisplayTranscription
        data_source: CorpusName
  add_task_info:
    task: lang_asr
    language: English
  post_process:
    verl_format:
      prompt_key: prompt
      extra_keys: ["id", "language", "audio_path", "parent_audio_path", "seg_start"]

