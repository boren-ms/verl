# All OpenLong segments with saved 2609r2b hypotheses. Segment references are
# inferred from the model's output and need human review before use as labels.
# No parent/audio grouping keys are passed: clips are scored independently.
# Saved parent-level error counts can be inflated by normalization artifacts.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/OpenLong_all_segments_2609r2b_step400_v1/earnings21.jsonl
  cache_name: auto_openlong_all_segments_baseline_2609r2b_earnings21_v1
  add_task_info:
    task: lang_asr_verb
    language: English
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: earnings21
    verl_format:
      prompt_key: prompt
      extra_keys: ["baseline_hypothesis", "baseline_n_err", "baseline_n_ref", "baseline_wer", "parent_baseline_n_err", "parent_baseline_n_ref", "parent_rank", "seg_index"]

