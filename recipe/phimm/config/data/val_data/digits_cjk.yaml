# RepeatNumber TTS D-test FY27Q1 for CJK locales and modes.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/users/v-wanhu/TaskForRui/Evaluation/RepeateNumber/ja-JP/RepeateNumber_ja-JP_random_TTS_DTEST_FY27Q1/test.jsonl
  pre_process:
    path_map:
      field: WavPath
      src_part: /datablob1/
      dst_part: az://orngwus2cresco/data/speech/
    rename_fields:
      mappings:
        audio_path: WavPath
        text: DisplayTranscription
  cache_name: jajp_digits_random
  add_task_info:
    task: lang_asr
    language: Japanese
  post_process:
    add_field:
      fields:
        data_source: jajp_digits_random
    verl_format:
      prompt_key: prompt
