# Single presegmented en-US D-test: Conversation_DTEST_FY21Q1_en-US.
# Each row is already one SVAD segment with WavPath#start:end, parent_audio_path,
# and seg_start — ready for long_audio_grouped reward manager.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/InhouseASR_2605_seg_presegment/en-US/Conversation_DTEST_FY21Q1_en-US/test.jsonl
  pre_process:
    rename_fields:
      mappings:
        audio_path: WavPath
        text: DisplayTranscription
  add_task_info:
    task: lang_asr
    language: English
  post_process:
    add_field:
      fields:
        data_source: enus_conv_fy21q1
    verl_format:
      prompt_key: prompt
      extra_keys: ["id", "language", "audio_path", "parent_audio_path", "seg_start"]
