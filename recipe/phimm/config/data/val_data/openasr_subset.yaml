- dataset_name: jsonl
  jsonl_paths: ${oc.env:DATA_PATH}/boren/data/openasr_jsonl/earnings22/data.jsonl
  cache_name: auto_earnings22
  pre_process:
    path_map:
      field: audio_path
      src_part: "audio/"
      dst_part: "${oc.env:DATA_PATH}/boren/data/openasr_jsonl/earnings22/audio/"
  add_prompt:
    task: lang_asr
    forced: True
  post_process:
    add_field:
      fields:
        data_source: earnings22
    verl_format:
      prompt_key: prompt

