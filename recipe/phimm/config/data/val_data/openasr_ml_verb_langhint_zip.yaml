# Voice Arena Monsoon Hindi uses lattice OIWER inside the shared OpenML scorer.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/openasr_ml_jsonl/monsoon/hi_in/data_zip.jsonl
  cache_name: auto_openasr_ml_verb_langhint_monsoon_hi_in_jsonl_zip
  add_task_info:
    task: lang_asr_verb
    language: Hindi
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: monsoon_hi_in
    verl_format:
      prompt_key: prompt
      extra_keys: ["lattice"]
