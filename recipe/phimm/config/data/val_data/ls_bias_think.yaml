- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/librispeech_biasing/ref/test-clean.biasing_100.jsonl
  cache_name: auto_clean_0_think
  pre_process:
    path_map:
      field: audio_path
      src_part: /root/data/
      dst_part: az://orngwus2cresco/data/boren/data/
    rename_fields:
      mappings:
        keywords: ground_truth
  add_task_info:
    task: lang_asr_verb
    language: English
    prefix_prob: 0.0
    think: keyword
  post_process:
    add_field:
      fields:
        data_source: clean_0
    verl_format:
      prompt_key: prompt

