# Existing two-parent subset of original-test/baseline/Qwen consensus data.
# All alignments are machine candidates, not verified labels; review flags apply.
# Reference words are assigned once even if audio segments overlap. Baseline-
# guided placement can affect the measured baseline error count.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/boren/data/Evaluation/OpenLong_testref_baseline_qwen_consensus_2609r2b_v1/two_parents/earnings21.jsonl
  cache_name: auto_openlong_consensus_2parents_earnings21_2609r2b_v1
  add_task_info: {task: lang_asr_verb, language: English, lang_hint: true}
  post_process:
    add_field: {fields: {data_source: earnings21}}
    verl_format:
      prompt_key: prompt
      extra_keys: ["baseline_hypothesis", "baseline_n_err", "baseline_n_ins", "baseline_n_del", "baseline_n_sub", "baseline_n_ref", "baseline_wer", "alignment_method", "alignment_status", "alignment_flags", "alignment_diagnostics", "qwen_alignment_flags", "reference_word_start", "reference_word_end"]

