# First 1,000 samples from each ghost-word non-speech validation set.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/users/ruchaofan/Evaluation/InhouseASR_2605/ghostword/FSD_Dev_Remove_Speech_Singing_DTEST_remove-122utts/h1k.jsonl
  cache_name: ghost_fsd_remove_speech_singing_h1k
  pre_process:
    path_map:
      field: WavPath
      src_part: /datablob1/users/ruchaofan/Evaluation/InhouseASR_2605/ghostword/
      dst_part: az://orngwus2cresco/data/speech/users/ruchaofan/Evaluation/InhouseASR_2605/ghostword/
    rename_fields:
      mappings:
        audio_path: WavPath
        text: DisplayTranscription
    add_field:
      fields:
        text: <nonspeech>
  add_task_info:
    task: lang_asr
    language: english
    prefix_prob: 1.0
  post_process:
    add_field:
      fields:
        data_source: ghost_fsd
    verl_format:
      prompt_key: prompt

