# Rover v1 valid subset: 8,930 of 10,000 tagged name validation records.
# Prepared with scripts/prepare_rover_v1_validation.py; 1,070 invalid rows excluded.
# updated_text contains rover_v1.updated_text; display preserves the input.
# References retain the name_10k bracket cleanup and English verbatim prompt.
- dataset_name: jsonl
  jsonl_paths: az://orngwus2cresco/data/speech/users/boren/data/pname/all_gpt_tagged_person.val10k.rover_v1.valid.jsonl
  pre_process:
    remove_brackets: {}
    path_map:
      field: audio_path
      src_part: "am_data/"
      dst_part: "az://orngwus2cresco/data/speech/am_data/"
    rename_fields:
      mappings:
        text: updated_text
  add_task_info:
    task: lang_asr_verb
    language: English
    prefix_prob: 0.0
    lang_hint: true
  post_process:
    add_field:
      fields:
        data_source: pname_10k
    verl_format:
      prompt_key: prompt
