defaults:
  - ppo_trainer
  - _self_

data:
  train_files: null
  val_files: null
  trust_remote_code: true
  max_prompt_length: 8192
  train_batch_size: 8 # 32
  gen_batch_size: 16 # 32 * n_rollout

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  kl_ctrl:
    kl_coef: 0.0
  filter_groups:
    enable: true
    metric: seq_reward
    max_num_gen_batches: 10
    # _target_: verl.trainer.config.FilterGroupsConfig

actor_rollout_ref:
  actor:
    use_kl_loss: false
    kl_loss_coef: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean
    entropy_coeff: 0
    optim:
      lr: 1e-5
      warmup_style: cosine
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: false
      optimizer_offload: false
      use_orig_params: true
    strategy: fsdp2
  model:
    path: null
    trust_remote_code: true
    use_remove_padding: true
    use_fused_kernels: false
  rollout:
    n: 4
    max_num_batched_tokens: 16384
    log_prob_micro_batch_size_per_gpu: 1
    tensor_model_parallel_size: 1
    name: vllm
    gpu_memory_utilization: 0.35
    load_format: safetensors
  ref:
    strategy: fsdp2
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true

reward_model:
  reward_manager: dapo
  overlong_buffer:
    enable: true
    len: 128
    penalty_factor: 1.0
    log: false

# custom_reward_function:
#   path: recipe/phimm/reward/asr_bias.py
#   name: compute_score

trainer:
  project_name: verl_asr
  logger: ["console", "wandb"]
  experiment_name: dapo-phimm-test
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 40
  test_freq: 40
  total_epochs: 1
  resume_mode: auto
  val_before_train: true
  total_training_steps: null # disable steps

