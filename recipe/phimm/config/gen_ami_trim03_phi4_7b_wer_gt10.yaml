hydra:
  searchpath:
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - gen_asr
  - data/train_data/oss_ami_trim03
  - _self_

model:
  path: ${oc.env:DATA_PATH}/boren/data/ckp/hf_models/phi4-7b-fast-api-s2-final-v4

data:
  batch_size: 512
  local_output_dir: ~/outputs/gen_ami_trim03_phi4_7b_wer_gt10
  remote_output_dir: ${oc.env:DATA_PATH}/boren/data/cache_datasets/gen_ami_trim03_phi4_7b_wer_gt10
  output_split_size: 5000
  wer_range: [0.1, 100.0]

rollout:
  temperature: 0.0
  gpu_memory_utilization: 0.8
  tensor_model_parallel_size: 2
