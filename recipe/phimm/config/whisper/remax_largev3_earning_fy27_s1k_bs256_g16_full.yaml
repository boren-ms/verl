hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - base
  - /data/train_data/earningscall-fy27-en-us-batch1
  - /data/val_data/earnings_aa_chunked
  - _self_

reward_functions:
  asr_measure:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2607
      reduce: mean
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        keyword: {beta: 5.0, cut: 0.85}

reward_function_by_data_source:
  earning_fy27_verb: asr_measure
  earning_fy27_lex: asr_measure

actor_rollout_ref:
  rollout:
    n: 4
  model:
    lora_rank: 0
    lora_alpha: 0
    target_modules: null
    exclude_modules: null
    trainable_params: null

data:
  train_batch_size: 256

trainer:
  nnodes: 2
  total_epochs: 30
  total_training_steps: 1000
