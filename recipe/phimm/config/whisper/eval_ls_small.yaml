hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - eval_base
  - /data/val_data/ls_clean
  - _self_

# Whisper inference entry point: plugins/qwen35_audio/scripts/run_whisper_vllm.py
actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/boren/data/verl/models/openai-whisper-small/

data:
  # RayDAPOTrainer initializes both dataloaders before honoring val_only.
  train_data: ${data.val_data}
  shuffle: false
  use_interleave: false
  dataloader_num_workers: 8
  prefetch_factor: 4
  val_batch_size: -1

trainer:
  project_name: whisper_eval
  val_only: true
  val_before_train: true
