hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - data/train_data/en_gpt_entity_h1_train
  - _self_

reward_functions:
  asr_measure:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2607
      reduce: mean
      measures:
        char: {beta: 0.5}
        word: {beta: 0.5}
        keyword: {beta: 1.0, cut: 0.5}
        lang: {beta: 1.0, cut: 0.25}
        fmt: {beta: 1.0, cut: 0.5}

reward_function_by_data_source:
  enhc_entity: asr_measure

actor_rollout_ref:
  rollout:
    n: 8
    gpu_memory_utilization: 0.65
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2607/amlt-results/fast-llm-2607-qwen3-5-9b-s2-data-v3.4-sr-afteraudio-lexical-fix/50000/qwen_hf/
    lora_rank: 128

data:
  train_batch_size: 64

trainer:
  nnodes: 4
  total_epochs: 15
  total_training_steps: 1000
  save_freq: 20
