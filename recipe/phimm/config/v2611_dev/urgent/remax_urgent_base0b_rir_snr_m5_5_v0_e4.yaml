# Match RIR E4 training, changing only the LibriSpeech SNR range to [-5, 5] dB.
# 20,424 rows / batch128 -> 159 complete batches per epoch, four epochs = 636 updates.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - base0b_2609r2_noisy_ls_e1_bs128_n16_r320_g16
  - /data/train_data/noisy/ls_rir_snr_m5_5_verb_langhint@_ls_train
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 1}
      measures:
        char: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word_del: {delta: abs, beta: 0.25, vote: delta, clip: [-2, 2]}
        word_ins: {delta: abs, beta: 0.25, vote: delta, clip: [-2, 2]}
        word_kw: {delta: abs, beta: 0.5, vote: delta, clip: [-2, 2]}
        lang: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}
        fmt: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}

reward_function_by_data_source:
  noisy_ls: librispeech

trainer:
  experiment_name: remax_urgent_base0b_rir_snr_m5_5_v0_e4
  total_epochs: 4
  total_training_steps: 636
