# FLEURS train-only feature subset; bad validation only; regression retained for analysis.
defaults:
  - base@_here_
  - /data/train_data/fleurs_pattern_verb_langhint_v1@_fleurs_train
  - /data/val_data/fleurs_bad_verb_langhint@_fleurs_bad
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf
    lora_rank: 320
  actor:
    optim: {lr: 3.0e-6, warmup_style: constant, lr_warmup_steps: 0}
  rollout:
    n: 8

data:
  train_data: ${_fleurs_train}
  val_data: ${_fleurs_bad}
  data_source:
    openml: {num_sample: 4550, shuffle: true}
  train_batch_size: 128
  shuffle: true

val_reward:
  reward_function_by_data_source:
    de_fleurs_bad: openasr_ml
    es_fleurs_bad: openasr_ml
    nl_fleurs_bad: openasr_ml
    it_fleurs_bad: openasr_ml
    pt_fleurs_bad: openasr_ml
    fr_fleurs_bad: openasr_ml

trainer:
  nnodes: 2
  total_epochs: 1
  total_training_steps: null
