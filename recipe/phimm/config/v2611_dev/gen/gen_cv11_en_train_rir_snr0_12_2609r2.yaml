# Decode every augmented CV11 English training row with original 2609r2 step 54000.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - gen_base
  - /data/train_data/noisy/cv11_en_train_rir_snr0_12_verb_langhint@data.train_data
  - _self_

custom_reward_function: ${val_reward.reward_functions.openasr_en}

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf

model:
  lora_rank: 0

data:
  output_path: az://orngwus2cresco/data/boren/data/verl/gen_qwen/v2611/2609r2/cv11_en_train_speed_rir_noise_snr0_12_but_v1
  output_split_size: 20000
  chunk_load_mode: sample
  max_audio_dur: null
  train_data:
    post_process:
      verl_format:
        extra_keys: [data_source]

rollout:
  dtype: bfloat16
  engine_kwargs:
    vllm:
      quantization: null

trainer:
  experiment_name: gen_cv11_en_train_rir_snr0_12_2609r2
  nnodes: 2
  n_gpus_per_node: 8
