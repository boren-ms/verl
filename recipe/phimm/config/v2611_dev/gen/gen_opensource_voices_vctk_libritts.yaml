hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - gen_base
  - /data/train_data/opensource_voices_vctk_libritts@data.train_data
  - _self_

custom_reward_function: ${val_reward.reward_functions.openasr_en}
ray_kwargs:
  ray_init:
    runtime_env:
      env_vars:
        # 711 GB input exceeds this pool's free root disk; verified 1.9 TiB RAM available.
        VERL_AUDIO_CACHE_ROOT: /dev/shm/verl-opensource-20261027-audio-cache
data:
  train_data:
    chunk_shuffle: false
  output_path: az://orngwus2cresco/data/boren/data/verl/gen_qwen/v2611/2609r2/opensource_voices_vctk_libritts_20261027
  max_audio_dur: null
  max_prompt_length: 8192
  max_response_length: 2048
  truncation: error
  output_split_size: 2048
rollout:
  max_num_seqs: 16
  max_num_batched_tokens: 16384
trainer:
  nnodes: 2
  n_gpus_per_node: 8
wer_filter:
  expected_rows: 1920120
  output_dir: az://orngwus2cresco/data/boren/data/verl/gen_filtered/v2611/2609r2/opensource_voices_vctk_libritts_20261027
  report_dir: outputs/opensource_wer_20261027/report
