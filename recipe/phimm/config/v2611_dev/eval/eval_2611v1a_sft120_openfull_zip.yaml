# OpenEN (9 sources) + OpenML (17 headline + 6 supplementary) + OpenLong (3 corpora).
# Evaluates the SFT step-120 checkpoint used to initialize 2611v1a.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - eval_base
  - /data/val_data/openasr_verb_langhint_zip@_openen
  - /data/val_data/openasr_ml_verb_langhint_zip@_openml
  - /data/val_data/openlong_seg_verb_langhint_zip@_openlong
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/xiaojul/amlt-results/fast-llm-2611-qwen3-5-9b-s2-vi-vn-it-it-flashenc-s2init-sft-only-mtp-lid/120/qwen_hf/
    lora_rank: 0

data:
  # Keep whole-corpus parent groups in-process, avoiding DataLoader IPC mmap limits.
  dataloader_num_workers: 0
  val_data:
    - ${_openen}
    - ${_openml}
    - ${_openlong}

val_reward:
  reward_function_by_data_source:
    earnings21: openasr_en
    earnings22: openasr_en
    coraal: openasr_en

trainer:
  experiment_name: eval_2611v1a_sft120_openfull_zip
  nnodes: 2
  n_gpus_per_node: 8
  resume_mode: disable
