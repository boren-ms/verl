# base2 best saved validation checkpoint; OpenASR + OpenML verbatim/lang-hint suite.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - eval_base
  - /data/val_data/openasr_verb_langhint_zip@_openasr
  - /data/val_data/openasr_ml_verb_langhint_zip@_openml
  - _self_
actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf
    lora_rank: 320
  actor:
    checkpoint:
      load_contents: [model]
trainer:
  nnodes: 2
  resume_mode: resume_path
  resume_from_path: az://orngwus2cresco/data/boren/outputs/v2611/base2_2609r2_d4_e1_bs128_n8_r320_g16_flr/global_step_560
  load_dataloader_state: false

data:
  val_data:
    - ${_openasr}
    - ${_openml}
