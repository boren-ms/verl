# ZIP-backed offline SVAD segments with verbatim and known-language prompts.
# Prepare ZIP manifests as documented in data/val_data/openlong_seg_zip.yaml.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - eval_base
  - /data/val_data/openlong_seg_verb_langhint_zip@_openlong
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf

trainer:
  experiment_name: v2609r2_openlong_seg_verb_langhint_zip

val_reward:
  reward_function_by_data_source:
    earnings21: openasr_en
    earnings22: openasr_en
    coraal: openasr_en
    earnings22_cleaned_aa: openasr_en

data:
  val_data:
    - ${_openlong}
