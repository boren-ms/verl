# AISHELL-only refinement. Publish the verified Top 20k manifest before training.
# Preserves Base1a's ReMax, optimizer and ASR-vote mechanics. Mandarin training
# uses character + language/format terms, avoiding whitespace word-segmentation bias.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - base_aishell
  - /data/train_data/aishell/aishell1_train_top20k_2611r2_verb_langhint@_aishell_train
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2611/amlt-results/fast-llm-2611-qwen9b-flashenc-mtp-s2-data-v3-8-2-1-shadow/38000/qwen_hf/

reward_function_by_data_source:
  aishell1_train_top20k: aishell1_char

reward_functions:
  aishell1_char:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      # One primary lexical measure, retaining the original auxiliary weights.
      reduce: {mode: average, total: 1}
      measures:
        char: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        lang: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}
        fmt: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}

trainer:
  experiment_name: remax_aishell1_top20k_base1a_2611r2
