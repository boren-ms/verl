# Main Base1: shared model, validation, reward, and training settings.
defaults:
  - ../base@_here_
  - /data/val_data/earnings22_verb_langhint@_earning_val
  - /data/val_data/openasr_ml_bad_fmt_lang_bracket_langhint@_ml_val
  - /data/val_data/urgent2024_delta@_urgent_delta
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf
    lora_rank: 320
    use_linear_attention_packing: false
  actor:
    loss_agg_mode: seq-mean-token-sum
    optim:
      lr: 6.0e-7
      warmup_style: constant
      lr_warmup_steps: 0
  rollout:
    n: 8
    temperature_scaled_log_probs: false

data:
  val_data:
    - ${_earning_val}
    - ${_ml_val}
    - ${_urgent_delta}
  train_batch_size: 128

trainer:
  nnodes: 2
  total_epochs: 2
  total_training_steps: null
  max_actor_ckpt_to_keep: 2

# Replace the inherited scorer map rather than merging removed LS entries back in.
_val_reward_sources:
  monsoon_hi_in: openasr_hi_in
  mixlang: inhouse_zh
  earning: openasr_en
  openml_bad: openasr_ml
  earning_num: openasr_en
  earning_chunk_verb: openasr_en
  earning_chunk_lex: openasr_en
  earnings_pre_chunk_verb: openasr_en
  earnings_pre_chunk_lex: openasr_en
  urgent2024_delta: openasr_en

val_reward:
  reward_function_by_data_source: ${_val_reward_sources}

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 2}
      measures:
        char: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word_del: {delta: abs, beta: 0.2, vote: delta, clip: [-2, 2]}
        word_ins: {delta: abs, beta: 0.1, vote: delta, clip: [-2, 2]}
        word_kw: {delta: abs, beta: 0.2, vote: delta, clip: [-2, 2]}
        lang: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}
        fmt: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  noisy_ls: librispeech
