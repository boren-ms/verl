# Main Base1 with the 2611r2 shadow step-38000 pretrained checkpoint.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - base1_smts
  - /data/train_data/openml_verb_langhint_v0@_ml_train
  - /data/train_data/earningscall-fy27-en-us-batches-wer-gt1pct-verb-langhint@_earning_train
  - /data/train_data/noisy/ls_rir_verb_langhint@_noisy_ls_train
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2611/amlt-results/fast-llm-2611-qwen9b-flashenc-mtp-s2-data-v3-8-2-1-shadow/38000/qwen_hf/

# Per epoch: 4,957 Earnings, 20,424 noisy LS, and 13,169 OpenML rows.
data:
  train_data:
    - ${_ml_train}
    - ${_earning_train}
    - ${_noisy_ls_train}
  data_source: null
  shuffle: false
  mix:
    - shuffle: true
      datasource:
        - {name: earnings_fy27, sample: 4957, shuffle: true}
        - {name: noisy_ls, sample: 20424, shuffle: true}
        - {name: openml, sample: 13169, shuffle: true}

trainer:
  experiment_name: remax_main_base1_2611r2
