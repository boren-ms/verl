# Main Base2a: Base1a 2611r2 plus AISHELL Top20k and Mandarin Top500 validation.
# Preserve every original training source, sample budget, validation set and control.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - base2a_smts@_here_
  - /data/train_data/openml_verb_langhint_v0@_ml_train
  - /data/train_data/earningscall-fy27-en-us-batches-wer-gt1pct-verb-langhint@_earnings_filtered_train
  - /data/train_data/noisy/ls_rir_verb_langhint@_noisy_ls_train
  - /data/train_data/earn_fy27@_earning_train
  - /data/train_data/quartr_1st23@_quartr_first23_train
  - /data/train_data/quartr_2nd48@_quartr_second48_train
  - /data/train_data/aishell/aishell1_train_top20k_2611r2_verb_langhint@_aishell_train
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2611/amlt-results/fast-llm-2611-qwen9b-flashenc-mtp-s2-data-v3-8-2-1-shadow/38000/qwen_hf/

data:
  data_source: null
  train_data:
    - ${_ml_train}
    - ${_earnings_filtered_train}
    - ${_noisy_ls_train}
    - ${_earning_train}
    - ${_quartr_first23_train}
    - ${_quartr_second48_train}
    - ${_aishell_train}
  shuffle: false
  mix:
    - shuffle: true
      datasource:
        - {name: earnings_fy27, sample: 4957, shuffle: true}
        - {name: noisy_ls, sample: 20424, shuffle: true}
        - {name: openml, sample: 13169, shuffle: true}
        - {name: earn_fy27, sample: 9568, shuffle: true}
        - {name: quartr_1st23, sample: 3125, shuffle: true}
        - {name: quartr_2nd48, sample: 6392, shuffle: true}
        - {name: aishell1_train_top20k, sample: 20000, shuffle: true}

reward_function_by_data_source:
  earn_fy27: librispeech
  quartr_1st23: librispeech
  quartr_2nd48: librispeech
  aishell1_train_top20k: aishell1_char

# Character reward for the added Mandarin source; original source rewards stay intact.
reward_functions:
  aishell1_char:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 1}
      measures:
        char: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        lang: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}
        fmt: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}

trainer:
  experiment_name: remax_main_base2a_2611r2
