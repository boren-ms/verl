# Main Base1b: Base1a 2611r2 plus Quartr 3rd38 Earnings training data.
# Use full FY27 data without the overlapping WER-filtered subset.
# Preserve the remaining source order and sample budgets; append all 6,155 new rows.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - base1a_smts
  - /data/train_data/openml_verb_langhint_v0@_ml_train
  - /data/train_data/noisy/ls_rir_verb_langhint@_noisy_ls_train
  - /data/train_data/earn_fy27@_earning_train
  - /data/train_data/quartr_1st23@_quartr_first23_train
  - /data/train_data/quartr_2nd48@_quartr_second48_train
  - /data/train_data/quartr_3rd38@_quartr_third38_train
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2611/amlt-results/fast-llm-2611-qwen9b-flashenc-mtp-s2-data-v3-8-2-1-shadow/38000/qwen_hf/

data:
  data_source: null
  train_data:
    - ${_ml_train}
    - ${_noisy_ls_train}
    - ${_earning_train}
    - ${_quartr_first23_train}
    - ${_quartr_second48_train}
    - ${_quartr_third38_train}
  shuffle: false
  mix:
    - shuffle: true
      datasource:
        - {name: noisy_ls, sample: 20424, shuffle: true}
        - {name: openml, sample: 13169, shuffle: true}
        - {name: earn_fy27, sample: 9568, shuffle: true}
        - {name: quartr_1st23, sample: 3125, shuffle: true}
        - {name: quartr_2nd48, sample: 6392, shuffle: true}
        - {name: quartr_3rd38, sample: 6155, shuffle: true}

reward_function_by_data_source:
  earn_fy27: librispeech
  quartr_1st23: librispeech
  quartr_2nd48: librispeech
  quartr_3rd38: librispeech

trainer:
  experiment_name: remax_main_base1b_2611r2
