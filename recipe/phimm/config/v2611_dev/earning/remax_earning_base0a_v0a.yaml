# Earning base0a training setup with the Hindi base1 v0 ASR delta-voting rewards.
# Uses absolute deltas directly as votes, clipped to [-2, 2] before weighting.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0a_2609r2_quartr_wer05_e2_bs128_n8_r320_g16_flr
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 4}
      measures:
        char: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word_del: {delta: abs, beta: 0.25, vote: delta, clip: [-2, 2]}
        word_ins: {delta: abs, beta: 0.25, vote: delta, clip: [-2, 2]}
        word_kw: {delta: abs, beta: 0.5, vote: delta, clip: [-2, 2]}
        lang: {delta: abs, beta: 0.1, vote: delta, clip: [-2, 2]}

reward_function_by_data_source:
  quartr_20261016: librispeech
