# ReMax entry for Base2a: FY27 rows with inclusive WER >= 1%.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - base2a_2609r2_fy27_e2_bs128_n8_r320_g16_flr
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 1.8}
      measures:
        word: {delta: abs, beta: 1.0, vote: delta}
        word_del: {delta: abs, beta: 0.1, vote: delta}
        word_ins: {delta: abs, beta: 0.1, vote: delta}
        word_kw: {delta: abs, beta: 1.0, vote: delta}
        lang: {delta: abs, beta: 0.2, vote: delta}
        fmt: {delta: abs, beta: 0.2, vote: delta}

reward_function_by_data_source:
  earnings_fy27: librispeech

trainer:
  experiment_name: remax_earning_base2a_v0
