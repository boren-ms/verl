# Cleaned Quartr FY27 first-23-events training with Earnings22 validation.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - ../base@_here_
  - /data/train_data/earningscall-quartr-fy27-batch1-first23events-cleaned-verb-langhint@_quartr_train
  - /data/val_data/earnings22_verb_langhint@_earning_val
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf
    lora_rank: 320
  actor:
    optim:
      lr: 3.0e-6
      warmup_style: constant
      lr_warmup_steps: 0
  rollout:
    n: 8

data:
  data_source:
    earnings_quartr_fy27_batch1_first23events: {num_epoch: 1, shuffle: true}
  train_data:
    - ${_quartr_train}
  val_data:
    - ${_earning_val}
  train_batch_size: 128
  shuffle: true

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 1.8}
      measures:
        word: {delta: abs, beta: 1.0, vote: delta}
        word_del: {delta: abs, beta: 0.1, vote: delta}
        word_ins: {delta: abs, beta: 0.1, vote: delta}
        word_kw: {delta: abs, beta: 1.0, vote: delta}
        lang: {delta: abs, beta: 0.2, vote: delta}
        fmt: {delta: abs, beta: 0.2, vote: delta}

reward_function_by_data_source:
  earnings_quartr_fy27_batch1_first23events: librispeech

trainer:
  experiment_name: remax_earning_base3b_v0
  nnodes: 2
  # Allow 200 steps even if filtering leaves only one full batch per epoch.
  total_epochs: 200
  total_training_steps: 200
