# 2611r2-confirmed errors from all four Base4c sources; preserve Base4c settings.
# Full25240-row coverage and canonical rescoring verified; original training settings retained.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - ../base@_here_
  - /data/train_data/earn_fy27_2611r2_errors@_earning_train
  - /data/train_data/quartr_1st23_2611r2_errors@_quartr_first23_train
  - /data/train_data/quartr_2nd48_2611r2_errors@_quartr_second48_train
  - /data/train_data/quartr_3rd38_2611r2_errors@_quartr_third38_train
  - /data/val_data/earnings22_verb_langhint@_earning_val
  - /data/val_data/openlong_all_2parents_error_2609r2b@_openlong
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf
    lora_rank: 320
  actor:
    optim:
      lr: 3.0e-6
      warmup_style: constant
      lr_warmup_steps: 0
  rollout:
    n: 8

# Training dataset: 16,235 utterances with canonical English n_err > 0.
# Source             Samples   Share    Expected per batch of128
# earn_fy27           4,653   28.66%    36.7
# quartr_1st23        2,094   12.90%    16.5
# quartr_2nd48        4,797   29.55%    37.8
# quartr_3rd38        4,691   28.89%    37.0
# Expected averages under shuffled sampling; no fixed per-batch quotas.
# Original references/metadata retained; output-limit rows included and audited.
data:
  data_source:
    earn_fy27: {num_epoch: 1, shuffle: true}
    quartr_1st23: {num_epoch: 1, shuffle: true}
    quartr_2nd48: {num_epoch: 1, shuffle: true}
    quartr_3rd38: {num_epoch: 1, shuffle: true}
  train_data:
    - ${_earning_train}
    - ${_quartr_first23_train}
    - ${_quartr_second48_train}
    - ${_quartr_third38_train}
  val_data:
    - ${_earning_val}
    - ${_openlong}
  train_batch_size: 128
  shuffle: true

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 1.8}
      measures:
        word: {delta: abs, beta: 1.0, vote: delta}
        word_del: {delta: abs, beta: 0.1, vote: delta}
        word_ins: {delta: abs, beta: 0.1, vote: delta}
        word_kw: {delta: abs, beta: 1.0, vote: delta}
        lang: {delta: abs, beta: 0.2, vote: delta}
        fmt: {delta: abs, beta: 0.2, vote: delta}

reward_function_by_data_source:
  earn_fy27: librispeech
  quartr_1st23: librispeech
  quartr_2nd48: librispeech
  quartr_3rd38: librispeech

val_reward:
  reward_function_by_data_source:
    earnings21: openasr_en
    earnings22: openasr_en
    coraal: openasr_en
    earnings22_cleaned_aa: openasr_en

trainer:
  experiment_name: remax_earning_base4c_errors
  nnodes: 2
  # Allow 400 steps even if filtering leaves only one full batch per epoch.
  total_epochs: 400
  total_training_steps: 400
