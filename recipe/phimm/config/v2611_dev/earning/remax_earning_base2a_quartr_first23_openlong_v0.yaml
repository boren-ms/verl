# Base2a with the cleaned Quartr FY27 first-23-events training set and
# the original Earnings22 validation and the model-selected OpenLong top 100s.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - base2a_2609r2_fy27_e2_bs128_n8_r320_g16_flr
  - /data/train_data/earningscall-quartr-fy27-batch1-first23events-cleaned-verb-langhint@_quartr_train
  - /data/val_data/openlong_top100_error_2609r2b@_openlong
  - _self_

_quartr_data_source:
  earnings_quartr_fy27_batch1_first23events: {num_epoch: 1, shuffle: true}

data:
  data_source: ${_quartr_data_source}
  train_data:
    - ${_quartr_train}
  val_data:
    - ${_earning_val}
    - ${_openlong}

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 1.8}
      measures:
        word: {delta: abs, beta: 1.0, vote: delta}
        word_del: {delta: abs, beta: 0.1, vote: delta}
        word_ins: {delta: abs, beta: 0.1, vote: delta}
        word_kw: {delta: abs, beta: 1.0, vote: delta}
        lang: {delta: abs, beta: 0.2, vote: delta}
        fmt: {delta: abs, beta: 0.2, vote: delta}

reward_function_by_data_source:
  earnings_quartr_fy27_batch1_first23events: librispeech

val_reward:
  reward_function_by_data_source:
    earnings21: openasr_en
    earnings22: openasr_en
    coraal: openasr_en
    earnings22_cleaned_aa: openasr_en

trainer:
  # Inherited limits are six epochs and 200 steps. With 3,125 source rows,
  # six full epochs yield at most 144 batches of 128 (drop_last=true).
  experiment_name: remax_earning_base2a_quartr_first23_openlong_v0
