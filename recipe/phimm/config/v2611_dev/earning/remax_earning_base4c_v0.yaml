# Combined Base3a, Base3b, Base3c and Base3d training data; preserve Base4b settings.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - ../base@_here_
  - /data/train_data/earn_fy27@_earning_train
  - /data/train_data/quartr_1st23@_quartr_first23_train
  - /data/train_data/quartr_2nd48@_quartr_second48_train
  - /data/train_data/quartr_3rd38@_quartr_third38_train
  - /data/val_data/earnings22_verb_langhint@_earning_val
  - /data/val_data/openasr/openlong_all_2parents_error_2609r2b@_openlong
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf
    lora_rank: 320
  actor:
    optim:
      lr: 3.0e-6
      warmup_style: constant
      lr_warmup_steps: 0
  rollout:
    n: 8

# Training dataset composition (25,240 samples total):
# Source             Samples   Share    Expected per batch of 128
# earn_fy27 batch 1    4,695   18.60%   23.8
# earn_fy27 batch 2    4,873   19.31%   24.7
# quartr_1st23         3,125   12.38%   15.8
# quartr_2nd48         6,392   25.32%   32.4
# quartr_3rd38         6,155   24.39%   31.2
# Total               25,240  100.00%  128.0
# Per-batch values are expected averages, not fixed quotas; samples are shuffled.
data:
  data_source:
    earn_fy27: {num_epoch: 1, shuffle: true}
    quartr_1st23: {num_epoch: 1, shuffle: true}
    quartr_2nd48: {num_epoch: 1, shuffle: true}
    quartr_3rd38: {num_epoch: 1, shuffle: true}
  train_data:
    - ${_earning_train}
    - ${_quartr_first23_train}
    - ${_quartr_second48_train}
    - ${_quartr_third38_train}
  val_data:
    - ${_earning_val}
    - ${_openlong}
  train_batch_size: 128
  shuffle: true

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 1.8}
      measures:
        word: {delta: abs, beta: 1.0, vote: delta}
        word_del: {delta: abs, beta: 0.1, vote: delta}
        word_ins: {delta: abs, beta: 0.1, vote: delta}
        word_kw: {delta: abs, beta: 1.0, vote: delta}
        lang: {delta: abs, beta: 0.2, vote: delta}
        fmt: {delta: abs, beta: 0.2, vote: delta}

reward_function_by_data_source:
  earn_fy27: librispeech
  quartr_1st23: librispeech
  quartr_2nd48: librispeech
  quartr_3rd38: librispeech

val_reward:
  reward_function_by_data_source:
    earnings21: openasr_en
    earnings22: openasr_en
    coraal: openasr_en
    earnings22_cleaned_aa: openasr_en

trainer:
  experiment_name: remax_earning_base4c_v0
  nnodes: 2
  # Allow 400 steps even if filtering leaves only one full batch per epoch.
  total_epochs: 400
  total_training_steps: 400
