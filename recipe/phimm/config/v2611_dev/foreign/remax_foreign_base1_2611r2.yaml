# Original + mixed, No GT, with Base1's own lang_only_verb training data configs.
# Validation uses lang_only_verb except enhint_noen, which keeps its original task.
# Same 12,800 samples/epoch x 2 epochs / batch128 = 200 optimizer steps as Base0.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - base1_2611r2_foreign_remote
  - /data/train_data/foreign_language/english_hint_1k_lang_only_verb@_foreign_train_1k
  - /data/train_data/foreign_language/english_hint_mixed_1k_lang_only_verb@_foreign_train_mixed
  - _self_

data:
  train_data:
    - ${_foreign_train_1k}
    - ${_foreign_train_mixed}
  mix:
    - shuffle: true
      datasource:
        - {name: foreign_1k, sample: 6700, shuffle: true}
        - {name: foreign_mixed_10k, sample: 6100, shuffle: true}

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 2}
      measures:
        char: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word_del: {delta: abs, beta: 0.2, vote: delta, clip: [-2, 2]}
        word_ins: {delta: abs, beta: 0.1, vote: delta, clip: [-2, 2]}
        word_kw: {delta: abs, beta: 0.2, vote: delta, clip: [-2, 2]}
        lang: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}
        fmt: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}
reward_function_by_data_source: {foreign_1k: librispeech, foreign_mixed_10k: librispeech}

trainer:
  experiment_name: remax_foreign_base1_2611r2
