# GT rollout with the original 1k-per-language data and 10k mixed pairs.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - base0_2609r2_foreign_remote
  - /data/train_data/foreign_language/english_hint_1k_mixed@_foreign_train_1k_mixed
  - _self_

data:
  train_data: ['${_foreign_train_1k_mixed}']
  mix:
    - shuffle: true
      datasource:
        - {name: foreign_1k, sample: 11000, shuffle: true}
        - {name: foreign_mixed_10k, sample: 10000, shuffle: true}
reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 2}
      measures:
        char: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word_del: {delta: abs, beta: 0.2, vote: delta, clip: [-2, 2]}
        word_ins: {delta: abs, beta: 0.1, vote: delta, clip: [-2, 2]}
        word_kw: {delta: abs, beta: 0.2, vote: delta, clip: [-2, 2]}
        lang: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}
        fmt: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}
reward_function_by_data_source: {foreign_1k: librispeech, foreign_mixed_10k: librispeech}
