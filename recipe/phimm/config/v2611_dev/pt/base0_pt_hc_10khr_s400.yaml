# PT-specific Base0: filtered HC training and full OpenASR-ML PT validation; 400 steps.
# Model, optimization and reward settings follow Base4 e2 v1.
defaults:
  - ../base@_here_
  - /data/train_data/hc_release_2026-10-14_pt_10khr_wer_gt1pct_verb_langhint@_pt_train
  - openml_pt_verb_langhint@_pt_val
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf
    lora_rank: 320
  actor:
    optim: {lr: 3.0e-6, warmup_style: constant, lr_warmup_steps: 0}
  rollout: {n: 8}

data:
  train_data: ${_pt_train}
  val_data: ${_pt_val}
  data_source:
    hc_release_20261014_pt_10000h: {num_epoch: 1, shuffle: true}
  train_batch_size: 128
  shuffle: true

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 2}
      measures:
        char: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word_del: {delta: abs, beta: 0.2, vote: delta, clip: [-2, 2]}
        word_ins: {delta: abs, beta: 0.1, vote: delta, clip: [-2, 2]}
        word_kw: {delta: abs, beta: 0.2, vote: delta, clip: [-2, 2]}
        lang: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}
        fmt: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}

reward_function_by_data_source:
  hc_release_20261014_pt_10000h: librispeech

val_reward:
  reward_function_by_data_source:
    pt_fleurs: openasr_ml
    pt_mls: openasr_ml

trainer:
  nnodes: 2
  total_epochs: 1
  total_training_steps: 400
