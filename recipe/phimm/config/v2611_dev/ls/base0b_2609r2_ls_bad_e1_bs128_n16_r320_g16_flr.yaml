# Derived from LS base0; retain LS bad-case training and test-clean/test-other validation.
# Match dev base0b training settings, including LR 1e-6.
# Enable packing state isolation; use temperature 1.0, 16 rollouts, and one epoch.
defaults:
  - base0_2609r2_ls_bad_e2_bs128_n8_r320_g16_flr
  - _self_

actor_rollout_ref:
  actor:
    optim:
      lr: 1.0e-6
  model:
    use_remove_padding: true
    use_linear_attention_packing: true
  rollout:
    temperature: 1.0
    n: 16

trainer:
  total_epochs: 1
