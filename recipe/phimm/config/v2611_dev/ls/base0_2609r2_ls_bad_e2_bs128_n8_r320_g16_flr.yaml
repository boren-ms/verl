# Train on LibriSpeech bad cases for two epochs with a constant LR of 3e-6.
# Validate on LibriSpeech test-clean and test-other with verbatim language hints.
defaults:
  - ../base@_here_
  - /data/train_data/ls_rare_bad_verb_langhint_v0@_ls_train
  - /data/val_data/ls_kw_verb_langhint@_ls_val
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf
    lora_rank: 320
  actor:
    optim:
      lr: 3.0e-6
      warmup_style: constant
      lr_warmup_steps: 0
  rollout:
    n: 8

data:
  data_source:
    ls_rare_verb: {num_epoch: 1, shuffle: true}
  train_data:
    - ${_ls_train}
  val_data:
    - ${_ls_val}
  train_batch_size: 128
  shuffle: true

trainer:
  nnodes: 2
  total_epochs: 2
  total_training_steps: null
