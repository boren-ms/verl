# LS bad-case training with the v1g absolute-delta reward and GT rollout.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_ls_bad_e2_bs128_n8_r320_g16_flr
  - _self_

actor_rollout_ref:
  rollout:
    gt_rollout: true

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 1.9}
      measures:
        word: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word_del: {delta: abs, beta: 0.1, vote: delta, clip: [-1, 1]}
        word_ins: {delta: abs, beta: 0.1, vote: delta, clip: [-1, 1]}
        word_kw: {delta: abs, beta: 0.2, vote: delta, clip: [-1, 1]}
        word_lang: {delta: abs, beta: 0.5, vote: delta, clip: [-1, 1]}

reward_function_by_data_source:
  ls_rare_verb: librispeech
