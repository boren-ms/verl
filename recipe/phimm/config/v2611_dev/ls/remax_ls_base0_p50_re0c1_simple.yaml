# LS p50 with re0c1 negative-error rewards and simple text normalization.
# Select the highest-error 50% of bad-case records by n_err, not 50% of total errors.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_ls_bad_e2_bs128_n8_r320_g16_flr
  - /data/train_data/ls_rare_bad_verb_langhint_v0_p50@_ls_train
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_measure_v0.py
    name: compute_score
    reward_kwargs:
      version: 2609
      text_norm: simple
      reduce: {mode: average, total: 2.1}
      measures:
        word: {beta: 1.0, low: -2.0, high: 0.0}
        word_del: {beta: 0.25, low: -2.0, high: 0.0}
        word_ins: {beta: 0.25, low: -2.0, high: 0.0}
        word_kw: {beta: 0.5, low: -2.0, high: 0.0}
        lang: {beta: 0.1, low: -2.0, high: 0.0}

reward_function_by_data_source:
  ls_rare_verb: librispeech
