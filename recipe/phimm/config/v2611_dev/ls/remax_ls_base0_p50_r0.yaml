# LS base0 r0 with the highest-error 50% of bad-case records by n_err.
# Cutoff ties retain source order; this is not 50% of total errors.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_ls_bad_e2_bs128_n8_r320_g16_flr
  - /data/train_data/ls_rare_bad_verb_langhint_v0_p50@_ls_train
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 4}
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        word_del: {beta: 0.25}
        word_ins: {beta: 0.25}
        word_kw: {beta: 0.5}
        lang: {beta: 0.1}

reward_function_by_data_source:
  ls_rare_verb: librispeech
