# Three ordered stages, weights in Earnings / LS / OpenML order:
# (1, 0, 0), (0, 1, 0), (0, 0, 1).
# Each stage uses its dominant source full row count as the shared sample base.
# Full manifest rows: Earnings=10746, LS=71707, OpenML=13169.
# Source selections across stages are independent and may overlap.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_d3_e2_bs128_n8_r320_g16_flr
  - _self_

data:
  data_source: null
  shuffle: false
  mix:
    # Base: earnings_fy27, 10746 rows; other sources use zero rows.
    - shuffle: true
      datasource:
        - {name: earnings_fy27, sample: 10746, shuffle: true}
        - {name: ls_rare_verb, sample: 0, shuffle: true}
        - {name: openml, sample: 0, shuffle: true}
    # Base: ls_rare_verb, 71707 rows; other sources use zero rows.
    - shuffle: true
      datasource:
        - {name: earnings_fy27, sample: 0, shuffle: true}
        - {name: ls_rare_verb, sample: 71707, shuffle: true}
        - {name: openml, sample: 0, shuffle: true}
    # Base: openml, 13169 rows; other sources use zero rows.
    - shuffle: true
      datasource:
        - {name: earnings_fy27, sample: 0, shuffle: true}
        - {name: ls_rare_verb, sample: 0, shuffle: true}
        - {name: openml, sample: 13169, shuffle: true}

trainer:
  total_epochs: 1

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 2}
      measures:
        char: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word_del: {delta: abs, beta: 0.2, vote: delta, clip: [-2, 2]}
        word_ins: {delta: abs, beta: 0.1, vote: delta, clip: [-2, 2]}
        word_kw: {delta: abs, beta: 0.2, vote: delta, clip: [-2, 2]}
        lang: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}
        fmt: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech
