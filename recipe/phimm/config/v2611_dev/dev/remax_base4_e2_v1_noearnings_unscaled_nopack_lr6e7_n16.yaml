# No Earnings unscaled/no-pack variant with LR 6e-7 and 16 rollouts.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - base4_2609r2_d3_e1_bs128_n8_r320_g16_flr
  - _self_

actor_rollout_ref:
  actor:
    optim:
      lr: 6.0e-7
  model:
    use_linear_attention_packing: false
  rollout:
    n: 16
    temperature_scaled_log_probs: false

trainer:
  total_epochs: 2

data:
  train_data: ['${_ml_train}', '${_noisy_ls_train}']
  mix:
    - shuffle: true
      datasource:
        - {name: noisy_ls, sample: 20424, shuffle: true}
        - {name: openml, sample: 13169, shuffle: true}
