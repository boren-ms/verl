# v1h1_gt with relative deltas for every reward measure.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_d3_e2_bs128_n8_r320_g16_flr
  - _self_

actor_rollout_ref:
  rollout:
    gt_rollout: true

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 2.4}
      measures:
        word: {delta: rel, beta: 1.0, vote: delta, clip: [-10, 10]}
        word_del: {delta: rel, beta: 0.1, vote: delta, clip: [-10, 10]}
        word_ins: {delta: rel, beta: 0.1, vote: delta, clip: [-10, 10]}
        word_kw: {delta: rel, beta: 0.2, vote: delta, clip: [-10, 10]}
        word_lang: {delta: rel, beta: 1.0, vote: delta, clip: [-10, 10]}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech
