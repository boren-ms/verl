# re0c1 with simple reward normalization: lowercase, remove punctuation, and normalize whitespace.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_d3_e2_bs128_n8_r320_g16_flr
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_measure_v0.py
    name: compute_score
    reward_kwargs:
      version: 2609
      text_norm: simple
      reduce: {mode: average, total: 2.1}
      measures:
        word: {beta: 1.0, low: -2.0, high: 0.0}
        word_del: {beta: 0.25, low: -2.0, high: 0.0}
        word_ins: {beta: 0.25, low: -2.0, high: 0.0}
        word_kw: {beta: 0.5, low: -2.0, high: 0.0}
        lang: {beta: 0.1, low: -2.0, high: 0.0}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech
