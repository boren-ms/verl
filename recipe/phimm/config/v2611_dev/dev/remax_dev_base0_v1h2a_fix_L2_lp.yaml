# Derived from remax_dev_base0_v1h2a_fix_L2; short experiment tag: L2_lp.
# Run with the log-prob fix in e6abc2377 or later.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_d3_e2_bs128_n8_r320_g16_flr
  - _self_

actor_rollout_ref:
  rollout:
    temperature: 1.2
    engine_kwargs:
      vllm:
        logprobs_mode: processed_logprobs

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 4}
      measures:
        char: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word_del: {delta: abs, beta: 0.25, vote: delta, clip: [-2, 2]}
        word_ins: {delta: abs, beta: 0.25, vote: delta, clip: [-2, 2]}
        word_kw: {delta: abs, beta: 0.5, vote: delta, clip: [-2, 2]}
        lang: {score: acc, beta: 0.01, vote: abs, clip: [-2, 2]}
        fmt: {score: acc, beta: 0.01, vote: abs, clip: [-2, 2]}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech
