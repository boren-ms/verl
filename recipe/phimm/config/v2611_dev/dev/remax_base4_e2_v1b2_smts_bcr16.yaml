# Base4 BCR16 with v1b2 learning rate and SMTS actor loss aggregation.
# Nominal batch 144 = 128 fresh + up to 16 worst-score replay inputs.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - base4_2609r2_d3_e1_bs128_n8_r320_g16_flr
  - _self_

actor_rollout_ref:
  actor:
    loss_agg_mode: seq-mean-token-sum
    optim:
      lr: 6.0e-7
  rollout:
    n: 8

data:
  train_batch_size: 144

trainer:
  total_epochs: 2

algorithm:
  bad_case_replay:
    enable: true
    capacity: 6400
    replay_size: 16
    sampling: worst
    selection:
      weights:
        word: 1.0
    seed: 42
