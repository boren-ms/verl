# Character, word edit, and word-normalized language votes with +/-0.001 thresholds.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_d3_e2_bs128_n8_r320_g16_flr
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 3}
      measures:
        char: {delta: rel, beta: 1.0, tol: [-0.001, 0.001]}
        word: {delta: rel, beta: 1.0, tol: [-0.001, 0.001]}
        word_del: {delta: rel, beta: 0.25, tol: [-0.001, 0.001]}
        word_ins: {delta: rel, beta: 0.25, tol: [-0.001, 0.001]}
        word_lang: {delta: rel, beta: 0.5, tol: [-0.001, 0.001]}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech
