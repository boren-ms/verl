# Base4 v1b2 with SMTS actor loss, 16 rollouts, and temperature 1.2.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - base4_2609r2_d3_e1_bs128_n8_r320_g16_flr
  - _self_

actor_rollout_ref:
  actor:
    loss_agg_mode: seq-mean-token-sum
    optim:
      lr: 6.0e-7
  rollout:
    n: 16
    temperature: 1.2

trainer:
  total_epochs: 2
