# Combine hinted verbatim and unhinted plain ASR training and validation data.
# Globally shuffle sources at approximately a 4:1:2 sample ratio for two epochs.
# Training variants share each source's sampling budget; validation metrics are separate.
defaults:
  - ../base@_here_
  - /data/train_data/openml_verb_langhint_v0@_ml_train
  - /data/train_data/earnings_tts_verb_langhint_v0@_earning_train
  - /data/train_data/ls_rare_bad_verb_langhint_v0@_ls_train
  - /data/train_data/openml_no_langhint_v0@_ml_nohint_train
  - /data/train_data/earnings_tts_no_langhint_v0@_earning_nohint_train
  - /data/train_data/ls_rare_bad_no_langhint_v0@_ls_nohint_train
  - /data/val_data/earnings22_verb_langhint@_earning_val
  - /data/val_data/openasr_ml_bad_fmt_lang_bracket_langhint@_ml_val
  - /data/val_data/ls_kw_verb_langhint@_ls_val
  - /data/val_data/earnings22_no_langhint@_earning_nohint_val
  - /data/val_data/openasr_ml_bad_fmt_lang_bracket_no_langhint@_ml_nohint_val
  - /data/val_data/ls_kw_no_langhint@_ls_nohint_val
  - _self_

val_reward:
  reward_function_by_data_source:
    earning_chunk_nohint: openasr_en
    openml_bad_nohint: openasr_ml
    ls_clean_nohint: openasr_en
    ls_other_nohint: openasr_en

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2609/amlt-results/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2/54000/qwen_hf
    lora_rank: 320
  actor:
    optim:
      lr: 3.0e-6
      warmup_style: constant
      lr_warmup_steps: 0
  rollout:
    n: 8

data:
  data_source:
    openml: {num_sample: 52676, shuffle: true}
    earnings_fy27: {num_sample: 13168, shuffle: true}
    ls_rare_verb: {num_sample: 26336, shuffle: true}
  train_data:
    - ${_ml_train}
    - ${_earning_train}
    - ${_ls_train}
    - ${_ml_nohint_train}
    - ${_earning_nohint_train}
    - ${_ls_nohint_train}
  val_data:
    - ${_earning_val}
    - ${_ml_val}
    - ${_ls_val}
    - ${_earning_nohint_val}
    - ${_ml_nohint_val}
    - ${_ls_nohint_val}
  train_batch_size: 128
  shuffle: true

trainer:
  nnodes: 2
  total_epochs: 2
  total_training_steps: null
