# Base4 v1 with bad-case replay: nominal 128 = 64 fresh + up to 64 replay.
# Rank replay inputs by the greedy baseline's raw word score; lower is harder.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - base4_2609r2_d3_e1_bs128_n8_r320_g16_flr
  - _self_

actor_rollout_ref:
  rollout:
    n: 8

data:
  train_batch_size: 128

trainer:
  total_epochs: 2

algorithm:
  bad_case_replay:
    enable: true
    capacity: 6400
    replay_size: 64
    sampling: worst
    selection:
      weights:
        word: 1.0
    seed: 42
