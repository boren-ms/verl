# v0d with zero voting thresholds for every measure.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_d3_e2_bs128_n8_r320_g16_flr
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 3}
      measures:
        char: {delta: rel, beta: 1.0, low: 0.0, high: 0.0}
        word: {delta: rel, beta: 1.0, low: 0.0, high: 0.0}
        lang: {delta: abs, beta: 1.0, low: 0.0, high: 0.0}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech
