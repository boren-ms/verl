# v1h2a: v1h2 with simple reward normalization (lowercase, remove punctuation, normalize whitespace).
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_d3_e2_bs128_n8_r320_g16_flr
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      text_norm: simple
      reduce: {mode: average, total: 3.6}
      measures:
        char: {delta: abs, beta: 1.0, vote: delta, clip: [-10, 10]}
        char_del: {delta: abs, beta: 0.1, vote: delta, clip: [-10, 10]}
        char_ins: {delta: abs, beta: 0.1, vote: delta, clip: [-10, 10]}
        word: {delta: abs, beta: 1.0, vote: delta, clip: [-10, 10]}
        word_del: {delta: abs, beta: 0.1, vote: delta, clip: [-10, 10]}
        word_ins: {delta: abs, beta: 0.1, vote: delta, clip: [-10, 10]}
        word_kw: {delta: abs, beta: 0.2, vote: delta, clip: [-10, 10]}
        word_lang: {delta: abs, beta: 1.0, vote: delta, clip: [-10, 10]}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech
