# Ordered two-stage mx0 variant with OpenML removed from stage 2.
# Stage 1 unchanged: OpenML3072 / Earnings2304 / LS2304 = 7680 rows.
# Stage 2: Earnings11522 / LS25349 = 36871 rows; no OpenML.
# Total44551 rows; each group is shuffled internally; stage order is preserved.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_d3_e2_bs128_n8_r320_g16_flr
  - _self_

data:
  data_source: null
  shuffle: false
  mix:
    - shuffle: true
      datasource:
        - {name: openml, sample: 3072, shuffle: true}
        - {name: earnings_fy27, sample: 2304, shuffle: true}
        - {name: ls_rare_verb, sample: 2304, shuffle: true}
    - shuffle: true
      datasource:
        - {name: earnings_fy27, sample: 11522, shuffle: true}
        - {name: ls_rare_verb, sample: 25349, shuffle: true}

trainer:
  total_epochs: 1

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 2}
      measures:
        char: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word_del: {delta: abs, beta: 0.2, vote: delta, clip: [-2, 2]}
        word_ins: {delta: abs, beta: 0.1, vote: delta, clip: [-2, 2]}
        word_kw: {delta: abs, beta: 0.2, vote: delta, clip: [-2, 2]}
        lang: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}
        fmt: {score: acc, beta: 0.05, vote: abs, clip: [-2, 2]}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech
