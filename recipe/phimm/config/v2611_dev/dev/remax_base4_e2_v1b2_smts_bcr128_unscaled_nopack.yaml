# Base4 BCR128 with v1b2 learning rate, SMTS, unscaled log probabilities,
# and no linear-attention packing. Nominal batch: 128 fresh + 128 replay.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - base4_2609r2_d3_e1_bs128_n8_r320_g16_flr
  - _self_

actor_rollout_ref:
  actor:
    loss_agg_mode: seq-mean-token-sum
    optim:
      lr: 6.0e-7
  model:
    use_linear_attention_packing: false
  rollout:
    n: 8
    temperature_scaled_log_probs: false

data:
  train_batch_size: 256

trainer:
  total_epochs: 2

algorithm:
  bad_case_replay:
    enable: true
    capacity: 6400
    replay_size: 128
    sampling: worst
    selection:
      weights:
        word: 1.0
    seed: 42
