# v2c_gt with further downweighted auxiliary votes; normalize by the beta sum of 1.7.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_d3_e2_bs128_n8_r320_g16_flr
  - _self_

actor_rollout_ref:
  rollout:
    gt_rollout: true

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 1.7}
      measures:
        word: {score: err, delta: rel, beta: 1.0, vote: delta, clip: [-1, 1]}
        word_del: {score: err, delta: rel, beta: 0.1, vote: delta, clip: [-1, 1]}
        word_ins: {score: err, delta: rel, beta: 0.1, vote: delta, clip: [-1, 1]}
        word_kw: {score: err, delta: rel, beta: 0.2, vote: delta, clip: [-1, 1]}
        lang: {delta: abs, beta: 0.3, vote: delta, clip: [-1, 1]}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech
