# L2_repo reruns the original L2 settings on the latest code.
# Original L2 source: c6a69fdb959c9d7281998b1fbf005de143d31383.
# Comparison code starts at 55f22f4b9c135a4af759a56d02f43268c2abd50e.
# Keep the original vLLM log-probability default; L2_lp opts in separately.
# L2 preserves the L1 recipe with lang/fmt beta reduced from 0.1 to 0.01 each.
# L1 steps 81-100: absolute lang/fmt votes near 1 contributed about +0.05.
# Their combined contribution becomes about +0.005 with the fixed divisor 4.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_d3_e2_bs128_n8_r320_g16_flr
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 4}
      measures:
        char: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word: {delta: abs, beta: 1.0, vote: delta, clip: [-2, 2]}
        word_del: {delta: abs, beta: 0.25, vote: delta, clip: [-2, 2]}
        word_ins: {delta: abs, beta: 0.25, vote: delta, clip: [-2, 2]}
        word_kw: {delta: abs, beta: 0.5, vote: delta, clip: [-2, 2]}
        lang: {score: acc, beta: 0.01, vote: abs, clip: [-2, 2]}
        fmt: {score: acc, beta: 0.01, vote: abs, clip: [-2, 2]}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech
