# Base4 v1b2 SMTS without temperature-scaled log probabilities or linear-attention packing.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config

defaults:
  - base4_2609r2_d3_e1_bs128_n8_r320_g16_flr
  - _self_

actor_rollout_ref:
  actor:
    loss_agg_mode: seq-mean-token-sum
    optim:
      lr: 6.0e-7
  model:
    use_linear_attention_packing: false
  rollout:
    n: 8
    temperature_scaled_log_probs: false

trainer:
  total_epochs: 2
