# Derived from remax_dev_base0_v1h_l0a; rollout temperature set to 1.0.
# Use lang/fmt accuracy with beta 0.1 and absolute votes; normalize by beta sum 1.6.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_d3_e2_bs128_n8_r320_g16_flr
  - _self_

actor_rollout_ref:
  actor:
    optim:
      warmup_style: cosine
  rollout:
    temperature: 1.0
    n: 16

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 1.6}
      measures:
        word: {delta: abs, beta: 1.0, vote: delta, clip: [-10, 10]}
        word_del: {delta: abs, beta: 0.1, vote: delta, clip: [-10, 10]}
        word_ins: {delta: abs, beta: 0.1, vote: delta, clip: [-10, 10]}
        word_kw: {delta: abs, beta: 0.2, vote: delta, clip: [-10, 10]}
        lang: {score: acc, beta: 0.1, vote: abs, clip: [-10, 10]}
        fmt: {score: acc, beta: 0.1, vote: abs, clip: [-10, 10]}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech

trainer:
  total_epochs: 1
