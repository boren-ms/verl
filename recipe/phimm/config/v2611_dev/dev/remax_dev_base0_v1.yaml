# v0 without the character vote; normalize by the remaining beta sum of 2.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_d3_e2_bs128_n8_r320_g16_flr
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 2}
      measures:
        word: {delta: rel, beta: 1.0, vote: delta}
        word_del: {delta: rel, beta: 0.25, vote: delta}
        word_ins: {delta: rel, beta: 0.25, vote: delta}
        word_kw: {delta: rel, beta: 0.25, vote: delta}
        lang: {delta: abs, beta: 0.25, vote: delta}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech
