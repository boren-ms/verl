# Independent language feedback is strongest for small sample/greedy WER differences.
# Smoothly taper beta 0.25 toward 0.05 with scale 0.15 (15 percentage points).
# At zero WER difference, a full language mismatch equals 20pp of the word component.
# Keep the divisor 3.6 to preserve v1h2b's lexical reward scale.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_d3_e2_bs128_n8_r320_g16_flr
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 3.6}
      measures:
        char: {delta: abs, beta: 0.75, vote: delta, clip: [-2, 2]}
        char_del: {delta: abs, beta: 0.1, vote: delta, clip: [-2, 2]}
        char_ins: {delta: abs, beta: 0.1, vote: delta, clip: [-2, 2]}
        word: {delta: abs, beta: 1.25, vote: delta, clip: [-2, 2]}
        word_del: {delta: abs, beta: 0.1, vote: delta, clip: [-2, 2]}
        word_ins: {delta: abs, beta: 0.1, vote: delta, clip: [-2, 2]}
        word_kw: {delta: abs, beta: 0.2, vote: delta, clip: [-2, 2]}
        lang:
          delta: abs
          beta: 0.25
          vote: delta
          clip: [-1, 1]
          wer_weight: {scale: 0.15, floor: 0.2}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech
