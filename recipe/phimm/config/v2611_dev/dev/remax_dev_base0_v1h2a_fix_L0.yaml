# L0 rerun of remax_dev_base0_v1h2a_fix with format reward and reweighted language/keyword deltas.
# Use latest boren/rl_2611_dev code (verified at e58fdd3ebc), including greedy-baseline
# alignment and source/target language validation fixes; _L0 tags the experiment.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_d3_e2_bs128_n8_r320_g16_flr
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 3.0}
      measures:
        word: {delta: abs, beta: 1.0, vote: delta, clip: [-10, 10]}
        word_del: {delta: abs, beta: 0.1, vote: delta, clip: [-10, 10]}
        word_ins: {delta: abs, beta: 0.1, vote: delta, clip: [-10, 10]}
        word_kw: {delta: abs, beta: 0.8, vote: delta, clip: [-10, 10]}
        lang: {delta: abs, beta: 0.5, vote: delta, clip: [-10, 10]}
        fmt: {delta: abs, beta: 0.5, vote: delta, clip: [-10, 10]}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech
