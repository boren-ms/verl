# Long-audio ASR rollout (recipe.phimm.long_asr_rollout), single corpus,
# pre-segmented: Dictation_SimuMixedLang_DTEST_FY26Q2_14 (mixlang_fy26q2).
#
# Identical to long_rollout_enus_conv_fy21q1_seg but consumes the offline
# pre-segmented mixlang dataset (data/val_data/mixlang_fy26q2_seg) where each row
# is already one SVAD segment (WavPath#start:end + parent_audio_path + seg_start),
# so no on-the-fly svad_explode is run. The rollout engine + data knobs live in
# base/long_rollout_asr.yaml; per-parent regrouping + DTER/EER scoring happens in
# the consumer. Only set actor_rollout_ref.model.path and data.output_path here.
#
# Results: {output_path}/<data_source>/details.jsonl + measures.json
#          {output_path}/summary.json
#
# python3 -m recipe.phimm.long_asr_rollout \
#     --config-path=config/rollout --config-name=long_rollout_mixlang_fy26q2_seg
hydra:
  searchpath:
    - file://verl/trainer/config
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
defaults:
  - long_rollout_asr
  - data/val_data/mixlang_fy26q2_seg
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2605/amlt-results/fast-llm-2605-qwen3-5-9b-s2-st-example-r2/90000/qwen_hf

data:
  output_path: az://orngwus2cresco/data/boren/data/verl/rollout/r2_baseline/long_audio_mixlang_fy26q2_seg
