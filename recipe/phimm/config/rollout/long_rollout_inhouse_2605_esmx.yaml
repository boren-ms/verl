# Long-audio ASR rollout (recipe.phimm.long_asr_rollout)
#
# Combines the fully-async rollout engine (FullyAsyncRollouter + MessageQueue)
# with long-recording segmentation + per-parent DTER/EER scoring. The rollout
# engine + data knobs live in base/long_rollout_asr.yaml; the segmentation
# dataset is reused as-is from the gen-style long eval
# (data/val_data/inhouse_2605_esmx).
# Only set actor_rollout_ref.model.path and data.output_path here.
#
# Results: {output_path}/<data_source>/details.jsonl + measures.json
#          {output_path}/summary.json
#
# python3 -m recipe.phimm.long_asr_rollout \
#     --config-path=config/rollout --config-name=long_rollout_inhouse_2605_esmx
hydra:
  searchpath:
    - file://verl/trainer/config
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
defaults:
  - long_rollout_asr
  - data/val_data/inhouse_2605_esmx
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2605/amlt-results/fast-llm-2605-qwen3-5-9b-s2-st-example-r2/90000/qwen_hf/

data:
  output_path: az://orngwus2cresco/data/boren/data/verl/rollout/r2_baseline/inhouse_2605_esmx
