# Long-audio ASR rollout (recipe.phimm.long_asr_rollout), TP=4 variant.
#
# Identical to long_rollout_inhouse_2605_all_seg but runs the vLLM rollout with
# tensor_model_parallel_size=4 (2 engine replicas of TP=4 across the 8 GPUs).
# The base long_rollout_asr already disables vLLM custom all-reduce, which is
# required for TP>1 on this node (custom_all_reduce.cuh 'invalid argument').
#
# Results: {output_path}/<data_source>/details.jsonl + measures.json
#          {output_path}/summary.json
#
# python3 -m recipe.phimm.long_asr_rollout \
#     --config-path=config/rollout --config-name=long_rollout_inhouse_2605_all_seg_tp4
hydra:
  searchpath:
    - file://verl/trainer/config
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
defaults:
  - long_rollout_asr
  - data/val_data/inhouse_2605_all_seg
  - _self_

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2605/amlt-results/fast-llm-2605-qwen3-5-9b-s2-st-example-r2/90000/qwen_hf/
  rollout:
    tensor_model_parallel_size: 4

data:
  output_path: az://orngwus2cresco/data/boren/data/verl/rollout/inhouse_2605_all_seg_tp4
