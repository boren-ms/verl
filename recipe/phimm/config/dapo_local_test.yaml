hydra:
  searchpath:
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - dapo_asr
  - _self_
  - data/train_data/local
  - data/val_data/local

val_reward:
  custom_reward_function:
    # path: recipe/phimm/reward/asr_bias.py
    path: recipe/phimm/reward/asr_bias.py
    name: compute_score
    reward_kwargs:
      beta: 0.0 # score = WER + beta*B-WER
      choice: "err" # "err", "acc", "wer"
      text_norm: english # english (default), identity, lower, basic, simple, simple_with_tag
      unit: word # word (default), char

train_reward:
  reward_model:
    reward_manager: naive #required
  custom_reward_function:
    # path: recipe/phimm/reward/asr_bias.py
    path: recipe/phimm/reward/asr_bias.py
    name: compute_score
    reward_kwargs:
      beta: 0.0 # score = WER + beta*B-WER
      choice: "err" # "err", "acc", "wer"
      text_norm: simple # english (default), identity, lower, basic, simple, simple_with_tag
      unit: word # word (default), char

actor_rollout_ref:
  rollout:
    gpu_memory_utilization: 0.3
    gt_rollout: true
    calculate_log_probs: True
  actor:
    loss_agg_mode: seq-mean-token-sum-norm
    use_kl_loss: False
    tis_imp_ratio_cap: 5

algorithm:
  filter_groups:
    enable: false
  norm_adv_by_std_in_grpo: False
  norm_adv_by_mean_in_grpo: False

trainer:
  experiment_name: dapo-phimm-test-lora-new
  save_freq: 1
  test_freq: 10000
  val_before_train: false
  # resume_mode: "auto"
  resume_mode: "disable"
  default_hdfs_dir: null
