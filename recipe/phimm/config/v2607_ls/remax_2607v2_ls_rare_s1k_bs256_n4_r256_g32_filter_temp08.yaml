hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - /data/train_data/ls_rare_nonempty_verb
  - _self_

actor_rollout_ref:
  actor:
    optim:
      lr: 1e-6
    checkpoint:
      load_contents: [model]
  rollout:
    n: 4
    temperature: 0.8

reward_functions:
  asr_measure:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2607
      reduce: mean
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        keyword: {beta: 1.0}
        lang: {beta: 1}
        fmt: {beta: 0.1, cut: 0.9}

reward_function_by_data_source:
  ls_rare_verb: asr_measure

algorithm:
  filter_groups:
    enable: true
    metric: remax_advantage
    mode: nonzero
    atol: 1e-6
    max_num_gen_batches: 10

data:
  train_batch_size: 256

trainer:
  nnodes: 4
  total_epochs: 30
  total_training_steps: 1000
  resume_mode: resume_path
  resume_from_path: az://orngwus2cresco/data/boren/outputs/v2607_ls/remax_2607v2_ls_rare_s1k_bs256_n4_r256_g32_filter_temp08/global_step_150
