hydra:
  searchpath:
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - dapo_asr
  - data/train_data/rare_fy23q2
  - data/val_data/entity
  - _self_

custom_reward_function:
  path: recipe/phimm/reward/asr_bias.py
  name: compute_score
  reward_kwargs:
    beta: 5 # score = WER + beta*B-WER
    choice: "err" # "err", "acc", "wer"
    text_norm: simple_with_tag # english (default), identity, lower, basic, simple, simple_with_tag
    unit: char # word (default), char

actor_rollout_ref:
  rollout:
    n: 8
  model:
    path: az://orngwus2cresco/data/boren/data/ckp/hf_models/Phi-4-multimodal-instruct
data:
  # train_batch_size: ${eval:8*trainer.nnodes*trainer.n_gpus_per_node}
  # gen_batch_size: ${data.train_batch_size}
  train_batch_size: 64
  total_epochs: 1
  #trainer:
  # total_training_steps: 9000
