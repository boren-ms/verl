hydra:
  searchpath:
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - grpo_asr
  - data/train_data/gpt_entity_sr_fy22_rare01 # 169547 utts, 1297.7 hrs
  - data/val_data/entity_rare
  - _self_

custom_reward_function:
  path: recipe/phimm/reward/asr_bias.py
  name: compute_score
  reward_kwargs:
    alpha: 1
    beta: 1 # score = alpha*WER + beta*B-WER
    choice: "err" # "err", "acc", "wer"
    text_norm: english # simple (default), identity, lower, basic, simple, simple_with_tag
    unit: word # word (default), char
    # max_wer: 0.1 # max wer 10% allowed to get reward, otherwise -100

actor_rollout_ref:
  rollout:
    n: 4
    gt_rollout: true
    temperature: 1.2
    calculate_log_probs: True # required by TIS
  actor:
    tis_imp_ratio_cap: 5

  model:
    path: az://orngwus2cresco/data/boren/data/ckp/hf_models/phi4-7b-fast-api-s2-final-v4
algorithm:
  adv_estimator: remax
data:
  train_batch_size: 64
  interleave_ds:
    probabilities: [0.8, 0.2] # tss: 0.8, fy22: 0.2
    stopping_strategy: first_exhausted
trainer:
  total_epochs: 2 # 24 step per epoch 
  val_before_train: true
  total_training_steps: 4400 # ~= 140k samples with bs64, 0.5 epoch
