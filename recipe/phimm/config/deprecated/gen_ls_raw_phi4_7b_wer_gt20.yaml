hydra:
  searchpath:
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - gen_asr
  - data/train_data/ls_raw
  - _self_

model:
  path: ${oc.env:DATA_PATH}/boren/data/ckp/hf_models/phi4-7b-fast-api-s2-final-v4

data:
  batch_size: 512
  local_output_dir: ~/outputs/gen_ls_raw_phi4_7b_wer_gt20
  remote_output_dir: ${oc.env:DATA_PATH}/boren/data/cache_datasets/gen_ls_raw_phi4_7b_wer_gt20
  output_split_size: 100000
  wer_range: [0.2, 100.0]

rollout:
  temperature: 0.0
  gpu_memory_utilization: 0.8
