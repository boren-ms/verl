# ReMax ASR — BASE scaffolding
# For Qwen3.5-9B Audio model with the PPO trainer
#
# Holds the stable model / actor / rollout / ref / trainer / data / algorithm
# scaffolding shared across ReMax ASR experiments.
#
# Experiment configs that include this base are expected to define:
#   - data/train_data/<...> and data/val_data/<...> (via defaults)
#   - reward / val_reward
#   - any experiment-specific overrides
#
# Run via the experiment config, e.g.:
#   python3 -m verl.trainer.main_ppo \
#       --config-path=../../../recipe/phimm/config \
#       --config-name=remax/<experiment>

defaults:
  - ppo_trainer
  - _self_

# ── Data ──────────────────────────────────────────────────────────────────
# train_data / val_data come from the separated dataset defaults in the
# experiment config.
data:
  train_files: null
  val_files: null
  train_batch_size: 64
  gen_batch_size: 1
  val_batch_size: -1
  max_prompt_length: 1024
  max_response_length: 768
  max_model_length: ${eval:${data.max_prompt_length}+${data.max_response_length}}
  mm_processor_kwargs:
    sampling_rate: 16000
  max_audio_dur: 40
  shuffle: true
  use_interleave: true
  model_version: 2607
  filter_overlong_prompts: false
  truncation: right
  prompt_key: prompt
  return_multi_modal_inputs: true
  dataloader_num_workers: 8
  eval_num_examine: 3
  train_num_examine: ${actor_rollout_ref.rollout.n}
  custom_cls:
    path: pkg://recipe.phimm.data.rl_dataset
    name: RLHFDataset

# ── Algorithm: ReMax (greedy baseline generated per prompt in fully async) ────
algorithm:
  adv_estimator: remax
  use_kl_in_reward: false
  kl_ctrl:
    kl_coef: 0.0
  rollout_correction:
    bypass_mode: true
    rollout_is: token            # token-level TIS (Truncated Importance Sampling)
    rollout_is_threshold: 5      # truncate IS weights at upper bound 5.0

# ── Model + Actor + Rollout + Ref ─────────────────────────────────────────
actor_rollout_ref:
  hybrid_engine: false
  nccl_timeout: 3600
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2607/amlt-results/fast-llm-2607-qwen3-5-9b-s2-data-v3.4-sr-afteraudio-lexical-fix/50000/qwen_hf
    trust_remote_code: false
    use_remove_padding: true
    use_fused_kernels: false
    enable_gradient_checkpointing: false
    lora_rank: 32
    lora_alpha: 64
    target_modules: "model.layers.*(gate_proj|up_proj|down_proj|q_proj|k_proj|v_proj|o_proj|in_proj_qkv|out_proj).*"
    exclude_modules: "model.embed_tokens_extend.*"
    lora:
      merge: true
  actor:
    strategy: fsdp2
    ppo_micro_batch_size_per_gpu: 4
    ppo_mini_batch_size: ${data.train_batch_size}
    ppo_epochs: 1
    use_kl_loss: false
    kl_loss_coef: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    loss_agg_mode: token-mean
    entropy_coeff: 0
    use_rollout_log_probs: true
    use_dynamic_bsz: true
    grad_clip: 1.0
    ppo_max_token_len_per_gpu: 3072
    # checkpoint:
    #   save_contents: ['model', 'optimizer', 'extra', 'hf_model']
    #   load_contents: ['model', 'optimizer', 'extra']
    optim:
      lr: 5e-6
      warmup_style: cosine
      min_lr_ratio: 0.1
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      fsdp_size: 4
      strategy: fsdp2
  rollout:
    name: vllm
    mode: async
    nnodes: ${rollout.nnodes}
    n_gpus_per_node: ${rollout.n_gpus_per_node}
    n: 16
    temperature: 1.2
    response_length: ${data.max_response_length}
    dtype: bfloat16
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 4
    gpu_memory_utilization: 0.9
    max_num_seqs: 32
    max_num_batched_tokens: ${eval:${actor_rollout_ref.rollout.max_num_seqs}*${data.max_model_length}}
    no_repeat_ngram_size: 15
    stop_token_ids: [248044, 248046]
    enforce_eager: false
    enable_chunked_prefill: true
    free_cache_engine: true
    load_format: safetensors
    calculate_log_probs: true
    log_prob_use_dynamic_bsz: true
    disable_log_stats: false
    layered_summon: true
    engine_kwargs:
      vllm:
        mm_processor_cache_gb: 0
        disable_custom_all_reduce: true
    checkpoint_engine:
      backend: nccl
      update_weights_bucket_megabytes: 2048
    val_kwargs:
      temperature: 0.0
      top_p: 1.0
      do_sample: false
      n: 1
  ref:
    strategy: fsdp2
    log_prob_use_dynamic_bsz: true
    fsdp_config:
      param_offload: true

# ── Rollout GPU pool (separate from trainer) ──────────────────────────────
rollout:
  nnodes: 1
  n_gpus_per_node: 4
  n: 12

# ── Trainer ───────────────────────────────────────────────────────────────
trainer:
  project_name: async_2607
  experiment_name: null          # auto-filled from the Hydra config (file) name
  logger: ["console", "wandb"]
  n_gpus_per_node: 4             # trainer GPU pool
  nnodes: 1
  total_epochs: 4
  total_training_steps: 100
  test_freq: 10
  save_freq: 10
  val_before_train: true
  resume_mode: auto
  log_val_generations: 10
  default_hdfs_dir: az://orngwus2cresco/data/boren/outputs/${trainer.project_name}/${trainer.experiment_name}
  default_local_dir: ${oc.env:HOME}/checkpoints/${trainer.project_name}/${trainer.experiment_name}
  validation_data_dir: ${trainer.default_hdfs_dir}/val_data_gen
  v1:
    trainer_mode: separate_async
    separate_async:
      parameter_sync_step: 1
      num_warmup_batches: 1
      hybrid_rollout:
        enable_switch: false
        adaptive_switch_threshold: true

# ── Ray runtime env ───────────────────────────────────────────────────────
ray_kwargs:
  ray_init:
    runtime_env:
      env_vars:
        VERL_USE_EXTERNAL_MODULES: hf_qwen35_audio

