defaults:
  - ppo_trainer
  - _self_

data:
  train_files: null
  val_files: null
  trust_remote_code: true
  max_prompt_length: 8192
  max_response_length: 1024
  train_batch_size: 8
  gen_batch_size: ${data.train_batch_size}
  val_batch_size: 1024
  shuffle: false
  custom_cls:
    path: recipe/phimm/data/rl_dataset.py
    name: RLHFDataset
  eval_num_examine: 3
  train_num_examine: 1

val_reward:
  custom_reward_function:
    path: recipe/phimm/reward/asr_bias.py
    name: eval_score
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  kl_ctrl:
    kl_coef: 0.0
  filter_groups:
    enable: true
    metric: seq_reward
    max_num_gen_batches: 100

actor_rollout_ref:
  actor:
    use_kl_loss: false
    kl_loss_coef: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean
    entropy_coeff: 0
    ppo_micro_batch_size_per_gpu: 32 # trajectories
    ppo_mini_batch_size: "${eval:${trainer.ngpus}*${data.train_batch_size}}" # global batch size
    ppo_epochs: 1
    optim:
      lr: 1e-5
      warmup_style: cosine
      min_lr_ratio: 0.1

    fsdp_config:
      param_offload: false
      optimizer_offload: false
      use_orig_params: true
    strategy: fsdp2
  model:
    path: null
    trust_remote_code: true
    use_remove_padding: true
    use_fused_kernels: false
    lora_rank: 320
    lora_alpha: 640
    patch_phi4mm: true
    target_modules: "model.layers.*(qkv_proj|o_proj|gate_up_proj|down_proj).*"
    exclude_modules: "model.embed_tokens_extend.*" # must have
    enable_gradient_checkpointing: True
  rollout:
    n: 4
    max_num_batched_tokens: 16384
    log_prob_micro_batch_size_per_gpu: "${eval:${actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu}*2}"
    tensor_model_parallel_size: 1
    name: vllm
    temperature: 1.0
    gpu_memory_utilization: 0.8
    load_format: safetensors
  ref:
    strategy: fsdp2
    log_prob_micro_batch_size_per_gpu: ${actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu}
    fsdp_config:
      param_offload: true

reward_model:
  reward_manager: dapo
  overlong_buffer:
    enable: true
    len: 128
    penalty_factor: 1.0
    log: false

trainer:
  project_name: verl_asr
  logger: ["console", "wandb"]
  experiment_name: dapo-phimm-test
  n_gpus_per_node: 8
  ngpus: ${eval:${trainer.n_gpus_per_node}*${trainer.nnodes}}
  nnodes: 1
  save_freq: 100
  test_freq: 100
  total_epochs: 1
  resume_mode: auto
  val_before_train: false
  total_training_steps: null # disable steps
  default_hdfs_dir: ${oc.env:DATA_PATH}/boren/outputs/${trainer.project_name}/${trainer.experiment_name}
  default_local_dir: ${oc.env:HOME}/checkpoints/${trainer.project_name}/${trainer.experiment_name}
  val_only: False
  validation_data_dir: ${trainer.default_local_dir}/val_data_gen
