# Base scaffolding for long-audio ASR rollout (recipe.phimm.long_asr_rollout).
#
# Combines the fully-async rollout engine (FullyAsyncRollouter + MessageQueue,
# as in recipe.phimm.asr_rollout) with long-recording segmentation + per-parent
# DTER/EER scoring (as in recipe.phimm.main_long_eval_asr):
#   svad_explode -> FullyAsyncRollouter generate -> regroup per parent wav ->
#   DisfluencyTolerant TER + entity EER (asr_inhouse_measure.eval_score).
#
# Experiment configs that include this base only need to set
# actor_rollout_ref.model.path, the data/val_data/<...> dataset default (the
# long-audio segments, reused from the gen-style long eval), and
# data.output_path.
defaults:
  - ppo_trainer
  - _self_

data:
  # Mirror remax_asr.yaml's data settings (single-sample async streaming, seek-based
  # audio loading) so eval and training consume audio identically. Only the
  # long-rollout-specific keys differ: train/val files reuse the val_data segment
  # dataset, plus output_path / log_interval for scoring.
  custom_cls:
    path: pkg://recipe.phimm.data.rl_dataset
    name: RLHFDataset
  # The rollouter reads train_files/val_files; reuse the val_data dataset
  # default (long-audio segments via svad_explode) for both so the same
  # dataset yaml drives the segmentation as in main_long_eval_asr.
  train_files: ${data.val_data}
  val_files: ${data.val_data}
  train_batch_size: 0          # must be 0 for fully async
  gen_batch_size: 1            # single-sample streaming for async
  val_batch_size: -1
  output_path: null
  max_prompt_length: 1024
  max_response_length: 768
  max_model_length: ${eval:${data.max_prompt_length}+${data.max_response_length}}
  mm_processor_kwargs:
    sampling_rate: 16000
  max_audio_dur: 40
  # seek-based loading, one connection per sample (fits async single-sample streaming)
  chunk_load_mode: sample
  shuffle: false
  filter_overlong_prompts: false
  truncation: right
  prompt_key: prompt
  return_raw_chat: true
  return_multi_modal_inputs: true
  # Eval must cover every segment: concatenate the per-corpus datasets instead of
  # interleaving them (interleave stops at the shortest corpus, dropping segments
  # from longer ones — the real cause of the all_seg segment loss).
  interleave_datasets: false
  # Eval rollout is audio-load-bound (unlike trainer-bound remax which uses 0):
  # parallel workers keep the rollout replicas fed, otherwise GPUs starve.
  dataloader_num_workers: 8
  log_interval: 100

rollout:
  nnodes: 1
  n_gpus_per_node: 8
  n: 1
  total_rollout_steps: null

actor_rollout_ref:
  hybrid_engine: false
  model:
    path: null
    trust_remote_code: false
  actor:
    ppo_mini_batch_size: 64
  rollout:
    name: vllm
    mode: async
    n: ${rollout.n}
    nnodes: ${rollout.nnodes}
    n_gpus_per_node: ${rollout.n_gpus_per_node}
    temperature: 0.0
    top_p: 1.0
    response_length: ${data.max_response_length}
    prompt_length: ${data.max_prompt_length}
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.75
    load_format: auto
    engine_kwargs:
      vllm:
        disable_custom_all_reduce: true
    calculate_log_probs: true

async_training:
  staleness_threshold: 1000
  trigger_parameter_sync_step: 1
  require_batches: 1
  partial_rollout: false
  # Unbounded queue (deque maxlen=None) so the long-audio eval never drops a
  # segment when the consumer lags the rollout replicas. A bounded queue silently
  # evicts the oldest queued segment under load, inflating DTER.
  max_queue_size: null
  concurrent_samples_per_replica: 64

reward:
  custom_reward_function:
    path: pkg://recipe.phimm.reward.asr_inhouse_measure
    name: dummy_score
  num_workers: 8

trainer:
  n_gpus_per_node: 8
  nnodes: 1
  total_epochs: 1
  project_name: long_asr_rollout
  experiment_name: long_audio_rollout
  resume_mode: disable
  default_local_dir: ./long_rollout_ckpt
