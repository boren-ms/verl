# Base config for gen-style long-audio ASR eval (recipe.phimm.main_long_eval_asr).
#
# verl-mirror native: generation runs through standalone vLLM server replicas
# (verl.workers.rollout.llm_server.LLMServerManager), the same code path as
# recipe.phimm.main_asr_gen. Long-recording eval flow:
#   svad_explode / pre-segment  ->  generate  ->  regroup per parent wav  ->
#   DisfluencyTolerant TER + entity EER (asr_inhouse_measure.eval_score).
# Per-eval configs only need to set actor_rollout_ref.model.path, the
# data/val_data default, and data.output_path.
defaults:
  - ppo_trainer
  - _self_

data:
  custom_cls:
    path: recipe/phimm/data/rl_dataset.py
    name: RLHFDataset
  # One bounded batch covers many segments; grouping happens after all segments
  # finish, so this need NOT exceed the per-recording segment count.
  batch_size: 256
  concurrency: 256             # max in-flight generation requests
  num_workers: 4               # bounded to keep host RAM safe with audio batches
  max_prompt_length: 4096
  max_response_length: 1024
  # SVAD caps at 40s, so 50 leaves headroom.
  max_audio_dur: 50
  return_raw_chat: true
  return_multi_modal_inputs: false   # vLLM computes audio embeddings internally
  output_path: null
  # Passed through to asr_inhouse_measure.eval_score (DTER/EER backend).
  measure_kwargs: {}
  # Generation sampling overrides (passed to vLLM SamplingParams)
  stop_token_ids: [248044, 248046]

actor_rollout_ref:
  model:
    path: null
    trust_remote_code: true
  rollout:
    name: vllm
    nnodes: 1                        # standalone server mode
    temperature: 0.0
    top_p: 1.0
    response_length: ${data.max_response_length}
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.85
    max_num_seqs: 24
    enforce_eager: false
    enable_chunked_prefill: true     # interleaves prefill of long prompts with ongoing decodes
    load_format: auto                # load real weights (not dummy)
    free_cache_engine: false         # keep cache for continuous generation
    calculate_log_probs: false

trainer:
  experiment_name: phimm_long_eval   # required for logging
  n_gpus_per_node: 8
  nnodes: 1
