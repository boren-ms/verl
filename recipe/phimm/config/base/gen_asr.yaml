defaults:
  - generation
  - _self_

nccl_timeout: 7200

trainer:
  experiment_name: phimm_asr_gen # required for logging
  
data:
  path: null
  batch_size: 1024              # large dispatch -> vLLM stays saturated end-to-end
  output_split_size: 20000      # fewer parquet writes; larger chunks per blob upload
  num_workers: 16               # bounded to keep host RAM safe with audio batches
  prefetch_factor: 2
  pin_memory: false             # audio batches are big; pinned memory would balloon host RSS
  persistent_workers: true
  prefetch_depth: 3             # prep<->generate<->consume pipeline depth (host RAM bound)

model:
  path: null
  trust_remote_code: True

rollout:
  temperature: 0.0
  top_k: -1 # 0 for hf rollout, -1 for vllm rollout
  top_p: 1
  max_model_len: 1536
  max_num_batched_tokens: ${rollout.max_model_len*rollout.max_num_seqs} # 16k * 8 prefilled per step
  max_num_seqs: 1024             # concurrent decodes (matches input batch)
  dtype: bfloat16 # should align with FSDP
  gpu_memory_utilization: 0.78   # share H100 with FSDP shard + vLLM weights + KV cache
  log_prob_micro_batch_size_per_gpu: 8
  load_format: dummy # need to force reload from fsdp to vllm
  enforce_eager: false
  enable_chunked_prefill: true   # interleaves prefill of long prompts with ongoing decodes
  free_cache_engine: true
