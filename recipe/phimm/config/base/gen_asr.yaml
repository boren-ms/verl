defaults:
  - generation
  - _self_

trainer:
  experiment_name: phimm_asr_gen # required for logging
  
data:
  path: null
  batch_size: 128
  # num_workers: 8

  output_split_size: 1000000 # 1m samples ~500M
  wer_kwargs:
    text_norm: english # english (default), identity, lower, basic, simple, simple_with_tag
    unit: word # word (default), char

model:
  path: null
  trust_remote_code: True

rollout:
  temperature: 0.0
  top_k: -1 # 0 for hf rollout, -1 for vllm rollout
  top_p: 1
  prompt_length: 7168
  max_num_batched_tokens: 65536 # 8192*8
  dtype: bfloat16 # should align with FSDP
  gpu_memory_utilization: 0.8
  log_prob_micro_batch_size_per_gpu: 8
  load_format: dummy # need to force reload from fsdp to vllm
