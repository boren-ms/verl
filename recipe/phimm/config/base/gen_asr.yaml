defaults:
  - generation
  - _self_

nccl_timeout: 1800

# Callable signature: (solution_str, ground_truth, **kwargs).
# Return a dict with n_err and n_ref; other measurements are also saved, except n_edge/edge_wer.
# reward_kwargs configure scoring and response parsing. A null path falls back to openasr_eval.
custom_reward_function:
  path: recipe/phimm/reward/asr_eval.py
  name: openasr_eval
  reward_kwargs:
    version: 2607

trainer:
  experiment_name: null # required for logging
  nnodes: 1
  n_gpus_per_node: 8
  
data:
  # Generation concatenates all sources; unreadable audio raises instead of substituting another sample.
  # Use a fresh output_path when rerunning older multi-source outputs made with training interleaving.
  # Pipeline failures propagate to the job; completed output splits remain available for resume.
  # Buffered batches are flushed on success, not during failure cleanup.
  # Output keywords use a string-list schema, including batches with only empty or null keywords.
  # Scoring passes each sample's extra_info and custom_reward_function.reward_kwargs.
  # The default OpenASR metrics are score, wer, n_err and n_ref; keywords remain metadata.
  # Use a fresh output_path to rescore older outputs; resume does not recompute existing measurements.
  # output_path is a directory of part-NNN.jsonl files, including transcripts, metadata and measurements.
  # Writing and resume support JSONL only; directories containing old Parquet splits are rejected.
  # Downstream consumers of new splits must load JSONL rather than globbing for Parquet.
  version: 2607
  validation_shuffle: false
  resume_from_output: true
  path: null
  batch_size: 512              # large dispatch -> vLLM stays saturated end-to-end
  output_split_size: 20000      # flush whole batches after this many rows
  num_workers: 4               # bounded to keep host RAM safe with audio batches
  prefetch_factor: 4
  pin_memory: false             # audio batches are big; pinned memory would balloon host RSS
  persistent_workers: false    # avoid shmem buildup over many batches leading to OOM after ~330 batches in prior runs
  prefetch_depth: 3             # prep<->generate<->consume pipeline depth (host RAM bound)
  max_audio_dur: 40             # cap audio length to avoid one rank stalling on extremely long samples (NCCL timeout)
  chunk_load_mode: cached       # "cached" uses load_chunk_example (ChunkManager, loads full chunk into memory); "sample" uses load_chunk_sample (seek-based, one blob connection per sample)

model:
  path: null
  trust_remote_code: false

rollout:
  n: 1
  engine_kwargs:
    vllm:
      gdn_prefill_backend: triton
      quantization: fp8

  temperature: 0.0
  top_k: -1 # 0 for hf rollout, -1 for vllm rollout
  top_p: 1
  dtype: auto
  gpu_memory_utilization: 0.9   # leave startup headroom for driver and framework allocations
  log_prob_micro_batch_size_per_gpu: 8
  prompt_length: 1024
  response_length: 768
  load_format: safetensors # need to force reload from fsdp to vllm
  max_num_seqs: 36
  enforce_eager: false
  enable_chunked_prefill: true   # interleaves prefill of long prompts with ongoing decodes
  free_cache_engine: true
  no_repeat_ngram_size: 15
  stop: ["<|im_end|>"]
  stop_token_ids: [248044, 248046]