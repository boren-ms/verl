hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - distill_asr
  - data/train_data/bad_mix13k_lid05_teacher_asr
  - data/val_data/mixlang_fy26q2_zh_seg_openml_punc
  - _self_

reward_functions:
  openml:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      reduce: mean
      measures:
        char: {beta: 0.5}
        word: {beta: 0.5}
        lang: {beta: 1.0}
        fmt: {beta: 1.0}
        bracket: {beta: 1.0}
        repeat: {beta: 1.0}

reward_function_by_data_source:
  mix: openml
  openml: openml

val_reward:
  reward_manager: long_audio_grouped
  reward_functions:
    inhouse:
      path: recipe/phimm/reward/asr_inhouse_measure.py
      name: eval_score
      reward_kwargs:
        locale: zh-cn
    inhouse_en:
      path: recipe/phimm/reward/asr_inhouse_measure.py
      name: eval_score
      reward_kwargs:
        locale: en-us
    openml:
      path: recipe/phimm/reward/asr_edge.py
      name: openasr_eval
  reward_function_by_data_source:
    mixlang_fy26q2: inhouse
    openml_bad: openml
    enus_conv_fy21q1: inhouse_en

actor_rollout_ref:
  rollout:
    n: 16
    gt_rollout: false
    temperature: 1.2
    gpu_memory_utilization: 0.9
    max_num_seqs: 32
  actor:
    ppo_micro_batch_size_per_gpu: 4
    ppo_mini_batch_size: ${data.train_batch_size}
    optim:
      lr: 5e-6
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2607/amlt-results/fast-llm-2607-qwen3-5-9b-s2-data-v3.4-sr-afteraudio-lexical-fix/50000/qwen_hf/
    trust_remote_code: false
    lora_rank: 32
    lora_alpha: 64
    target_modules: "model.layers.*(gate_proj|up_proj|down_proj|q_proj|k_proj|v_proj|o_proj|in_proj_qkv|out_proj).*"

data:
  trust_remote_code: false
  shuffle: true
  use_interleave: false
  model_version: 2607
  max_prompt_length: 1024
  max_response_length: 768
  train_batch_size: 64
  val_batch_size: -1

trainer:
  project_name: ver_2607
  experiment_name: distill_2607v1_bad_mix13k_s200_bs64_lid05_sfl_tm1
  nnodes: 1
  total_epochs: 4
  total_training_steps: 200
  test_freq: 10
  save_freq: 10
  val_before_train: true