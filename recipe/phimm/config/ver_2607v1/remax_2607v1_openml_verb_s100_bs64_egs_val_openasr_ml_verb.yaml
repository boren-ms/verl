hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base

defaults:
  - /remax_asr
  - /data/train_data/openml_verb
  - /data/val_data/openasr_ml_verb
  - _self_

algorithm:
  adv_scale: {openml: 1.0, default: 1.0}

trainer:
  save_freq: 1000
  resume_mode: disable
  total_training_steps: 12

actor_rollout_ref:
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2607/amlt-results/fast-llm-2607-qwen3-5-9b-s2-data-v3.4-sr-afteraudio-lexical-fix/50000/qwen_hf
  rollout:
    # vLLM CUDA graphs can become invalid after repeated trainer/rollout
    # weight switches; eager execution keeps validation transitions stable.
    enforce_eager: true
    max_num_seqs: 16
    checkpoint_engine:
      update_weights_bucket_megabytes: 256

ray_kwargs:
  ray_init:
    runtime_env:
      env_vars:
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "900"

reward_functions:
  openml:
    path: pkg://recipe.phimm.reward.asr_measure
    name: compute_score
    reward_kwargs:
      reduce: mean
      measures:
        char: {beta: 0.5}
        word: {beta: 0.5}
        lang: {beta: 1.0}
        fmt: {beta: 1.0}
        bracket: {beta: 1.0}
        repeat: {beta: 1.0}

reward_function_by_data_source:
  mix: openml
  openml: openml

reward:
  num_workers: 8

val_reward:
  group_segment: true
  reward_functions:
    openml:
      path: pkg://recipe.phimm.reward.asr_edge
      name: openasr_eval
  reward_function_by_data_source:
    de_fleurs: openml
    fr_fleurs: openml
    it_fleurs: openml
    es_fleurs: openml
    pt_fleurs: openml
    de_mcv: openml
    fr_mcv: openml
    it_mcv: openml
    es_mcv: openml
    fr_mls: openml
    it_mls: openml
    es_mls: openml
    pt_mls: openml
