hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - data/train_data/earningscall-fy27-en-us-batch1-verb
  - _self_

reward_functions:
  asr_measure:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2607
      reduce: mean
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        keyword: {beta: 2.0, cut: 0.5}
        lang: {beta: 0.1, cut: 0.25}
        fmt: {beta: 0.1, cut: 0.5}

reward_function_by_data_source:
  earning_fy27_verb: asr_measure

actor_rollout_ref:
  rollout:
    n: 4
  model:
    path: az://orngwus2cresco/data/boren/outputs/ver_2607/remax_2607v1_openml_verb_s100_bs256_lid/global_step_100/qwen_hf/

data:
  train_batch_size: 128

trainer:
  nnodes: 4
  total_epochs: 15
  total_training_steps: 1000