hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base
  - data/train_data/earningscall-fy27-en-us-batches-tts-clean
  - _self_

reward_functions:
  asr_measure:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      version: 2607
      reduce: mean
      measures:
        char: {beta: 1.0}
        word: {beta: 1.0}
        keyword: {beta: 3.0}
        lang: {beta: 1.0, cut: 0.5}
        fmt: {beta: 1.0, cut: 1.0}

reward_function_by_data_source:
  earning_fy27_verb: asr_measure
  earning_fy27_lex: asr_measure
  earnings_tts_clean_verb: asr_measure
  earnings_tts_clean_lex: asr_measure

actor_rollout_ref:
  actor:
    # Resume the saved model, but reset the optimizer after the high-KL collapse.
    optim:
      lr: 7e-6
  rollout:
    n: 4
    engine_kwargs:
      vllm:
        gdn_prefill_backend: triton
  model:
    path: az://orngwus2cresco/data/boren/outputs/ver_2607/remax_2607v1_openml_verb_s100_bs256_lid/global_step_100/qwen_hf/
    lora_rank: 128

algorithm:
  filter_groups:
    enable: true
    metric: remax_advantage
    mode: nonzero
    atol: 1e-6
    max_num_gen_batches: 10

data:
  train_batch_size: 128

trainer:
  nnodes: 4
  total_epochs: 30
  total_training_steps: 1000
