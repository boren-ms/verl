hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - grpo_asr
  - data/train_data/oss_bad_lang
  # - data/val_data/open_ls_rc5
  - data/val_data/bad_lid_ls_h100
  - _self_

reward_functions:
  language:
    path: recipe/phimm/reward/asr_measure.py
    name: compute_score
    reward_kwargs:
      reduce: mean
      measures:
        char: {beta: 0.5}
        word: {beta: 0.5}
        lang: {beta: 1.0}
        fmt: {beta: 1.0}
        # tail_hallu: {beta: 1.0}

reward_function_by_data_source:
  oss_bad_lang: language

val_reward:
#   reward_manager: long_audio_grouped
  reward_functions:
    openml:
      path: recipe/phimm/reward/asr_eval.py
      name: openasr_eval
  reward_function_by_data_source:
    bad_lid_short: openml
    ls_clean_h100_rc5: openml
    ls_other_h100_rc5: openml

actor_rollout_ref:
  rollout:
    n: 16
    gt_rollout: false
    temperature: 1.2
    calculate_log_probs: True
    use_rollout_log_probs_as_old: true
    gpu_memory_utilization: 0.9
    max_num_seqs: 32
  actor:
    tis_imp_ratio_cap: 5
    ppo_micro_batch_size_per_gpu: 4
    ppo_mini_batch_size: ${data.train_batch_size}
    ppo_epochs: 1
    optim:
      lr: 5e-6
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2607/amlt-results/fast-llm-2607-qwen3-5-9b-s2-data-v3.4-sr-afteraudio-lexical-fix/50000/qwen_hf/
    trust_remote_code: false
    lora_rank: 320
    lora_alpha: 320
    target_modules: "model.layers.*(gate_proj|up_proj|down_proj).*"

algorithm:
  adv_estimator: remax
  adv_scale: {openml: 1.0, default: 1.0}

data:
  trust_remote_code: false
  shuffle: true # shuffle done by interleave
  use_interleave: false
  max_prompt_length: 1024
  max_response_length: 768
  train_batch_size: 64
  val_batch_size: -1

trainer:
  project_name: 2607v1_lid
  nnodes: 1
  total_epochs: 4
  total_training_steps: 100
  test_freq: 10
  save_freq: 10
  val_before_train: true