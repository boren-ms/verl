hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - grpo_asr
  - data/train_data/mix_cv15_all
  - data/val_data/mixlang_fy26q2_zh_seg
  - _self_

custom_reward_function:
  path: recipe/phimm/reward/mix_lang_measure.py
  name: compute_score
  reward_kwargs:
    reduce: mean
    measures:
      char: {beta: 1.0}
      word: {beta: 1.0}
      # punc: {beta: 1.0}

val_reward:
  reward_manager: long_audio_grouped
  custom_reward_function:
    path: recipe/phimm/reward/asr_inhouse_measure.py
    name: eval_score
    reward_kwargs:
      locale: zh-cn

actor_rollout_ref:
  rollout:
    n: 12
    gt_rollout: false
    temperature: 1.0
    calculate_log_probs: True
    use_rollout_log_probs_as_old: true
    gpu_memory_utilization: 0.7
    max_num_seqs: 24
  actor:
    tis_imp_ratio_cap: 5
    ppo_micro_batch_size_per_gpu: 6
    ppo_mini_batch_size: 64
    ppo_epochs: 2
    optim:
      lr: 5e-6
  model:
    path: az://orngwus2cresco/data/speech/projects/phi-fastllm-2605/amlt-results/fast-llm-2605-qwen3-5-9b-s2-st-example-r2/90000/qwen_hf/
algorithm:
  adv_estimator: gdpo
  # GDPO normalizes each reward dimension independently within each group before
  # aggregating. These keys must be returned by compute_score (see punc_cap_measure.py).
  gdpo_reward_keys: [char, word]
  # Optional per-dimension weights; equal weights when omitted.
  gdpo_reward_weights: [1.0, 1.0]

data:
  max_prompt_length: 1204
  max_response_length: 512
  train_batch_size: 64
  val_batch_size: -1
trainer:
  nnodes: 1
  total_epochs: 4
  total_training_steps: 1000
  test_freq: 10
  save_freq: 10
  val_before_train: false