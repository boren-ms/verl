hydra:
  searchpath:
    - file://recipe/phimm/config/base
    - file://verl/trainer/config
defaults:
  - gen_asr
  - data/train_data/prod_fy22_sr
  - _self_

model:
  path: ${oc.env:DATA_PATH}/boren/data/ckp/hf_models/phi4-7b-fast-api-s2-final-v4

data:
  batch_size: 1024
  local_output_dir: ~/outputs/gen_prod_fy22_phi4_7b_wer_01_20_err_1_20
  remote_output_dir: ${oc.env:DATA_PATH}/boren/data/cache_datasets/gen_prod_fy22_phi4_7b_wer_01_20_err_1_20
  output_split_size: 100000
  wer_range: [0.001, 0.2]
  err_range: [1, 20]

rollout:
  temperature: 0.0
  top_k: -1 # 0 for hf rollout, -1 for vllm rollout
  prompt_length: 6000
  response_length: 1024
  gpu_memory_utilization: 0.8