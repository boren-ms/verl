<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repetition Hallucinations — phi7b Voxpopuli</title>
<style>
  :root {
    --bg: #f8f9fa; --card-bg: #fff; --border: #dee2e6; --text: #212529;
    --muted: #6c757d; --red: #dc3545; --red-bg: #fff5f5; --green: #198754;
    --green-bg: #f0fdf4; --blue: #0d6efd; --blue-bg: #eff6ff;
    --orange: #fd7e14; --orange-bg: #fff7ed;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; padding: 2rem;
  }
  h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.5rem; }
  .stats { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 1rem 1.5rem; min-width: 140px;
  }
  .stat-card .value { font-size: 1.8rem; font-weight: 700; color: var(--red); }
  .stat-card .label { font-size: 0.85rem; color: var(--muted); }
  .legend {
    display: flex; gap: 1.5rem; margin-bottom: 1.5rem; font-size: 0.85rem; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 0.4rem; }
  .legend-swatch {
    width: 14px; height: 14px; border-radius: 3px; display: inline-block;
  }
  .case {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 1rem; overflow: hidden;
  }
  .case-header {
    background: #f1f3f5; padding: 0.6rem 1rem; display: flex;
    align-items: center; gap: 1rem; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .rank { font-weight: 700; font-size: 1.1rem; color: var(--red); min-width: 2rem; }
  .audio-id {
    font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.82rem;
    color: var(--muted); background: #e9ecef; padding: 2px 8px; border-radius: 4px;
  }
  .pattern-tag {
    font-size: 0.82rem; color: var(--red); background: var(--red-bg);
    padding: 2px 10px; border-radius: 12px; font-weight: 600; margin-left: auto;
  }
  .transcript-pair { padding: 0.8rem 1rem; }
  .transcript { padding: 0.5rem 0; font-size: 0.92rem; line-height: 1.7; }
  .transcript .label {
    display: inline-block; width: 3rem; font-weight: 700; font-size: 0.75rem;
    text-transform: uppercase; letter-spacing: 0.05em; vertical-align: top; padding-top: 2px;
  }
  .ref-row .label { color: var(--green); }
  .hyp-row .label { color: var(--blue); }
  .transcript .text { display: inline; }
  .ref-row { border-bottom: 1px dashed #e9ecef; }
  span.rep {
    background: #fecaca; color: #991b1b; font-weight: 600;
    padding: 1px 4px; border-radius: 3px; border: 1px solid #fca5a5;
  }
  .footer { margin-top: 2rem; font-size: 0.8rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<h1>Repetition Hallucinations</h1>
<p class="subtitle">phi7b_20260413 &mdash; Voxpopuli &mdash; 0 cases detected from 1,842 utterances</p>

<div class="stats">
  <div class="stat-card"><div class="value">0</div><div class="label">Total Cases</div></div>
  <div class="stat-card"><div class="value">0</div><div class="label">Severe (8+ repeats)</div></div>
  <div class="stat-card"><div class="value">0</div><div class="label">Moderate (4-7 repeats)</div></div>
  <div class="stat-card"><div class="value">0</div><div class="label">Mild (3 repeats)</div></div>
</div>

<div class="legend">
  <div class="legend-item"><span class="legend-swatch" style="background:#fecaca;border:1px solid #fca5a5"></span> Repeated sequence</div>
</div>


<div class="footer">
  Generated from generate_voxpopuli.txt &mdash; 1,842 total utterances
</div>
</body>
</html>
