# Bad-case replay (bcr) variant of remax_dev_base0_v1h2a_fix.
# Preserve its training/reward settings and greedy baseline alignment fix.
hydra:
  searchpath:
    - file://recipe/phimm/config
    - file://verl/trainer/config
defaults:
  - base0_2609r2_d3_e2_bs128_n8_r320_g16_flr
  - _self_

reward_functions:
  librispeech:
    path: recipe/phimm/reward/asr_vote.py
    name: compute_score
    reward_kwargs:
      version: 2609
      reduce: {mode: average, total: 1.6}
      measures:
        word: {delta: abs, beta: 1.0, vote: delta, clip: [-10, 10]}
        word_del: {delta: abs, beta: 0.1, vote: delta, clip: [-10, 10]}
        word_ins: {delta: abs, beta: 0.1, vote: delta, clip: [-10, 10]}
        word_kw: {delta: abs, beta: 0.2, vote: delta, clip: [-10, 10]}
        lang: {delta: abs, beta: 0.2, vote: delta, clip: [-10, 10]}

reward_function_by_data_source:
  openml: librispeech
  earnings_fy27: librispeech
  ls_rare_verb: librispeech

algorithm:
  bad_case_replay:
    enable: true
    capacity: 400
    add_ratio: 0.20
    replay_ratio: 0.10
    sampling_strategy: random
    selection:
      weights:
        word: 1.0
        # Disable the inherited char weight: this reward configuration does not return char.
        char: 0.0
    seed: 42
